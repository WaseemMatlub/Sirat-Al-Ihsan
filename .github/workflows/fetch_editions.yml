name: fetch-editions
on: workflow_dispatch
permissions: { contents: write }
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download the Ihya us-Sunnah editions (used with permission)
        run: |
          mkdir -p sources/ihya
          for n in al-hikam nahw-mir sharh-miat-amil hidayat-al-nahw sharh-khalid-al-azhari-ala-al-ajurrumiyya; do
            curl -fsSL -A "Mozilla/5.0" "https://www.ihyaussunnah.co.uk/kutub/editions/$n.txt" -o "sources/ihya/$n.txt"
            wc -c "sources/ihya/$n.txt"
          done
      - run: |
          git config user.name "github-actions"; git config user.email "actions@github.com"
          git add sources/ihya && git commit -m "Ihya us-Sunnah editions" && git pull --rebase && git push || echo nothing
