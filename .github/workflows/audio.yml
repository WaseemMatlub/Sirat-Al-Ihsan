name: Generate English narration
on:
  workflow_dispatch:
    inputs:
      voice:
        description: "Kokoro voice (e.g. bm_george, bm_lewis, bf_emma, bf_isabella)"
        default: "bm_george"
  push:
    branches: [main]
    paths: ["data/texts/**"]
permissions:
  contents: write
concurrency: { group: audio, cancel-in-progress: false }
jobs:
  narrate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq espeak-ng ffmpeg
          pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu
          pip install --quiet "kokoro>=0.9.4" soundfile "misaki[en]"
      - name: Generate audio
        env: { VOICE: "${{ github.event.inputs.voice || 'bm_george' }}" }
        run: python tools/gen_audio_en.py
      - name: Save audio
        run: |
          git config user.name "ihsan-audio-bot"; git config user.email "actions@users.noreply.github.com"
          git add audio data/texts
          git diff --cached --quiet && exit 0
          git commit -m "Add English narration [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase -X theirs origin main && git push && exit 0; sleep 10; done
          exit 1
