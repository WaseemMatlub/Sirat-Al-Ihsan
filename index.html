the Muslim rulers, whether righteous or sinful, until the establishment of the Hour. Nothing will abolish them or invalidate them.","note":""},{"id":"t76","ar":"الإيمان بالآخرة","en":"Faith in the Hereafter","note":""},{"id":"t77","ar":"وَنُؤْمِنُ بِالْكِرَامِ الْكَاتِبِينَ، فَإِنَّ اللهَ قَدْ جَعَلَهُمْ عَلَيْنَا حَافِظِينَ.","en":"We believe in the honorable scribes (the recording angels), for Allah has appointed them as guardians over us.","note":""},{"id":"t78","ar":"وَنُؤْمِنُ بِمَلَكِ الْمَوْتِ الْمُوَكَّلِ بِقَبْضِ أَرْوَاحِ الْعَالَمِينَ، وَبِعَذَابِ الْقَبْرِ لِمَنْ كَانَ لَهُ أَهْلًا، وَسُؤَالِ مُنْكَرٍ وَنَكِيرٍ فِي قَبْرِهِ عَنْ رَبِّهِ وَدِينِهِ وَنَبِيِّهِ، عَلَى مَا جَاءَتْ بِهِ الْأَخْبَارُ عَنْ رَسُولِ اللهِ ﷺ، وَعَنِ الصَّحَابَةِ رِضْوَانُ اللهِ عَلَيْهِمْ.","en":"We believe in the Angel of Death, who is entrusted with taking the souls of all worlds. And in the punishment of the grave for those who are deserving of it, and in the questioning in the grave by Munkar and Nakir about one's Lord, religion, and prophet, as has come in the reports from the Messenger of Allah ﷺ and from the Companions, may Allah be pleased with them.","note":""},{"id":"t79","ar":"وَالْقَبْرُ رَوْضَةٌ مِنْ رِيَاضِ الْجَنَّةِ، أَوْ حُفْرَةٌ مِنْ حُفَرِ النِّيرَانِ.","en":"The grave is either a garden from the gardens of Paradise or a pit from the pits of Hellfire.","note":""},{"id":"t80","ar":"وَنُؤْمِنُ بِالْبَعْثِ وَجَزَاءِ الْأَعْمَالِ يَوْمَ الْقِيَامَةِ، وَالْعَرْضِ وَالْحِسَابِ، وَقِرَاءَةِ الْكِتَابِ، وَالثَّوَابِ وَالْعِقَابِ، وَالصِّرَاطِ وَالْمِيزَانِ.","en":"We believe in the resurrection and the recompense of deeds on the Day of Judgment, the presentation, the reckoning, the reading of the book [of deeds], the reward, the punishment, the Bridge (al-Sirat), and the Scale (al-Mizan).","note":""},{"id":"t81","ar":"وَالْجَنَّةُ وَالنَّارُ مَخْلُوقَتَانِ، لَا تَفْنَيَانِ أَبَدًا وَلَا تَبِيدَانِ، وَإِنَّ اللهَ تَعَالَى خَلَقَ الْجَنَّةَ وَالنَّارَ قَبْلَ الْخَلْقِ، وَخَلَقَ لَهُمَا أَهْلًا، فَمَنْ شَاءَ مِنْهُمْ إِلَى الْجَنَّةِ فَضْلًا مِنْهُ، وَمَنْ شَاءَ مِنْهُمْ إِلَى النَّارِ عَدْلًا مِنْهُ، وَكُلٌّ يَعْمَلُ لِمَا قَدْ فُرِغَ لَهُ، وَصَائِرٌ إِلَى مَا خُلِقَ لَهُ.","en":"Paradise and Hellfire are created; they will never cease to exist nor perish. Allah created Paradise and Hellfire before the rest of creation, and He created inhabitants for each of them. Whoever He wills goes to Paradise out of His grace, and whoever He wills goes to Hellfire out of His justice. Everyone acts according to what has been destined for them and proceeds towards what they have been created for.","note":""},{"id":"t82","ar":"أفعال العباد","en":"The Actions of Servants","note":""},{"id":"t83","ar":"وَالْخَيْرُ وَالشَّرُّ مُقَدَّرَانِ عَلَى الْعِبَادِ.","en":"Good and evil are both decreed for the servants.","note":""},{"id":"t84","ar":"وَالِاسْتِطَاعَةُ الَّتِي يَجِبُ بِهَا الْفِعْلُ مِنْ نَحْوِ التَّوْفِيقِ الَّذِي لَا يَجُوزُ أَنْ يُوصَفَ الْمَخْلُوقُ بِهِ، فَهِيَ مَعَ الْفِعْلِ، وَأَمَّا الِاسْتِطَاعَةُ مِنْ جِهَةِ الصِّحَّةِ وَالْوُسْعِ وَالتَّمَكُّنِ وَسَلَامَةِ الْآلَاتِ فَهِيَ قَبْلَ الْفِعْلِ، وَبِهَا يَتَعَلَّقُ الْخِطَابُ، وَهُوَ كَمَا قَالَ تَعَالَى: (لَا يُكَلِّفُ اللهُ نَفْسًا إِلَّا وُسْعَهَا).","en":"The ability which necessitates an action, which is of the nature of divine success (tawfiq) and which a created being cannot be described as possessing, is simultaneous with the action. As for the ability in terms of health, capacity, capability, and sound limbs, it exists before the action. The religious obligation is related to this, as Allah Almighty says: 'Allah does not burden a soul beyond its scope.' (Qur'an 2:286).","note":""},{"id":"t85","ar":"وَأَفْعَالُ الْعِبَادِ خَلْقُ اللهِ، وَكَسْبٌ مِنَ الْعِبَادِ.","en":"The actions of the servants are a creation of Allah and an acquisition (kasb) of the servants.","note":""},{"id":"t86","ar":"وَلَمْ يُكَلِّفْهُمُ اللهُ تَعَالَى إِلَّا مَا يُطِيقُونَ، وَلَا يُطِيقُونَ إِلَّا مَا كَلَّفَهُمْ، وَهُوَ تَفْسِيرُ لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللهِ، نَقُولُ: لَا حِيلَةَ لِأَحَدٍ، وَلَا حَرَكَةَ لِأَحَدٍ، وَلَا تَحَوُّلَ لِأَحَدٍ عَنْ مَعْصِيَةِ اللهِ إِلَّا بِمَعُونَةِ اللهِ، وَلَا قُوَّةَ لِأَحَدٍ عَلَى إِقَامَةِ طَاعَةِ اللهِ وَالثَّبَاتِ عَلَيْهَا إِلَّا بِتَوْفِيقِ اللهِ.","en":"Allah has not tasked them except with what they can bear, and they can only bear what He has tasked them with. This is the explanation of 'There is no power and no strength except with Allah.' We say: there is no stratagem for anyone, no movement for anyone, and no turning for anyone from disobeying Allah except with Allah's help, and no one has the power to carry out the obedience of Allah and persevere in it except with Allah's guidance (tawfiq).","note":""},{"id":"t87","ar":"وَكُلُّ شَيْءٍ يَجْرِي بِمَشِيئَةِ اللهِ تَعَالَى وَعِلْمِهِ وَقَضَائِهِ وَقَدَرِهِ، غَلَبَتْ مَشِيئَتُهُ الْمَشِيئَاتِ كُلَّهَا، وَغَلَبَ قَضَاؤُهُ الْحِيَلَ كُلَّهَا، يَفْعَلُ مَا يَشَاءُ وَهُوَ غَيْرُ ظَالِمٍ أَبَدًا، تَقَدَّسَ عَنْ كُلِّ سُوءٍ وَحِينٍ، وَتَنَزَّهَ عَنْ كُلِّ عَيْبٍ وَشَيْنٍ، لَا يُسْأَلُ عَمَّا يَفْعَلُ وَهُمْ يُسْأَلُونَ.","en":"Everything happens according to the will of Allah Almighty, His knowledge, His decree, and His ordainment. His will has overcome all other wills, and His decree has overcome all stratagems. He does what He wills, and He is never unjust. He is sanctified from all evil and ruin, and He is transcendent above all flaw and defect. 'He is not asked about what He does, but they will be asked.' (Qur'an 21:23).","note":""},{"id":"t88","ar":"وَفِي دُعَاءِ الْأَحْيَاءِ وَصَدَقَاتِهِمْ مَنْفَعَةٌ لِلْأَمْوَاتِ، وَاللهُ تَعَالَى يَسْتَجِيبُ الدَّعَوَاتِ وَيَقْضِي الْحَاجَاتِ.","en":"There is benefit for the deceased in the supplications and charity of the living. Allah Almighty answers the supplications and fulfills the needs.","note":""},{"id":"t89","ar":"أصحاب النبي ﷺ","en":"The Companions of the Prophet ﷺ","note":""},{"id":"t90","ar":"وَيَمْلِكُ كُلَّ شَيْءٍ وَلَا يَمْلِكُهُ شَيْءٌ، وَلَا غِنَى عَنِ اللهِ تَعَالَى طَرْفَةَ عَيْنٍ، وَمَنِ اسْتَغْنَى عَنِ اللهِ طَرْفَةَ عَيْنٍ فَقَدْ كَفَرَ، وَصَارَ مِنْ أَهْلِ الْحَيْنِ.","en":"He owns everything and nothing owns Him. There is no independence from Allah for the blink of an eye. Whoever considers himself independent of Allah for the blink of an eye has disbelieved and become one of the people of perdition.","note":""},{"id":"t91","ar":"وَاللهُ يَغْضَبُ وَيَرْضَى لَا كَأَحَدٍ مِنَ الْوَرَى.","en":"Allah becomes angry and is pleased, not like any of the creation.","note":""},{"id":"t92","ar":"وَنُحِبُّ أَصْحابَ رَسُولِ اللهِ ﷺ، وَلَا نُفَرِّطُ فِي حُبِّ أَحَدٍ مِنْهُمْ، وَلَا نَتَبَرَّأُ مِنْ أَحَدٍ مِنْهُمْ، وَنُبْغِضُ مَنْ يُبْغِضُهُمْ، وَبِغَيْرِ الْخَيْرِ يَذْكُرُهُمْ، وَلَا نَذْكُرُهُمْ إِلَّا بِخَيْرٍ، وَحُبُّهُمْ دِينٌ وَإِيمَانٌ وَإِحْسَانٌ، وَبُغْضُهُمْ كُفْرٌ وَنِفَاقٌ وَطُغْيَانٌ.","en":"We love the Companions of the Messenger of Allah ﷺ. We do not go to excess in our love for any one of them, nor do we disassociate ourselves from any of them. We hate those who hate them and who speak ill of them. We only mention them in a good way. Love for them is religion, faith, and excellence (Ihsan), and hatred for them is disbelief, hypocrisy, and transgression.","note":""},{"id":"t93","ar":"وَنُثْبِتُ الْخِلَافَةَ بَعْدَ رَسُولِ اللهِ ﷺ أَوَّلًا لِأَبِي بَكْرٍ الصِّدِّيقِ رَضِيَ اللهُ عَنْهُ تَفْضِيلًا لَهُ وَتَقْدِيمًا عَلَى جَمِيعِ الْأُمَّةِ، ثُمَّ لِعُمَرَ بْنِ الْخَطَّابِ رَضِيَ اللهُ عَنْهُ، ثُمَّ لِعُثْمَانَ رَضِيَ اللهُ عَنْهُ، ثُمَّ لِعَلِيِّ بْنِ أَبِي طَالِبٍ رَضِيَ اللهُ عَنْهُ، وَهُمُ الْخُلَفَاءُ الرَّاشِدُونَ وَالْأَئِمَّةُ الْمُهْتَدُونَ.","en":"We affirm the Caliphate after the Messenger of Allah ﷺ, first for Abu Bakr al-Siddiq, may Allah be pleased with him, giving him preference and precedence over the entire Ummah; then for 'Umar ibn al-Khattab, may Allah be pleased with him; then for 'Uthman, may Allah be pleased with him; and then for 'Ali ibn Abi Talib, may Allah be pleased with him. They are the Rightly-Guided Caliphs and the guided leaders.","note":""},{"id":"t94","ar":"وَأَنَّ الْعَشَرَةَ الَّذِينَ سَمَّاهُمْ رَسُولُ اللهِ ﷺ وَبَشَّرَهُمْ بِالْجَنَّةِ نَشْهَدُ لَهُمْ بِالْجَنَّةِ، عَلَى مَا شَهِدَ لَهُمْ رَسُولُ اللهِ ﷺ، وَقَوْلُهُ الْحَقُّ، وَهُمْ: أَبُو بَكْرٍ، وَعُمَرُ، وَعُثْمَانُ، وَعَلِيٌّ، وَطَلْحَةُ، وَالزُّبَيْرُ، وَسَعْدٌ، وَسَعِيدٌ، وَعَبْدُ الرَّحْمَنِ بْنُ عَوْفٍ، وَأَبُو عُبَيْدَةَ بْنُ الْجَرَّاحِ؛ وَهُوَ أَمِينُ هَذِهِ الْأُمَّةِ رَضِيَ اللهُ عَنْهُمْ أَجْمَعِينَ.","en":"The ten whom the Messenger of Allah ﷺ named and gave the glad tidings of Paradise, we bear witness that they are in Paradise, according to the testimony of the Messenger of Allah ﷺ, whose word is truth. They are: Abu Bakr, 'Umar, 'Uthman, 'Ali, Talhah, al-Zubayr, Sa'd, Sa'id, 'Abd al-Rahman ibn 'Awf, and Abu 'Ubaydah ibn al-Jarrah, who is the trustee of this Ummah, may Allah be pleased with them all.","note":""},{"id":"t95","ar":"وَمَنْ أَحْسَنَ الْقَوْلَ فِي أَصْحَابِ رَسُولِ اللهِ ﷺ وَأَزْوَاجِهِ الطَّاهِرَاتِ مِنْ كُلِّ دَنَسٍ وَذُرِّيَّاتِهِ الْمُقَدَّسِينَ مِنْ كُلِّ رِجْسٍ؛ فَقَدْ بَرِئَ مِنَ النِّفَاقِ.","en":"Whoever speaks well of the Companions of the Messenger of Allah ﷺ, and his pure wives, free from any impurity, and his sacred descendants, free from any filth, is free from hypocrisy.","note":""},{"id":"t96","ar":"وَعُلَمَاءُ السَّلَفِ مِنَ السَّابِقِينَ، وَمَنْ بَعْدَهُمْ مِنَ التَّابِعِينَ أَهْلُ الْخَيْرِ وَالْأَثَرِ، وَأَهْلُ الْفِقْهِ وَالنَّظَرِ، لَا يُذْكَرُونَ إِلَّا بِالْجَمِيلِ، وَمَنْ ذَكَرَهُمْ بِسُوءٍ فَهُوَ عَلَى غَيْرِ السَّبِيلِ.","en":"The scholars of the Salaf (the predecessors) and those who followed them among the Tabi'un (the successors), the people of goodness and tradition, and the people of jurisprudence and sound reasoning, should only be mentioned in the best way. Whoever speaks ill of them is not on the right path.","note":""},{"id":"t97","ar":"الأنبياء والأولياء","en":"Prophets and Saints","note":""},{"id":"t98","ar":"وَلَا نُفَضِّلُ أَحَدًا مِنَ الْأَوْلِيَاءِ عَلَى أَحَدٍ مِنَ الْأَنْبِيَاءِ عَلَيْهِمُ السَّلَامُ، وَنَقُولُ: نَبِيٌّ وَاحِدٌ أَفْضَلُ مِنْ جَمِيعِ الْأَوْلِيَاءِ.","en":"We do not prefer any of the saints (Awliya') over any of the Prophets, peace be upon them. We say: one single Prophet is better than all the saints combined.","note":""},{"id":"t99","ar":"وَنُؤْمِنُ بِمَا جَاءَ مِنْ كَرَامَاتِهِمْ، وَصَحَّ عَنِ الثِّقَاتِ مِنْ رِوَايَاتِهِمْ.","en":"We believe in the miracles (karamat) that have been reported about them and authenticated in the narrations from trustworthy sources.","note":""},{"id":"t100","ar":"أشراط الساعة","en":"Signs of the Hour","note":""},{"id":"t101","ar":"وَنُؤْمِنُ بِأَشْرَاطِ السَّاعَةِ مِنْهَا: خُرُوجُ الدَّجَّالِ، وَنُزُولُ عِيسَى ابْنِ مَرْيَمَ عَلَيْهِ السَّلَامُ مِنَ السَّمَاءِ، وَنُؤْمِنُ بِطُلُوعِ الشَّمْسِ مِنْ مَغْرِبِهَا، وَخُرُوجِ دَابَّةِ الْأَرْضِ مِنْ مَوْضِعِهَا.","en":"We believe in the signs of the Hour, such as: the appearance of the Dajjal (Antichrist), the descent of 'Isa ibn Maryam (Jesus, son of Mary), peace be upon him, from the heavens, the rising of the sun from the west, and the emergence of the Beast of the Earth from its place.","note":""},{"id":"t102","ar":"الخاتمة","en":"Conclusion","note":""},{"id":"t103","ar":"وَلَا نُصَدِّقُ كَاهِنًا وَلَا عَرَّافًا، وَلَا مَنْ يَدَّعِي شَيْئًا يُخَالِفُ الْكِتَابَ وَالسُّنَّةَ وَإِجْمَاعَ الْأُمَّةِ.","en":"We do not believe any soothsayer or fortuneteller, nor anyone who claims something that contradicts the Book, the Sunnah, and the consensus of the Ummah.","note":""},{"id":"t104","ar":"وَنَرَى الْجَمَاعَةَ حَقًّا وَصَوَابًا، وَالْفُرْقَةَ زَيْغًا وَعَذَابًا.","en":"We hold the community (al-Jama'ah) to be true and correct, and division to be deviation and torment.","note":""},{"id":"t105","ar":"وَدِينُ اللهِ فِي الْأَرْضِ وَالسَّمَاءِ وَاحِدٌ، وَهُوَ دِينُ الْإِسْلَامِ، قَالَ اللهُ تَعَالَى: (إِنَّ الدِّينَ عِنْدَ اللهِ الْإِسْلَامُ)، وَقَالَ تَعَالَى: (وَرَضِيتُ لَكُمُ الْإِسْلَامَ دِينًا).","en":"The religion of Allah in the heavens and the earth is one, and it is the religion of Islam. Allah says, 'Indeed, the religion in the sight of Allah is Islam.' (Qur'an 3:19), and He says, '...and have approved for you Islam as religion.' (Qur'an 5:3).","note":""},{"id":"t106","ar":"وَهُوَ بَيْنَ الْغُلُوِّ وَالتَّقْصِيرِ، وَبَيْنَ التَّشْبِيهِ وَالتَّعْطِيلِ، وَبَيْنَ الْجَبْرِ وَالْقَدَرِ، وَبَيْنَ الْأَمْنِ وَالْإِيَاسِ.","en":"It lies between extremism and negligence, between anthropomorphism (tashbih) and stripping of attributes (ta'til), between fatalism (jabr) and free will (qadar), and between certainty (of salvation) and despair (of mercy).","note":""},{"id":"t107","ar":"فَهَذَا دِينُنَا وَاعْتِقَادُنَا ظَاهِرًا وَبَاطِنًا، وَنَحْنُ بُرَآءُ إِلَى اللهِ مِنْ كُلِّ مَنْ خَالَفَ الَّذِي ذَكَرْنَاهُ وَبَيَّنَّاهُ، وَنَسْأَلُ اللهَ تَعَالَى أَنْ يُثَبِّتَنَا عَلَى الْإِيمَانِ، وَيَخْتِمَ لَنَا بِهُ، وَيَعْصِمَنَا مِنَ الْأَهْوَاءِ الْمُخْتَلِفَةِ، وَالْآرَاءِ الْمُتَفَرِّقَةِ، وَالْمَذَاهِبِ الرَّدِيئَةِ، مِثْلِ الْمُشَبِّهَةِ وَالْمُعْتَزِلَةِ وَالْجَهْمِيَّةِ وَالْجَبْرِيَّةِ وَالْقَدَرِيَّةِ وَغَيْرِهِمْ؛ مِنَ الَّذِينَ خَالَفُوا السُّنَّةَ وَالْجَمَاعَةَ، وَحَالَفُوا الضَّلَالَةَ، وَنَحْنُ مِنْهُمْ بُرَآءُ، وَهُمْ عِنْدَنَا ضُلَّالٌ وَأَرْدِيَاءُ، وَبِاللهِ الْعِصْمَةُ.","en":"This is our religion and our creed, both inwardly and outwardly. We absolve ourselves before Allah of anyone who opposes what we have mentioned and explained. We ask Allah to make us firm upon faith, to seal our lives with it, and to protect us from variant whims, divergent opinions, and corrupt schools of thought, such as the Mushabbihah, the Mu'tazilah, the Jahmiyyah, the Jabriyyah, the Qadariyyah, and others who have opposed the Sunnah and the Jama'ah and allied themselves with misguidance. We are free of them, and in our view, they are misguided and corrupt. And protection is from Allah.","note":""}],"umm":[{"id":"u0","ar":"بسم الله الرحمن الرحيم","en":"In the name of Allah, the Most Beneficent, the Most Merciful","note":""},{"id":"u1","ar":"الَحْمُد للهِ.","en":"All praise is due to Allah.","note":""},{"id":"u2","ar":"وَالصَّلاَةُ وَالسَّلاَمُ عَلَى رَسُولِ اللهِ.","en":"Blessings and Peace be upon the Messenger of Allah.","note":""},{"id":"u3","ar":"اعْلَمْ أنَّ الْحُكْمَ العَقْليَّ يَنْحَصِـرُ فِي ثَلاَثَةِ أَقْسَامٍ: الْوُجُوب، وَالاِسْتِحَالَة، وَالجَوَاز.","en":"Know, that rational judgements are encapsulated within three categories: necessity, impossibility, and possibility.","note":""},{"id":"u4","ar":"فَالْوَاجِبُ: مَالا يُتَصَوَّرُ فِي الْعَقْلِ عَدَمُهُ. وَالمُسْتَحِيلُ: مَالاَ يُتَصَوَّرُ فِي الْعَقْلِ وُجُودُهُ. وَالجَائِزُ: مَا يَصِحُّ فِي الْعَقْلِ وَجَودَهَ وَعَدَمُهُ.","en":"Necessity: is what the intellect cannot conceptualize its absence. Impossible: is what the intellect cannot conceptualize its existence. Possibility: is what is valid for the intellect to conceptualize its existence or absence.","note":""},{"id":"u5","ar":"وَيَجِبُ عَلَى كُلِّ مُكَلَّفٍ شَرْعًا أّنْ يَعْرِفَ مَا يَجِبُ فِي حَقِّ مَوْلاَنَا جَلَّ وَعَزَّ، وَمَا يَسْتَحِيلُ، وَمَا يَجُوزُ.","en":"It is scripturally obligatory on every moral agent to know what is necessary in the right of Our Lord, Glory and Exalted is He, and what is impossible, and what is possible [for Him].","note":""},{"id":"u6","ar":"وَكَذَا يَجِبُ عَلَيْهِ أَنْ يَعْرِفَ مِثْلَ ذلِكَ فِي حَقِّ الرُّسُلِ عَلَيْهِمُ الصَّلاَةُ وّالسَّلاَمُ.","en":"Likewise, it is obligatory to know the likes in the right of the Messengers, upon them be blessings and peace.","note":""},{"id":"u7","ar":"فمَمَّا يَجِبُ لموْلانَا جَلَّ وَعَزَّ عِشْرُونَ صِفَةً، وَهِيَ:","en":"From what is necessary for Our Lord, Glorious and Exalted is He, is twenty attributes, and they are:","note":""},{"id":"u8","ar":"الْوَجُودُ. وَالْقِدَمُ. وَالبَقَاءُ. وَمُخَالَفَتُهُ تَعَالَى لِلْحَوَادِثِ. وَقِيَامُهُ تَعَالَى بِنَفْسِهِ: أَيْ لاَ يَفْتَقِرُ إِلَى مَحَل، وَلاَ مُخصِّصٍ. وَالوَحْدَانِيَّةُ: أَيْ لاَ ثَانِيَ لَهُ فِي ذَاتِهِ، وَلاَ فِي صِفَاتِهِ، وَلاَ فِي أَفْعَالِهِ. فَهذِهِ سِتُّ صِفَاتٍ:","en":"Existence. Pre-Eternality. Permanence. Differing from creation. His existing independently, i.e., not needing a substrate or creator. Oneness, i.e., there is no secondary to His essence, nor His attributes, nor His actions. These are six attributes.","note":""},{"id":"u9","ar":"اْلأُولَى نَفْسِيَّةٌ، وَهِيَ: الْوَجُودُ. وَالخَمْسَةُ بَعْدَهَا سَلْبيَّةٌ. ثُمَّ يَجِبُ لَهُ تَعَالَى سَبْعُ صِفَاتٍ، تُسَمَّى صفَاتِ المَعَانِي، وَهِيَ:","en":"The first is the [attribute] of Identity. The five after it are negative attributes. Then, it is necessary for Him, the Exalted, seven attributes, called the Attributes of Meaning. They are:","note":""},{"id":"u10","ar":"الْقًدْرَةُ، وَالإِرادَةُ: المُتَعَلِّقَانِ بِجَمِيعِ المُمْكِنَات. وَالْعِلْمُ المُتَعَلِّقُ بِجَمِيعِ الْوَاجِبَاتِ، وَالجَائِزَاتِ، وَالمُسْتَحِيلاَت. وَالحَيَاةُ، وَهِيَ: لاَ تتَعَلَّقُ بِشيءِ . وَالسَّمْعُ وَالبصَرُ: المُتَعَلِّقَان بِجَمِيعِ الموْجُودَات. وَالْكَلامُ: الذِّي لَيْسَ بِحَرْفٍ، وَلاَ صَوْتٍ، وَيَتَعَلَّقُ بِمَا يَتَعَلَّقُ بِهِ الْعِلْمُ مِنَ المُتَعَلَّقَاتِ.","en":"Power, Will, and they relate to all possibilities. Knowledge, relating to all necessities, possibilities, and impossibilities. Life, and it does not relate to anything. Hearing and Seeing, relating to all existing things. Speech, which is not composed of letter or sound, and it relates to everything that the Knowledge relates to.","note":""},{"id":"u11","ar":"ثُمَّ سَبْعُ صِفَاتٍ، تُسَمَّى صِفَاتٍ مَعْنَوِيَّة، وَهِيَ: مُلاَزِمَةٌ لِلسَّبْع الأُولَى، وَهِيَ:","en":"Then, there are seven attributes called the abstract attributes that are connected with the first seven attributes. They are:","note":""},{"id":"u12","ar":"كَوْنهُ تعالى : قادراً، وَمُريداً. وَعَالِمًا وَحَيَّا، وَسَمِيعًا، وَبَصِيراً، وَمُتَكَلِّمًا.","en":"His being: Powerful, Willing, Knowledgeable, Living, Hearing, Seeing, and Speaking.","note":""},{"id":"u13","ar":"وَمِمَّا يسْتَحِيلُ فِي حَقَّهِ تَعَالى عِشْرُونَ صِفَة، وَهِيَ أَضْدَادُ الْعِشْـرِينَ اْلأُولَى، وَهِيَ:","en":"From among what is impossible in His right, Exalted is He, is twenty attributes. They are the opposite of the first twenty attributes. They are:","note":""},{"id":"u14","ar":"الْعَدَمُ. وَالحُدُوثُ. وَطُرُؤُ العَدَمِ.","en":"Non-existence. Having a beginning. Ceasing to exist.","note":""},{"id":"u15","ar":"وَالمُمَاثَلَةُ لِلْحَوَادِثِ: بِأَنْ يَكُونَ جِرْمًا:  أَيْ تَأخُذَ ذَاتُهُ العَلِيةُ قَدْراً مِنَ الْفَرَاغِ. أَوْ يَكُونَ عَرَضًا يَقُومُ بِالْجِرْم، أَوْ يَكُونَ فِي جِهَةٍ للجرمِ، أَو لهُ هُوَ جِهَةٌ، أَوْ يَتَقَيَّد بِمَكَانٍ، أَوْ زَمَانٍ، أَوْ تَتَّصِف ذَاتُهُ الْعلِيةُ بِالحَوَادِثِ، أَو يَتَّصِفَ بِالصِّغَرِ، أَوْ الْكِبَرِ، أَوْ يَتَصَّفَ بَاْلأَغْرَاض فِي اْلأَفْعَالِ أَو اْلأَحْكامِ.","en":"Resembling creation by being a body, i.e., His exalted essence taking up space, or by being an accident that occupies a body, or by being in the direction of a body, or He himself being a direction, or limited to a space or time, or His lofty essence being attributed with temporal things, or being attributed with smallness or largeness, or being attributed with having causal motives [*aghrad*] in His actions or rulings.","note":""},{"id":"u16","ar":"وَكَذَا يَسْتَحِيلُ عَلَيْهِ تَعَالَى أَنْ لاَ يَكُونَ قائِمًا بِنَفْسِهِ، بِأَنْ يَكُونَ صِفَةً يَقُومُ بِمَحلٍ، أَوْ يَحْتَاجُ إِلَى مُخَصَّصٍ.","en":"Likewise, it is impossible for Him to not be independent, by being an attribute that subsists in a locus or requiring a creator.","note":""},{"id":"u17","ar":"وَكَذَا يَسْتَحيلُ عَلَيْهِ تَعَالَى أَنْ لاَ يَكُوُنَ وَاحِداً بِأَنْ يَكُونَ مُرَكبًا فِي ذَاتِهِ، أَوْ يَكُونَ لَهُ مُمَاثِلٌ فِي ذَاتِهِ، أَوْ صِفَاتِهِ، أَوْ يَكُونَ مَعَهُ فِي الْوُجُودِ مُؤَثَّرٌ فِي فِعْلٍ مِنَ اْلأَفْعَالِ.","en":"Likewise, it is impossible upon Him, the Exalted, that He not be one, by being composed of parts in His essence, or that He has a counterpart rivaling His essence, or His attributes, or there being alongside Him another existence that has causal efficacy in any action.","note":""},{"id":"u18","ar":"وَكَذَا يَسْتَحِيلُ عَلَيْهِ تَعَالَى الْعَجْزُ عَنْ ممكِنٍ مَّا، وَإِيجَادُ شَيْءٍ مِنَ الْعَالَمِ مَعَ كَرَاهَتِهِ لِوُجُودِهِ. أَيْ عَدَمِ إِرَادَتِهِ لَهُ تَعَالَى أَوْ مَعَ الذُهُولِ، أَو الْغَفْلَةِ، أو بِالتَّعْلِيلِ، أَوْ بِالطَّبْعِ.","en":"Likewise, it is impossible for Him, the Exalted, to be unable to do anything possible, or to being compelled to create something in the universe, i.e., Him lacking volition to do it, or doing it forgetfully or absentmindedly, or due to a causal motive, or an intrinsic nature.","note":""},{"id":"u19","ar":"وَكَذَا يَسْتَحِيلُ عَلَيْهِ تَعَالَى الجَهْلُ وَمَا فِي مَعْنَاهُ بَمعْلُومٍ مَّا، وَالمَوْتُ، وَالصَّمَمُ، وَالْعَمى وَالْبَكَمُ.","en":"Likewise, it is impossible for Him, the Exalted, to have ignorance or what is equivalent to it in anything known, as well as death, deafness, blindness, and muteness.","note":""},{"id":"u20","ar":"وَأَضْدَادُ الصِّفَات المَعْنَوِيَّةِ وَاضِحَةٌ مِنْ هَذِهِ.","en":"The opposites of the abstract attributes are clear from these.","note":""},{"id":"u21","ar":"وَأَمَّا الجَائِزُ فِي حقِّهِ تَعَالَى: فَفِعْلُ كَلِّ ممْكِنٍ أَوْ تَرْكُهُ.","en":"As for what is possible in His Exalted right, it is doing anything that is possible or not doing it.","note":""},{"id":"u22","ar":"أَمَّا بُرْهَانُ وَجَودِهِ تَعَالَى: فَحُدوثُ الْعَالَمِ، لأَنَّهُ لَوْ لمْ يَكُنْ لَهُ مُحْدِثٌ بَلْ حَدَثَ بِنَفْسِهِ، لَزمَ أَنْ يَكُونَ أَحَدُ اْلأَمْرَيْنِ المُتَسَاويَيْنِ مُسَاوِيًا لِصَاحِبِهِ رَاجِحًا عَلَيْهِ بِلاَ سَبَبٍ وَهُوَ مُحَالٌ.","en":"As for the proof for His Existence, the Exalted: it is the temporality of the universe. This is because if it were not to have a beginning and instead have created itself, it would necessitate that one out of two equally possible matters [existence and non-existence] became more possible than the other without any cause, and this is an impossibility.","note":""},{"id":"u23","ar":"وَدلِيلٌ حُدُوثِ الْعَالَمِ مُلاَزَمَتُهُ لِلأَعْرَاضِ الحَادِثَةِ مِنْ: حَرَكَةٍ، أو سُكُونٍ أو غَيْرِهِمَا، وَمُلاَزِمُ الحَادِثِ حَادِثٌ.","en":"The proof that the universe is temporal is its logical inseparability from accidents which are temporal: movement, stillness, etc., and anything logically inseparable from something temporal must also be temporal.","note":""},{"id":"u24","ar":"وَدَلِيلُ حُدُوثِ اْلأَعرَاضِ مُشَاهَدَةُ تَغَيُّرِهَا مِنْ عَدَمٍ إِلَى وَجَودٍ، وَمِنْ وُجُودٍ إِلَى عَدَمٍ.","en":"The proof that accidents are temporal is first-hand witnessing of their going from not existing to existing and their going from existing into not existing.","note":""},{"id":"u25","ar":"وَأَمَّا بُرْهَانُ وُجُوبِ الْقِدَمِ لَهُ تَعَالَى: فَلأَنَّهُ لَو لم يَكُنْ قَديمًا، لَكَانَ حَادِثًا فَيَفْقِرُ إِلَى مُحْدِثٍ، فَيَلْزَمُ الدَّوْرُ، أوِ التَّسَلْسُلُ.","en":"As for the proof of the necessity of pre-eternality for Him, the Exalted, is because were He not to be pre-eternal, He would be temporal and would require a creator. This would necessitate a vicious cycle or infinite regress.","note":""},{"id":"u26","ar":"وَأَمَّا بُرْهَانُ وَجَوبِ الْبَقَاءِ لَهُ تَعَالَى، فَلأَنَّهُ لَو أَمْكَنَ أَنْ يَلْحَقَهُ الْعَدَمُ، لاَنْتَفَى عَنْهُ القِدَمُ لِكَوْنِ وُجُودِهِ حِينَئِذٍ جَائِزًا لاَ وَاجِبًا، وَالجَائِزُ لاَ يَكُونُ وُجُودُهُ إِلاَّ حَادِثًا، كَيْفَ! وَقَدْ سَبَقَ قَرِيبًا وُجُوبُ قِدَمِهِ تَعَالَى وَبَقَائِه.","en":"As for the proof of the necessity of permanence for Him, the Exalted, it is because if it were possible for Him to be overcome by non-existence, it would nullify His pre-eternality, because then His existence would be a possibility, not a necessity. And possibilities cannot exist except by being created. And how could this be [coherent], when the [proof of the] necessity of His pre-eternality was just mentioned.","note":""},{"id":"u27","ar":"وَأَمَّا بُرْهَانُ وَجَوبِ مُخَالَفَتِهِ تَعَالَى لِلْحَوَادِثِ: فَلأَنَّهُ لَو مَاثَلَ شَيْئًا مِنْهَا، لَكانَ حَادِثًا مِثْلَهَا، وَذلِكَ مُحَالٌ لِما عَرَفْتَ قَبْلُ مِنْ وُجُوبِ قِدَمِهِ تَعَالَى وَبَقَائِهِ.","en":"As for the proof of the necessity of His differing from temporal things, it is because if He were to resemble anything of them, He would be temporal like them, and this is impossible as you learned previously from the necessity of His pre-eternality and His permanence.","note":""},{"id":"u28","ar":"وَأَمَّا بُرْهَانُ وَجَوب قِيَامِهِ تَعَالَى بِنَفْسِهِ: فَلأَنَّهُ تَعَالَى لَوِ احْتَاجَ إِلَى مَحَلٍ لَكَانَ صفَةً، وَالصِّفَةُ لاَ تَتَّصِفُ بِصِفَاتِ المَعَانِي، وَلاَ المَعْنويَّةِ، وَمَوْلانَا جَلَّ وَعَزَّ يَجِب اتِّصَافُهُ بِهِمَا فَلَيْسَ بِصِفَةٍ. وَلَو احْتَاجَ إِلَى مُخَصِّصٍ لَكانَ حَادِثًا، كَيْفَ! وَقَدْ قامَ الْبُرْهَانُ عَلَى وُجُوبِ قِدَمِهِ تَعَالَى وَبقَائِهِ.","en":"As for the proof of the necessity of Him being independent, it is because if He, the Exalted, were to depend on a substrate, then He would be an attribute, and an attribute cannot itself be attributed with positive attributes, nor abstract ones. It is necessary for Our Lord to be attributed with them, so therefore He is not an attribute. If He depended on a creator, He would be temporal. And how could this be [coherent] when the proof of the necessity of His pre-eternality and permanence were just established.","note":""},{"id":"u29","ar":"وَأَمَّا بُرْهَانُ وُجُوبِ الْوَحْدَانِيَّةِ لَهُ تَعَالَى: فَلأَنَّهُ لَوْ لَمْ يَكُنْ وَاحِدًا لَزِمَ أَنْ لاَ يُوجَدَ شَيْءٌ مِنَ الْعَالَمِ للزُومِ عَجْزِهِ حِينَئِذٍ.","en":"As for the proof of the necessity of His Oneness, it is because were He not to be one, it would necessitate that nothing of the universe could exist due to it leading to inability therein.","note":""},{"id":"u30","ar":"وَأَمَّا بُرْهَانُ وَجَوبِ اتِّصَافِهِ تَعالَى بِالْقُدْرَةِ وَاْلإِرَادَةِ وَالْعِلْم وَالحَيَاةِ: فَلأَنَّهُ لَوِ انْتَفى شَيْءٌ مِنْهَا لَمَا وجِدَ شَيْءٌ مِنَ الحَوَادِثِ .","en":"As for the proof of His being attributed with power, will, knowledge, and life, it is because if any of those were to be absent, no created thing could exist.","note":""},{"id":"u31","ar":"وَأَمَّا بُرْهَانُ وَجَوبِ السَّمْعِ لَهُ تَعَالَى وَالْبَصَـرِ وَالْكَلاَمِ: فَالْكِتَابُ والسُّنة وَالإِجْمَاعُ، وَأَيْضًا لَوْ لَمْ يتَّصِفَ بِهَا لَزِمَ أَنْ يَتَّصِفَ بِأَضْدَادِهَا، وَهِيَ نَقَائِصُ، وَالنَّقْصُ عَلَيْهِ تَعَالَى مُحَالٌ.","en":"As for the proof of the necessity of His hearing, sight, and speech, it is from the Book, Sunnah, and scholarly consensus. Also, it is because were He not to be attributed with them, it would necessitate that He is attributed with their opposites, which are deficiencies, and deficiencies are impossible upon Him, the Exalted.","note":""},{"id":"u32","ar":"وَأَمَّا بُرْهَانُ كَوْنِ فِعْل المُمْكِنَاتِ أَوْ تَرْكِهَا جَائِزًا فِي حَقِّهِ تَعَالَى: فَلأَنَّهُ لَوْ وَجَبَ عَلَيْهِ تَعَالَى شَيْءٌ مِنْهَا عَقْلاً، أَوِ اسْتَحالَ عَقْلاَ لاَ نْقَلَبَ المَمْكِنُ وَاجِبًا أَوْ مُسْتَحِيلاً، وّذلِكَ لاَ يُعْقَلُ.","en":"As for the proof of doing actions or not doing them being possible in His right, then it is because were it rationally necessary for Him to do something, or rationally impossible, the possible would become necessary or impossible, and that is unintelligible.","note":""},{"id":"u33","ar":"وَأَمَّا الرُّسُلُ عَلَيْهِمُ وَالسَّلاَمُ:","en":"As for the Messengers, peace be upon them:","note":""},{"id":"u34","ar":"فَيَجِبُ فِي حَقِّهِمُ: الصُّدْقُ وَاْلأَمَانَةُ وَتَبْلِيغُ مَا أُمِرُوا بِتَبْلِيغِهِ لِلْخَلْقِ.","en":"It is necessary in their right: truthfulness, integrity, and conveying what they were ordered to convey to creation.","note":""},{"id":"u35","ar":"وَيَسْتَحِيلُ فِي حَقِّهِمْ عَليْهِمُ الصَّلاَةُ وَالسَّلاَمُ أَضْدَادُ هذه الصِّفَاتِ، وَهِيَ: الْكَذِبُ وَالْخِيَانَةُ بِفِعْلِ شَيْءٍ مِمَّا نُهُوا نَهْيَ تَحْرِيمٍ أَوْ كَرَاهَةٍ، أَوْ كِتمْانُ شَيْءٍ مِمَّا أُمِرُوا بِتَبْلِيغِهِ لِلْخَلْقِ.","en":"It is impossible in their right, blessings and peace be upon them, to have the opposites of these attributes. They are lying, treachery by doing something they were prohibited to do, whether the prohibition was *haram* or disliked, or concealing part of what they were commanded to convey to the creation.","note":""},{"id":"u36","ar":"وَيَجُوزُ فِي حَقِّهِمْ عَلَيْهِمُ الصَّلاَةُ وَالسَّلاَمُ مَا هُوَ مِنَ اْلأَعْرَاضِ الْبَشَرِيَّةِ التَّي لاَ تُؤَدِّي إِلَى نَقْصٍ فِي مَرَاتِبِهِمِ الْعَلِيَّةِ ؛ كالْمَرَضِ وَنَحْوِهِ.","en":"It is possible in their right, blessings and peace be upon them, whatever is from the states of humanity that do not lead to a decrease in their lofty rank, such as sickness and the likes.","note":""},{"id":"u37","ar":"أَمَّا بُرْهَانُ وُجُوبِ صِدْقِهِمْ عَلَيْهِمُ الصَّلاَةُ وَالسَّلاَمُ: فَلأَنَّهُمْ لَوْ لَمْ يَصْدُقُوا لَلَزِمَ الَكَذِبُ فِي خَبرِهِ تَعَالَى، لِتَصْدِيقِهِ تَعَالَى لَهُمْ بِالْمُعْجزَةِ النَّازِلَةِ مَنْزِلَةَ قَوْلِهِ تَعَالَى: صَدَقَ عَبِدْي فِي كُلِّ مَا يُبَلِّغُ عَنِّي.","en":"As for the proof of the necessity of their truthfulness, blessings and peace be upon them, it is because were they not to be truthful, it would necessitate falsehood in His reports, due to His affirmation of them by way of miracles that take the place of Him saying \"my slave is truthful in everything that He conveys from me.\"","note":""},{"id":"u38","ar":"وَأمَّا بُرْهَانُ وُجُوبِ اْلأَمَانَةِ لَهم عَلَيْهِمُ الصَّلاَةُ والسَّلاَمُ: فَلأَنَّهُمْ لَو خَانُوا بِفِعْلِ مُحَرَّمٍ، أَوْ مَكْرُوهٍ، لاَ نْقَلَبَ المحَرَّمُ، أَوِ المَكْروهُ طَاعَةً فِي حَقِّهِمْ، لأَنَّ اللهَ تَعَالَى أَمَرَنَا بِالاِقْتِدَاءِ بِهِم فِي أَقْوالِهِم وَأَفْعَالِهِم، وَلاَ يَأْمُرُ اللهُ تَعَالَى بِفِعْلِ مُحَرَّمِ وَلاَ مَكْرُوه. وَهذَا بِعَيْنِهِ هُوَ بُرْهَانُ وُجُوبِ الثَّالِثِ.","en":"As for the proof of the necessity of integrity for them, blessings and peace be upon them, it is because were they to be treacherous by doing something forbidden or disliked, the forbidden or disliked thing would turn into an act of obedience in their right because Allah, the Exalted, commanded us to follow them in their words and actions, and Allah does not command to do forbidden or disliked things. This is exactly the same proof for the third obligation [of conveying the Message].","note":""},{"id":"u39","ar":"وَأَمَّا دَلِيلُ جَوَازِ الأَعْرَاضِ الْبَشَرِيَّةِ عَلَيْهِم: فَمشَاهَدَةُ وُقُوعِهَا بِهِم: إِمَّا لِتَعْظِيمِ أُجُورِهِمْ أَوْ لِلتَّشْرِيعِ أَوْ لِلتَّسَلِّي عَنِ الدُّنْيَا، أَوْ لِلتَّنْبِيهِ لِخِسَّةِ قَدْرِهَا عِنْدَ الله تَعَالَى، وَعَدَمِ رِضَاهُ بِهَا دَار جَزَاءٍ لأَنْبِيَائِهِ وَأَوْليَائِهِ بِاعْتِبَارِ أَحْوَالِهِمْ فِيهَا عَلَيْهِمُ الصَّلاَةُ وَالسَّلم.","en":"As for the proof of the possibility of them having human states, it is the firsthand witnessing of them going through them, either for the increase of their reward, or for the purpose of legislation, or to find consolation from the *dunya*, or to remind of its meager value with Allah, the Exalted, and the lack of His pleasure for it being a place of reward for His Prophets and saints, with respect to their states in it, upon them be blessings and peace. In other words, the proof of the possibility of various human states occurring for the Prophets is the fact that people have witnessed the occurrence of these states firsthand, such as sickness, health, life, death, happiness, sadness, eating, drinking, marriage, loss of loved ones, and more. However, one may ask what is the wisdom behind these states occurring? There are many wisdoms, and some of them are given here. The tests that the Prophets may face in the *dunya* may increase their rewards. They may be for the purpose of legislation, such as showing the believers how to act in various situations such as in eating, drinking, sleeping, marriage, etc.. The fact that many Prophets faced various states in the *dunya*, including difficulty, poverty, death, setbacks, and betrayal is also a consolation and reminder for others. These states occurring for the Prophets, blessings and peace be upon them, is a means of consoling people from disappointment when they face adversity in matters of the *dunya* such as loss, poverty, or death. It also demonstrates to people the lowly nature of the material world and a reminder to people to not expect it to be an abode for reward and pleasure. If it were to be a high and exalted place and an abode for reward, then the ones who would be most deserving of the *dunya* would be the Prophets and the saints. However, the fact that the Prophets and saints sometimes received good in the *dunya*, and at other times faced hardship and difficulty, facing the same ups and downs as the enemies of Allah, demonstrates its meager worth with Allah and a reminder that the abode of reward and happiness is in the next life, not this one.","note":""},{"id":"u40","ar":"وَيَجْمَعُ مَعَانِيَ هذِهِ العَقَائِدِ كُلهَا قَوْلُ: لاَ إِلهَ إِلاَّ اللهُ مُحَمَّدٌ رَسُولُ اللهِ","en":"The statement **there is no God but Allah, Muhammad is the Messenger of Allah** encapsulates all the meanings of the creed. In other words, the two testimonies of faith are a summary and contain implicit indications to every single of the aforementioned attributes of Allah and the Prophets.","note":""},{"id":"u41","ar":"إِذ مَعْنَى اْلأُلُوهِيَّةِ: اسْتِغْنَاءُ الإِلهِ عَنْ كُلِّ مَا سِوَاهُ، وَافْتِقَارُ كُلِّ مَا عَدَاهُ إِلَيْهِ.","en":"Because the meaning of divinity (ألوهية) is: the independence of God from everything other than Him, and the dependence of everything other than Him upon Him.","note":""},{"id":"u42","ar":"فَمَعْنى لاَ إِلهَ إِلاَّ اللهُ: لاَ مُسْتَغْنَي عَنْ كُلِّ مَا سِوَاهُ، وَمُفْتَقِرًا إِلَيْهِ كُلُّ مَا عَدَاهُ إِلاَّ اللهُ تَعَالَى.","en":"So the meaning, there is no God except Allah is: there is nothing independent from everything other than itself and everyone other than itself is reliant upon it, except Allah, the Exalted. Meaning, nothing fits the definition of divinity or being a God, other than Allah.","note":""},{"id":"u43","ar":"أَمَّا اسْتِغْنَاؤُهُ جَلَّ وَعَزَّ عَنْ كُلِّ مَا سِوَاهُ، فَهُوَ يُوجِبُ لَهُ تَعَالَى: الْوُجُودَ، وَالْقِدَمَ، وَالْبَقَاءَ، وَالمُخَالَفَةَ لِلْحَوَادِثِ، وَالْقِيَامَ بِالنَّفْسِ، وَالتَّنَزُّهَ عَن النَّقَائِصِ.","en":"As for His independence from everything other than Him, it necessitates from Him: existence, pre-eternality, permanence, differing from creation, independence, and being transcendent of all deficiencies.","note":""},{"id":"u44","ar":"وَيَدْخُلُ فِي ذلِكَ وُجُوبُ السَّمْعِ لَهُ تَعَالَى وَالْبَصَرِ وَالْكَلاَمِ، إِذْ لَوْ لَمْ تَجِبْ لَهُ هذِهِ الصِّفَاتُ لكَانَ مُحُتَاجًا إِلَى المُحْدِثِ، أَوِ المحَلِّ، أَو مَنْ يَدْفَعُ عَنْهُ النَّقَائِصَ.","en":"Included in this is also the necessity of Hearing for Him, Sight, and Speech, since if these attributes were not necessary for Him, He would rely on created things, a substrate, or someone who could remove these deficiencies from Him.","note":""},{"id":"u45","ar":"وَيُؤخذُ مِنْهُ: تَنَزُّهُهُ تَعَالَى عَنِ اْلأَغْرَاضِ فِي أَفْعَالِهِ وَأَحْكامِهِ، وَإِلاَّ  لَزِمَ افْتِقَارُهُ إِلَى مَا يُحَصِّلُ غَرَضَهُ، كَيْفَ! وَهُوَ جَلَّ وَعَزَّ الْغَنِيُّ عَنْ كُلِّ مَا سِوَاهُ.","en":"Derived from this is His transcendence from ulterior motives in His actions and judgments. Otherwise, it would necessitate His dependance on what His motive produced. How could this be when He, the Mighty and High, is independent on everything other than Him. An ulterior motive (غرض) in *kalam* is a motive that motivates someone to do an action or pass a judgment for the sake of some benefit.","note":""},{"id":"u46","ar":"وَيُؤخَذُ مِنْهُ أَيْضًا: أَنَّهُ لاَ يَجِبُ عَلَيْهِ تَعَالَى فعْلُ شَيْءٍ منْ المُمْكنَاتِ عقلا وَلاَ تَرْكُهُ، إِذْ لَوْ وَجَبَ عَلَيْهِ تَعَالَى شَيْءٌ مِنْهَا عَقْلاً كالثَّوَابِ مَثَلاً، لَكانَ جَلَّ وَعَزَّ مُفْتِقَرًا إِلَى ذلِكَ الشَّيْءِ لِيَتَكَمَّلَ بِهِ غَرَضُهُ، إِذْ لاَ يَجِبُ فِي حَقِّه تَعَالَى إلاَّ مَا هُوَ كَمَالٌ لَهُ، كَيْفَ وَهُوَ جَلَّ وَعَزَّ الغَنِيُّ عن كُلِّ مَا سِوَاهُ.","en":"Derived from this as well is that it is not necessary for Him to do any rational possibility or to refrain from it, because if it were rationally necessary upon Him, the Exalted, to do something such as giving rewards, for example, He, the Mighty and High, would be dependent on that action in order for His ulterior motive to be completed. This is because nothing except what is a perfection is necessary in His right. How could this be, when He, the Mighty and High, is independent of everything other than Him.","note":""},{"id":"u47","ar":"وَأَمَّا افْتِقَارُ كُلِّ مَا عَدَاءُ إِلَيْهِ جَلَّ وَعَزَّ فَهُوَ يُوجِبُ لَهُ تَعَالَى الحَيَاةَ، وَعُمُومَ الْقُدْرَةِ وَاْلإِرَادَةِ وَالْعِلْمِ، إِذْ لَو انِتَفى شَيْءٌ مِنْهَا لَمَا أَمْكَنَ أَنْ يُوجَدَ شَيْءٌ مِنَ الحَوَادِثِ فَلاَ يَفْتَقِرُ إِلَيْهِ شَيْءٌ، كَيْفَ! وَهُوَ الذَّي يَفتْقِرُ إِلَيْهِ كُلُّ مَا سِوَاهُ.","en":"As for the dependence of everything other than Him upon Him, the Mighty and High, it necessitates for Him Life and complete Power, Will, and Knowledge. This is because if any of these did not exist, it would not be possible for any temporal thing to exist, and then nothing would depend on Him. How could this be, when everything other than Him relies upon Him?","note":""},{"id":"u48","ar":"وَيُوجِبُ لَهُ تَعَالَى أَيْضًا: الْوَحْدَانِية، إِذْ لَوْ كانَ مَعَهُ ثَانٍ فِي اْلأُلُوهِيَّةِ لما افْتقَرَ إِلَيْهِ شَيْءٌ لِلُزُومِ عَجْزِهِمَا حِينَئِذٍ، كيْفَ! وَهُوَ الذَّي يَفْتَقِرُ إِلَيْهِ كلُّ مَا سِوَاهُ.","en":"It also necessitates for Him, the Exalted, Oneness. This is because were there a second who shared in Divinity, nothing would depend upon Him due to it necessitating both of their inability therein. How could this be, when everything other than Him relies upon Him?","note":""},{"id":"u49","ar":"وَيُؤْخذُ منْهُ أَيْضًا: حُدُوثُ الْعَالَمِ بِأَسْرهِ، إِذْ كانَ شَيْءٌ مِنْهُ قَديمًا لَكَانَ ذلِكَ الشَّيْءُ مُسْتَغْنِيًا عَنْهُ تَعَالَى، كَيْفَ! وَهُوَ الذَّيِ يَجِبُ أَنْ يَفتْقِرَ إِلِيْهِ كُلُّ مَا سِوَاهُ.","en":"Also taken from this is the temporality of the entire universe. This is because if anything were pre-eternal from it, that thing would be independent of Him, the Exalted. How could this be, when He is the One who everything else depends upon.","note":""},{"id":"u50","ar":"وَيُؤخَذُ مِنْهُ أَيْضًا: أَنَّهُ لاَ تَأْثِيرَ لِشَيْءٍ مِنَ الْكَائِنَاتِ فِي أَثَر مَّا، وَإلّا لَزِمَ أَنْ يَسْتَغْني ذلِكَ اْلأَثَرُ عَنْ مَوْلاَنَا جَلَّ وَعَزَّ، كَيْفَ! وَهُوَ الذَّي يَفْتَقِرُ إِلَيْهِ كُلُّ مَا سِوَاهُ عُمُومًا وَعَلَى كُلِّ حَالٍ.","en":"Also taken from this is that there is no causal efficacy of anything in existence for any effect. Otherwise, it would necessitate the independence of that effect of Our Lord, the Mighty and High. How could this be, when everything other than Him is totally dependent upon Him in every case.","note":""},{"id":"u51","ar":"هذَا إِنْ قَدَّرْتَ أَنَّ شَيْئًا مِنَ الْكائِنَاتِ يُؤَثّرُ بِطَبْعِهِ، وَأَمَّا إِنْ قَدَّرْتَهُ مُؤَثِّرًا بِقَوَّةٍ جَعَلَهَا اللهُ فِيهِ كم يَزْعُمُهُ كَثِيرٌ مِنَ الْجَهَلَةِ فَذلِكَ محَالٌ أَيْضًا، لأَنَّهُ يَصِيرُ حيِنَئِذٍ مَوْلاَنَا جَلَّ وَعَزَّ مُفْتَقِرًا فِي إِيجَادِ بَعْضِ اْلأَفْعَالِ إِلَى وَاسِطَةٍ، وَذلِكَ بَاطِلٌ لِمَا عَرَفْتَ مِنْ وُجُوبِ اسْتِغْنَائِهِ جَلَّ وَعَزَّ عَنْ كُلِّ مَا سِوَاهُ.","en":"This [is in the case] of if you assessed that things have causal efficacy by their intrinsic nature. As for if you assess that they have causal efficacy by a power placed in them by Allah as is alleged by many of the ignorant, this is also impossible. This is because Our Lord, Mighty and High, would then be in need of an intermediary in order to create some actions, and this is invalid as you know from the necessity of His independence from everything other than Him.","note":""},{"id":"u52","ar":"فَقَدْ بَانَ لَكَ تَضَمُّنُ قَوْلِ: لاَ إِلهَ إِلاَّ اللهُ لِلأَقْسَامِ الثَّلاَثَةِ التَّيِ يَجِبُ عَلَى المُكَلَّفِ مَعْرِفَتُهَا فِي حَقِّ مَوْلاَنَا جَلَّ وَعَزَّ، وَهِيَ: مَا يجِبُ فِي حَقِّهِ تَعَالَى، وَمَا يَسْتَحِيلُ، وَمَا يَجُوزُ.","en":"It will be clear to you that the statement **\"there is no God but Allah** contains the three categories that are necessary for the moral agent to know in His right, the Mighty and High. They are: what is necessary in His right, what is impossible, and what is possible.","note":""},{"id":"u53","ar":"وَأَمَّا قَوْلُنَا مُحَمَّدٌ رَسُولُ اللهِ صَلى الله عليه وسلم فَيَدْخُلُ فيه الإِيمَانُ اْلأَنْبِيَاءِ وَالمَلاَئِكَةِ وَالْكُتُبِ السَّمَاوِيَّةِ وَاْليَوْمِ الآخِرِ، لأَنَّهُ عَلَيْهِ الصَّلاَةُ وَالسَّلاَمُ جَاءَ بِتَصْدِيقِ جَمِيعِ ذلِكَ كُلِّهِ.","en":"As for our saying, Muhammad is the Messenger of Allah, blessings and peace be upon him, it includes belief in all the Prophets, Angels, Divine Scripture, and the Last Day, because He, blessings and peace be upon him, came to affirm all of these.","note":""},{"id":"u54","ar":"وَيُؤْخَذُ مِنْهُ: وُجُوبُ صِدْقِ الرّسُلِ عَلَيْهِمُ الصَّلاَةُ وَالسَّلاَمُ. وَاسْتِحَالَةُ الْكَذِبِ عَلَيْهِمْ، وَإِلاَّ لَمْ يَكُونُوا رُسُلاَ أمَنَاءَ لمَوْلاَنَا العَالِمِ بِالخَفِيَّاتِ جَلَّ وَعَزَّ.","en":"Derived from it is also the necessity of the truthfulness of the Messengers, upon them be blessings and peace, and the impossibility of them lying. This is because otherwise, they would not be Messengers entrusted by Our Lord, the Knower of all hidden things, the Mighty and High.","note":""},{"id":"u55","ar":"وَاسْتِحَالَةُ فِعْلِ المَنْهِيَّاتِ كلِّهَا لأَنَّهُمْ أُرْسِلُوا لِيُعَلِّمُوا النَّاسَ بِأَقْوَالِهِمْ، وَأفْعَالِهِمْ وَسُكُوتِهِمْ، فَيَلْزَمُ أَنْ لاَ يَكُونَ فِي جَمِيعِهَا مُخَالَفَةٌ لأَمْرِ مَوْلاَنَا جَلَّ وَعَزَّ الذِّي اخْتَارَهُمْ عَلَى جَمِيعِ خَلْقِهِ وَأَمِنَهُمْ عَلَى سِرِّ وَحِيْهِ.","en":"And [also known from the statement] is the impossibility of all prohibited actions for them, because they were sent to teach the people with their speech, action, and tacit approval. This necessitates that there is no deviation from the command of Our Lord, the Mighty and High, who selected them over the rest of His creation and entrusted them with the secret of His revelation.","note":""},{"id":"u56","ar":"وَيُؤْخَذُ مِنْهُ: جَوَازُ اْلأَعْرَاضِ الْبَشَرِيةِ عَلَيْهِمْ، إِذْ ذَاكَ لاَ يَقْدَحُ فِي رِسَالَتهمْ، وَعُلُوِّ مَنْزِلَتِهِمْ عِنْدَ اللهِ تَعَالَى بَلْ ذَاكَ مِمَّا يَزِيدُ فِيهَا.","en":"Also derived from this is the possibility of human traits for them, as this does not diminish from their Prophethood and the loftiness of their rank with Allah, the Exalted. Rather, this is what He willed.","note":""}]}</script>
<script>
"use strict";
/* ============================ CONTENT ============================ */
const DATA = JSON.parse(document.getElementById("year1-data").textContent);
const BOOK_LESSON = { tahawiyya: 8, umm: 6 };
const VOCAB = DATA.vocab.map(v => ({ ...v, deck: "quran" }));
const NUR = DATA.nur.flatMap((ch, ci) => ch.cards.map(c => ({ ...c, ch: ci, deck: "nur" })));
const CARD_BY_ID = Object.fromEntries([...VOCAB, ...NUR].map(c => [c.id, c]));

const YEARS = [
 { n:1, title:"Foundations", desc:"The most common words of the Qur'an, the fiqh of worship from Nur al-Idah, and the core creed.",
   books:[
     { id:"tahawiyya", title:"Al-'Aqidah al-Tahawiyyah", sub:"The creed of Imam al-Tahawi, line by line", glyph:"ط", color:"#0E5A43", lines:DATA.tahawiyya },
     { id:"umm", title:"Umm al-Barahin", sub:"Imam al-Sanusi's short creed", glyph:"ب", color:"#5C6B2E", lines:DATA.umm },
   ],
   pendingBooks:["Suyuti's Mawlid","Nawawi's Seerah (excerpt)","Tajweed basics"],
   decks:[
     { id:"quran", title:"Qur'an words: top 500", sub:"The 500 most frequent words cover about 86% of the Qur'an's text", glyph:"ق", color:"#8A4FA3", cards:VOCAB },
     { id:"nur", title:"Nur al-Idah", sub:"Hanafi fiqh of purification, prayer and fasting, 22 chapters", glyph:"ن", color:"#2F6E8F", cards:NUR },
   ] },
 { n:2, title:"Building blocks", desc:"Qur'anic roots, grammar and morphology, and deeper creed.",
   plan:[ ["Qur'an roots (1,000), meanings from Mufradat al-Qur'an","need"], ["Arabic verbs: first 700 by frequency","have"], ["Nahw: al-Ajurrumiyyah","need"], ["Sarf: Tasrif al-'Izzi","need"],
          ["Aqeedah: Jawharat al-Tawhid","have"], ["Fiqh (Arabic): Ithaf al-Talib","have"], ["Tasawwuf: Etiquettes of the Naqshbandi Path","need"], ["I'rab practice: short sentences","build"] ] },
 { n:3, title:"Depth", desc:"Qur'anic nouns, Modern Standard Arabic vocabulary, and the major texts.",
   plan:[ ["Qur'an nouns (1,000)","have"], ["MSA vocabulary, part 1 (corrected and frequency-ordered)","need"], ["Nahw: Sharh Qatr al-Nada","need"], ["Aqeedah: Sharh al-'Aqa'id al-Nasafiyyah","have"],
          ["Fiqh: Mukhtasar al-Quduri","have"], ["Fiqh: Mercy in the Difference of the Four Schools","have"], ["Qasidat al-Burdah","need"], ["I'rab of Qur'anic ayat","build"] ] },
];

/* ============================ STATE ============================ */
const KEY = "deenpath.v2";
const PASS = 0.8, MASTER_IVL = 7, RETAIN = 0.85, TEST_LEN = 40;
function fresh(){ return { xp:0, streak:0, lastDay:null, days:{}, offset:0, newPerDay:15, newDone:{}, books:{}, cards:{}, log:[], tests:{}, unlocked:[1] }; }
function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)); return s && s.cards ? Object.assign(fresh(), s) : fresh(); }catch(e){ return fresh(); } }
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(S)); }catch(e){} }
let S = load();
const today = () => Math.floor((Date.now() - new Date().getTimezoneOffset()*60000) / 864e5) + S.offset;
function touchDay(xp){
  const t = today();
  if (S.lastDay !== t) S.streak = (S.lastDay === t-1) ? S.streak + 1 : 1;
  S.lastDay = t; S.xp += xp; S.days[t] = (S.days[t]||0) + xp; save();
}
if (S.lastDay !== null && today() - S.lastDay > 1) { S.streak = 0; save(); }

/* ======================= SPACED REPETITION ======================= */
/* SM-2 style. ivl in days. ivl 0 = still learning (seen again this session). */
function schedule(st, g){
  const s = st ? { ...st } : { ivl:0, ease:2.5, reps:0, lapses:0, due:today() };
  const wasReview = s.ivl >= 1;
  if (g === 0){ if (wasReview){ s.lapses++; s.ease = Math.max(1.3, s.ease-0.2); } s.ivl = 0; }
  else if (g === 1){ if (wasReview){ s.ivl = Math.max(s.ivl+1, Math.round(s.ivl*1.2)); s.ease = Math.max(1.3, s.ease-0.15); } else s.ivl = 0; }
  else if (g === 2){ s.ivl = wasReview ? Math.max(s.ivl+1, Math.round(s.ivl*s.ease)) : 1; }
  else { s.ivl = wasReview ? Math.max(s.ivl+2, Math.round(s.ivl*s.ease*1.3)) : 3; s.ease += 0.15; }
  s.reps++; s.due = today() + s.ivl;
  return { s, wasReview };
}
const ivlLabel = (st, g) => { const n = schedule(st, g).s.ivl; return n === 0 ? "again" : n < 30 ? n + "d" : Math.round(n/30) + "mo"; };
function deckStats(deck){
  let nw=0, learning=0, due=0, mastered=0; const t = today();
  for (const c of deck.cards){ const st = S.cards[c.id];
    if (!st) nw++; else { if (st.ivl >= MASTER_IVL) mastered++; else learning++; if (st.due <= t) due++; } }
  return { total:deck.cards.length, nw, learning, due, mastered };
}
function retention(){
  const recent = S.log.slice(-300); if (!recent.length) return null;
  return recent.filter(x => x).length / recent.length;
}
const newLeft = deck => Math.max(0, S.newPerDay - ((S.newDone[today()]||{})[deck.id]||0));

/* ======================= YEAR PROGRESS ======================= */
const lessonsOf = b => Math.ceil(b.lines.length / BOOK_LESSON[b.id]);
const bookDone = b => (S.books[b.id]||[]).length;
function yearStatus(y){
  if (!y.books) return { books:0, flash:0, test:false, ready:false };
  const lt = y.books.reduce((a,b)=>a+lessonsOf(b),0), ld = y.books.reduce((a,b)=>a+Math.min(bookDone(b),lessonsOf(b)),0);
  const ct = y.decks.reduce((a,d)=>a+d.cards.length,0), cm = y.decks.reduce((a,d)=>a+deckStats(d).mastered,0);
  const ret = retention();
  const booksOk = ld >= lt, cardsOk = cm >= ct && (ret === null || ret >= RETAIN);
  const t = S.tests[y.n]; const passed = !!(t && t.passed);
  return { books:ld/lt, booksOk, ld, lt, flash:cm/ct, cardsOk, cm, ct, ret, ready:booksOk && cardsOk, passed, best:t ? t.best : null };
}

/* ============================ HELPERS ============================ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const pct = x => Math.round(x*100) + "%";
const ICON = {
  flame:'<svg viewBox="0 0 24 24"><path d="M12 2c1 4 5 5.5 5 11a5 5 0 0 1-10 0c0-2.5 1.2-4 2.5-5 .2 2 1 3 2 3.5C11 9 11 5.5 12 2Z" fill="var(--gold)"/></svg>',
  star:'<svg viewBox="0 0 24 24"><path d="m12 2.8 2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2l-5.6 3 1.1-6.3L2.9 9.5l6.3-.9L12 2.8Z" fill="var(--brand)"/></svg>',
  learn:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 5.5C5 4 9 4 12 6c3-2 7-2 10-.5V19c-3-1.5-7-1.5-10 .5-3-2-7-2-10-.5Z"/><path d="M12 6v13.5"/></svg>',
  user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4.5 4.5-6.5 8-6.5s7 2 8 6.5"/></svg>',
  x:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  back:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  lock:'<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
  check:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="var(--warn)" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg>',

/* ======================= STUDY SESSION (SRS) ======================= */
let Q = null;
function buildQueue(deckIds){
  const t = today(), q = [];
  for (const d of YEARS[0].decks.filter(d => deckIds.includes(d.id))){
    const due = d.cards.filter(c => S.cards[c.id] && S.cards[c.id].due <= t).sort((a,b)=>S.cards[a.id].due-S.cards[b.id].due);
    const nw = d.cards.filter(c => !S.cards[c.id]).slice(0, newLeft(d));
    q.push(...due, ...nw);
  }
  return q;
}
function startStudy(deckIds){
  const q = buildQueue(deckIds);
  if (!q.length) return modal(`<p style="margin-top:0;font-weight:700">Nothing to study right now.</p><p class="small muted">Come back tomorrow for your next reviews, or raise new cards per day in Progress.</p><button class="btn" id="mok">OK</button>`, (d,c)=>d.querySelector("#mok").onclick=c);
  Q = { q, i:0, shown:false, total:q.length, done:0, again:0, xp:0, deckIds };
  renderStudy();
}
function cardFront(c){
  if (c.deck === "quran") return `<div class="kicker">Qur'an word · #${c.rank} most frequent</div><div class="card" style="text-align:center;padding:26px 16px">
     <div class="big-ar">${esc(c.ar)}</div><span class="pill">${esc(c.pos)}</span>${c.root?` <span class="pill ar" style="font-size:.95rem">${esc(c.root.split("").join(" "))}</span>`:""}</div>`;
  return `<div class="kicker">Nur al-Idah · ${esc(DATA.nur[c.ch].title)}</div><div class="card"><p class="q" style="margin:0">${esc(c.q)}</p></div>`;
}
function cardBack(c){
  if (c.deck === "quran") return `<div class="card" style="margin-top:12px"><div style="font-size:1.25rem;font-weight:800">${esc(c.en)}</div>
     ${c.src==="ai"?`<span class="pill gold" style="margin-top:6px">AI · needs review</span>`:""}
     <div class="ayah">${esc(c.ayah)}</div><div class="ref">Qur'an ${esc(c.ref)} · knowing words 1–${c.rank} covers ${c.cov}% of the Qur'an</div></div>`;
  return `<div class="card answer" style="margin-top:12px">${esc(c.a)}</div>`;
}
function renderStudy(){
  const c = Q.q[Q.i];
  if (!c) return finishStudy();
  const st = S.cards[c.id];
  const foot = !Q.shown ? `<div class="pfoot"><button class="btn" id="show">Show answer</button></div>`
    : `<div class="pfoot"><div class="grades">${["Again","Hard","Good","Easy"].map((l,g)=>`<button class="grade g${g}" data-g="${g}">${l}<span>${ivlLabel(st,g)}</span></button>`).join("")}</div></div>`;
  $("#app").innerHTML = `<div class="player"><div class="player-in">
    <div class="phead"><button class="x" id="quit" aria-label="Stop studying">${ICON.x}</button><div class="bar"><i style="width:${Q.done/Q.total*100}%"></i></div><span class="count">${Q.q.length-Q.i} left</span></div>
    <div class="pbody">${cardFront(c)}${Q.shown?cardBack(c):""}</div>${foot}</div></div>`;
  const sh = $("#show"); if (sh) sh.onclick = () => { Q.shown = true; renderStudy(); };
  document.querySelectorAll("[data-g]").forEach(b => b.onclick = () => grade(+b.dataset.g));
  $("#quit").onclick = () => { Q = null; touchDay(0); render(); };
}
function grade(g){
  const c = Q.q[Q.i], prev = S.cards[c.id];
  if (!prev){ const t = today(); S.newDone[t] = S.newDone[t]||{}; S.newDone[t][c.deck] = (S.newDone[t][c.deck]||0) + 1; }
  const { s, wasReview } = schedule(prev, g);
  S.cards[c.id] = s;
  if (wasReview){ S.log.push(g >= 1 ? 1 : 0); if (S.log.length > 1000) S.log = S.log.slice(-600); }
  if (s.ivl === 0){ Q.q.splice(Math.min(Q.q.length, Q.i + 4), 0, c); Q.total++; Q.again++; }
  Q.done++; Q.i++; Q.shown = false; Q.xp += 1; S.xp += 1; S.days[today()] = (S.days[today()]||0) + 1;
  save(); renderStudy();
}
function finishStudy(){
  const xp = Q.xp; touchDay(0); Q = null;
  $("#app").innerHTML = `<div class="player"><div class="player-in"><div class="done-screen">
    <div style="width:80px">${ICON.logo}</div><div class="big">Session complete</div>
    <div class="tiles"><div class="tile"><b>${xp}</b><span>Cards studied</span></div><div class="tile"><b>${S.streak}</b><span>Day streak</span></div></div>
    <p class="muted small" style="margin:0;max-width:320px">Cards you knew well come back in a few days. Ones you missed come back sooner.</p></div>

  $("#cont").onclick = () => render();

/* ======================= BOOK LESSON ======================= */
let B = null;
function startLesson(bookId, idx){
  const b = YEARS[0].books.find(x=>x.id===bookId), n = BOOK_LESSON[bookId];
  const lines = b.lines.slice(idx*n, idx*n+n);
  const quiz = shuffle(lines.filter(l => l.en.length < 260)).slice(0, 3).map(l => {
    return { kind:"mcq", prompt:l.ar, answer:l.en, options:shuffle([l.en, ...distinct(b.lines.filter(x=>x.en.length<260).map(x=>x.en), l.en, 3)]) };
  });
  B = { b, idx, steps:[...lines.map(l=>({kind:"read", l})), ...quiz], i:0, sel:null, answered:false, correct:0, nq:quiz.length };
  renderLesson();
}
function renderLesson(){
  const st = B.steps[B.i];
  if (!st) return finishLesson();
  let body, foot;
  if (st.kind === "read"){
    body = `<div class="kicker">${esc(B.b.title)} · line ${B.i+1}</div><div class="card"><p class="line-ar">${esc(st.l.ar)}</p><p style="margin:0">${esc(st.l.en)}</p>
      ${st.l.note?`<details><summary>Commentary</summary><p class="small answer">${esc(st.l.note)}</p></details>`:""}</div>`;
    foot = `<div class="pfoot"><button class="btn" id="next">Continue</button></div>`;
  } else {
    body = `<div class="kicker">Check your understanding</div><p class="small muted" style="margin:0 0 6px">What does this line mean?</p><p class="line-ar">${esc(st.prompt)}</p>
      <div class="opts">${st.options.map((o,i)=>{ let cls=""; if (B.answered){ if (o===st.answer) cls="right"; else if (i===B.sel) cls="wrong"; } else if (i===B.sel) cls="sel";
        return `<button class="opt ${cls}" data-o="${i}" ${B.answered?"disabled":""}>${esc(o)}</button>`; }).join("")}</div>`;
    if (!B.answered) foot = `<div class="pfoot"><button class="btn" id="check" ${B.sel===null?"disabled":""}>Check</button></div>`;
    else { const ok = st.options[B.sel] === st.answer;
      foot = `<div class="pfoot ${ok?"ok":"bad"}" role="status"><div class="fb"><strong>${ok?"Correct, masha'Allah":"Not quite"}</strong>${ok?"":`<span class="small">The highlighted answer is the meaning of this line.</span>`}</div><button class="btn" id="next">Continue</button></div>`; }
  }
  $("#app").innerHTML = `<div class="player"><div class="player-in"><div class="phead"><button class="x" id="quit" aria-label="Leave lesson">${ICON.x}</button>
    <div class="bar"><i style="width:${B.i/B.steps.length*100}%;background:${B.b.color}"></i></div></div><div class="pbody">${body}</div>${foot}</div></div>`;
  document.querySelectorAll("[data-o]").forEach(x => x.onclick = () => { B.sel = +x.dataset.o; renderLesson(); });
  const ck = $("#check"); if (ck) ck.onclick = () => { B.answered = true; if (st.options[B.sel] === st.answer) B.correct++; renderLesson(); };
  const nx = $("#next"); if (nx) nx.onclick = () => { B.i++; B.sel = null; B.answered = false; renderLesson(); };
  $("#quit").onclick = () => confirmBox("Leave this lesson? It won't be marked as done.", () => { const id = B.b.id; B = null; go({name:"book", id}); });
}
function finishLesson(){
  const done = S.books[B.b.id] = S.books[B.b.id] || [], first = !done.includes(B.idx);
  if (first) done.push(B.idx);
  const xp = first ? 10 + B.correct*2 : 3; touchDay(xp);
  const id = B.b.id, score = `${B.correct}/${B.nq}`; B = null;
  $("#app").innerHTML = `<div class="player"><div class="player-in"><div class="done-screen"><div style="width:80px">${ICON.logo}</div><div class="big">Lesson complete</div>
    <div class="tiles"><div class="tile"><b>+${xp}</b><span>XP</span></div><div class="tile"><b>${score}</b><span>Questions right</span></div></div></div>
    <div class="pfoot"><button class="btn" id="cont">Continue</button></div></div></div>`;
  $("#cont").onclick = () => go({name:"book", id});
}

/* ======================= FINAL TEST ======================= */
let T = null;
function distinct(pool, answer, n){ const seen = new Set([answer]), out = [];
  for (const x of shuffle(pool)){ if (!seen.has(x)){ seen.add(x); out.push(x); if (out.length === n) break; } } return out; }
function makeTest(y){
  const qs = [];
  const vocab = shuffle(VOCAB).slice(0, 15);
  for (const v of vocab){ qs.push({ src:"Qur'an words", promptAr:v.ar, q:"What does this word mean?", answer:v.en, options:shuffle([v.en, ...distinct(VOCAB.map(x=>x.en), v.en, 3)]) }); }
  const shortNur = NUR.filter(c => c.a.length <= 170 && c.a.length >= 3);
  for (const c of shuffle(shortNur).slice(0, 15)){
    let pool = shortNur.filter(x => x.ch === c.ch && x.id !== c.id && x.a !== c.a); if (pool.length < 3) pool = shortNur.filter(x=>x.id!==c.id && x.a!==c.a);
    let ds = distinct(pool.map(x=>x.a), c.a, 3); if (ds.length < 3) ds = distinct(shortNur.map(x=>x.a), c.a, 3);
    qs.push({ src:"Nur al-Idah", q:c.q, answer:c.a, options:shuffle([c.a, ...ds]) }); }
  const lines = y.books.flatMap(b => b.lines.filter(l=>l.en.length<220).map(l=>({...l, book:b.title})));
  for (const l of shuffle(lines).slice(0, TEST_LEN-30)){ qs.push({ src:l.book, promptAr:l.ar, q:"What does this line mean?", answer:l.en, options:shuffle([l.en, ...distinct(lines.map(x=>x.en), l.en, 3)]) }); }
  return shuffle(qs);
}
function startTest(n){ T = { n, qs:makeTest(YEARS[n-1]), i:0, sel:null, wrong:[], right:0 }; renderTest(); }
function renderTest(){
  const q = T.qs[T.i]; if (!q) return finishTest();
  $("#app").innerHTML = `<div class="player"><div class="player-in"><div class="phead"><button class="x" id="quit" aria-label="Leave test">${ICON.x}</button>
    <div class="bar"><i style="width:${T.i/T.qs.length*100}%;background:var(--gold)"></i></div><span class="count">${T.i+1}/${T.qs.length}</span></div>
    <div class="pbody"><div class="kicker">Year ${T.n} final test · ${esc(q.src)}</div>
    ${q.promptAr?`<p class="line-ar" style="text-align:center;font-size:${q.promptAr.length<20?"2.2rem":"1.4rem"}">${esc(q.promptAr)}</p>`:""}
    <p class="q">${esc(q.q)}</p>
    <div class="opts">${q.options.map((o,i)=>`<button class="opt ${i===T.sel?"sel":""}" data-o="${i}">${esc(o)}</button>`).join("")}</div></div>
    <div class="pfoot"><button class="btn" id="next" ${T.sel===null?"disabled":""}>${T.i+1<T.qs.length?"Next question":"Finish test"}</button></div></div></div>`;
  document.querySelectorAll("[data-o]").forEach(x => x.onclick = () => { T.sel = +x.dataset.o; renderTest(); });
  $("#next").onclick = () => { if (q.options[T.sel] === q.answer) T.right++; else T.wrong.push({ ...q, given:q.options[T.sel] }); T.i++; T.sel = null; renderTest(); };
  $("#quit").onclick = () => confirmBox("Leave the test? This attempt won't count.", () => { const n=T.n; T = null; go({name:"year", n}); });
}
function finishTest(){
  const score = T.right / T.qs.length, passed = score >= PASS, n = T.n;
  const rec = S.tests[n] = S.tests[n] || { attempts:0, best:0, passed:false };
  rec.attempts++; rec.best = Math.max(rec.best, score);
  const firstPass = passed && !rec.passed;
  if (passed){ rec.passed = true; if (!S.unlocked.includes(n+1) && n < YEARS.length) S.unlocked.push(n+1); }
  touchDay(firstPass ? 100 : 5);
  const wrong = T.wrong; T = null;
  $("#app").innerHTML = `<div class="player"><div class="player-in"><div class="pbody"><div class="done-screen" style="padding:24px 0 8px">
    <div style="width:80px">${ICON.logo}</div><div class="big">${passed ? "Passed, alhamdulillah" : "Not yet"}</div>
    <div class="tiles"><div class="tile"><b>${pct(score)}</b><span>Your score</span></div><div class="tile"><b>${PASS*100}%</b><span>Pass mark</span></div></div>
    <p class="muted" style="margin:0;max-width:340px">${passed ? (n < YEARS.length ? `Year ${n+1} is now unlocked.` : "You have completed the syllabus.") : "Review the questions below, keep up your flashcards, and try again when you're ready."}</p></div>
    ${wrong.length?`<p class="label">Questions to review (${wrong.length})</p><div class="stack review-list">${wrong.map(w=>`<div class="card">${w.promptAr?`<p class="line-ar" style="font-size:1.2rem;margin:0">${esc(w.promptAr)}</p>`:""}<p style="margin:0 0 6px;font-weight:700">${esc(w.q)}</p>
      <p class="small" style="margin:0;color:var(--ok)"><b>Correct:</b> ${esc(w.answer)}</p><p class="small" style="margin:4px 0 0;color:var(--bad)"><b>You chose:</b> ${esc(w.given)}</p></div>`).join("")}</div>`:""}
    </div><div class="pfoot"><button class="btn" id="cont">Continue</button></div></div></div>`;
  $("#cont").onclick = () => go({ name:"home" });
}

/* ======================= RENDER + EVENTS ======================= */
function render(){
  const app = $("#app");
  if (view.name === "home") app.innerHTML = homeView();
  else if (view.name === "year") app.innerHTML = yearView(view.n);
  else if (view.name === "book") app.innerHTML = bookView(view.id);
  else app.innerHTML = profileView();
  app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go({ name:b.dataset.go }));
  app.querySelectorAll("[data-year]").forEach(b => b.onclick = () => go({ name:"year", n:+b.dataset.year }));
  app.querySelectorAll("[data-book]").forEach(b => b.onclick = () => go({ name:"book", id:b.dataset.book }));
  app.querySelectorAll("[data-lesson]").forEach(b => b.onclick = () => { if (!b.disabled) startLesson(view.id, +b.dataset.lesson); });
  app.querySelectorAll("[data-deck]").forEach(b => b.onclick = () => startStudy([b.dataset.deck]));
  app.querySelectorAll("[data-study]").forEach(b => b.onclick = () => startStudy(YEARS[0].decks.map(d=>d.id)));
  app.querySelectorAll("[data-test]").forEach(b => b.onclick = () => { if (!b.disabled) startTest(+b.dataset.test); });
  const npd = $("#npd"); if (npd) npd.onchange = () => { S.newPerDay = +npd.value; save(); };
  const sk = $("#skipday"); if (sk) sk.onclick = () => { S.offset++; save(); render(); };
  const ft = $("#fasttrack"); if (ft) ft.onclick = () => confirmBox("Mark every Year 1 lesson done and every flashcard mastered, so you can try the final test? (Testing only)", () => {
    const y = YEARS[0]; y.books.forEach(b => S.books[b.id] = [...Array(lessonsOf(b)).keys()]);
    y.decks.forEach(d => d.cards.forEach(c => S.cards[c.id] = { ivl:MASTER_IVL+3, ease:2.5, reps:4, lapses:0, due:today()+10 }));
    S.log = Array(50).fill(1); save(); go({ name:"year", n:1 }); });
  const rs = $("#reset"); if (rs) rs.onclick = () => confirmBox("Reset all progress, XP, flashcards and test results?", () => { S = fresh(); save(); go({ name:"home" }); });
}
render();
</script>
