<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sirat al-Ihsan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Amiri+Quran&family=Marcellus&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
/* Plan: deep emerald + saffron gold on green-biased neutrals. One-column mobile app shell, bottom nav; years stacked like a path. */
:root{
  --bg:#F3F6F2; --surface:#FFFFFF; --ink:#14231C; --muted:#5B6B62; --line:#DCE4DE;
  --brand:#0E5A43; --brand-ink:#FFFFFF; --gold:#C8912B; --gold-soft:#F6E8C9;
  --ok:#1E8A4C; --ok-soft:#DDF3E5; --bad:#C2413A; --bad-soft:#FBE3E1; --warn:#B7791F;
  --display:"Marcellus", Georgia, serif; --body:"Nunito Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --arabic:"Amiri", "Traditional Arabic", serif; --quran:"Amiri Quran", "Amiri", serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1612; --surface:#15221C; --ink:#E7EFEA; --muted:#93A69B; --line:#26372E;
  --brand:#3FB98A; --brand-ink:#06140E; --gold:#E2B055; --gold-soft:#3A2F17;
  --ok:#4CC27E; --ok-soft:#163A26; --bad:#EF7A72; --bad-soft:#3E1C1A; --warn:#E2B055; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D1612; --surface:#15221C; --ink:#E7EFEA; --muted:#93A69B; --line:#26372E;
  --brand:#3FB98A; --brand-ink:#06140E; --gold:#E2B055; --gold-soft:#3A2F17;
  --ok:#4CC27E; --ok-soft:#163A26; --bad:#EF7A72; --bad-soft:#3E1C1A; --warn:#E2B055; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ar{font-family:var(--arabic);direction:rtl;unicode-bidi:isolate}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
main{flex:1;padding:16px 16px 104px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:1.7rem} h2{font-size:1.3rem}
.muted{color:var(--muted)} .small{font-size:.86rem}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
.brandmark{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:1.25rem}
.brandmark svg{width:28px;height:28px}
.stats{display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:.88rem;font-variant-numeric:tabular-nums}
.chip svg{width:16px;height:16px}
.label{font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:22px 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .4s}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.gold{background:var(--gold-soft);color:var(--warn)} .pill.brand{background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand)}
/* today */
.today{background:var(--brand);color:var(--brand-ink);border-radius:18px;padding:16px;display:grid;gap:12px}
.today .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.today .nums div{background:rgba(255,255,255,.12);border-radius:12px;padding:8px 10px}
.today .nums b{display:block;font-size:1.4rem;font-variant-numeric:tabular-nums;line-height:1.2}
.today .nums span{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;font-weight:800;opacity:.85}
/* year cards */
.year{display:grid;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;border-bottom-width:3px;width:100%}
.year.current{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.year.locked{opacity:.72}
.year .head{display:flex;gap:14px;align-items:center}
.yr-badge{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-size:1.5rem;background:var(--brand);color:var(--brand-ink);flex:none}
.year.locked .yr-badge{background:var(--line);color:var(--muted)}
.gates{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gate{border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:.78rem;font-weight:700;display:grid;gap:6px}
.gate .bar{height:6px}
.gate.done{border-color:var(--ok);background:var(--ok-soft)}
/* lists */
.item{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%}
.item[disabled]{cursor:default}
.ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--arabic);font-size:1.35rem;color:#fff}
.item .t{font-weight:800;line-height:1.3}
.item .s{font-size:.84rem;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:6px 0;color:var(--muted);font-weight:700}
.hero{border-radius:18px;padding:18px;color:#fff;background:var(--brand);margin:6px 0 4px}
.hero p{margin:6px 0 0;opacity:.92;font-size:.92rem}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;padding:6px 0}
.check i{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;margin-top:1px}
.check.on i{background:var(--ok);border-color:var(--ok);color:#fff}
.check i svg{width:14px;height:14px}
/* buttons */
.btn{width:100%;border:0;border-radius:14px;padding:14px;font-weight:800;font-size:.98rem;letter-spacing:.03em;text-transform:uppercase;background:var(--brand);color:var(--brand-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--brand) 62%,#000)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 color-mix(in srgb,var(--brand) 62%,#000)}
.btn[disabled]{background:var(--line);color:var(--muted);box-shadow:none;cursor:default;transform:none}
.btn.ghost{background:transparent;color:var(--brand);box-shadow:none;border:2px solid var(--line)}
.btn.small{width:auto;padding:9px 14px;font-size:.8rem}
.btn.gold{background:var(--gold);color:#241604;box-shadow:0 4px 0 color-mix(in srgb,var(--gold) 60%,#000)}
/* full-screen player */
.player{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column}
.player-in{max-width:560px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:0}
.phead{display:flex;align-items:center;gap:12px;padding:14px 16px}
.x{background:none;border:0;padding:4px;color:var(--muted)} .x svg{width:24px;height:24px}
.phead .bar{flex:1;height:12px}
.phead .count{font-weight:800;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pbody{flex:1;overflow-y:auto;padding:8px 16px 16px}
.pfoot{padding:14px 16px 20px;border-top:1px solid var(--line);background:var(--surface)}
.pfoot.ok{background:var(--ok-soft);border-color:transparent} .pfoot.bad{background:var(--bad-soft);border-color:transparent}
.fb{margin-bottom:12px} .fb strong{display:block;font-size:1.08rem}
.pfoot.ok .fb strong{color:var(--ok)} .pfoot.bad .fb strong{color:var(--bad)}
.kicker{font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--brand);margin-bottom:8px}
.big-ar{font-family:var(--quran);direction:rtl;text-align:center;font-size:2.6rem;line-height:1.9;margin:6px 0}
.line-ar{font-family:var(--arabic);direction:rtl;text-align:right;font-size:1.45rem;line-height:1.95;margin:0 0 10px}
.ayah{font-family:var(--quran);direction:rtl;text-align:right;font-size:1.3rem;line-height:2.1;background:var(--bg);border-radius:12px;padding:10px 12px;margin:10px 0 4px}
.ref{font-size:.8rem;color:var(--muted)}
.answer{white-space:pre-line}
details{margin-top:10px} summary{cursor:pointer;color:var(--brand);font-weight:700;font-size:.9rem}
.q{font-size:1.15rem;font-weight:800;margin:0 0 16px;line-height:1.4}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:13px 15px;font-weight:600;line-height:1.4}
.opt.sel{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--surface))}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grade{border:0;border-radius:12px;padding:10px 4px;font-weight:800;font-size:.86rem;color:#fff;display:grid;gap:2px}
.grade span{font-size:.72rem;font-weight:700;opacity:.9}
.g0{background:var(--bad)} .g1{background:var(--warn)} .g2{background:var(--ok)} .g3{background:#2F6E8F}
.done-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px}
.done-screen .big{font-family:var(--display);font-size:2rem}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:360px}
.tile{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface)}
.tile b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}
.tile span{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--gold-soft);border-radius:12px;padding:10px 12px;font-size:.86rem}
.notice svg{flex:none;width:20px;height:20px;margin-top:1px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:10}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;padding:6px 16px 10px}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;font-size:.78rem;font-weight:800;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--brand)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px;z-index:40}
.modal .card{max-width:380px;width:100%}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btnrow .btn{flex:1;min-width:130px;width:auto;font-size:.82rem;padding:12px}
select{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.review-list .card{padding:12px 14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

دْ بَيَّنَّا ٱلْءَايَٰتِ لِقَوْمٍ يُوقِنُونَ","src":"ai"},{"id":"q496","ar":"حِكْمَة","en":"wisdom","pos":"noun","root":"حكم","rank":496,"cov":86.3,"ref":"2:129","ayah":"رَبَّنَا وَٱبْعَثْ فِيهِمْ رَسُولًا مِّنْهُمْ يَتْلُوا۟ عَلَيْهِمْ ءَايَٰتِكَ وَيُعَلِّمُهُمُ ٱلْكِتَٰبَ وَٱلْحِكْمَةَ وَيُزَكِّيهِمْ إِنَّكَ أَنتَ ٱلْعَزِيزُ ٱلْحَكِيمُ","src":"ai"},{"id":"q497","ar":"صابِر","en":"patient one","pos":"noun","root":"صبر","rank":497,"cov":86.3,"ref":"2:153","ayah":"يَٰٓأَيُّهَا ٱلَّذِينَ ءَامَنُوا۟ ٱسْتَعِينُوا۟ بِٱلصَّبْرِ وَٱلصَّلَوٰةِ إِنَّ ٱللَّهَ مَعَ ٱلصَّٰبِرِينَ","src":"ai"},{"id":"q498","ar":"بَلَوْ","en":"to test","pos":"verb","root":"بلو","rank":498,"cov":86.3,"ref":"2:155","ayah":"وَلَنَبْلُوَنَّكُم بِشَىْءٍۢ مِّنَ ٱلْخَوْفِ وَٱلْجُوعِ وَنَقْصٍۢ مِّنَ ٱلْأَمْوَٰلِ وَٱلْأَنفُسِ وَٱلثَّمَرَٰتِ ۗ وَبَشِّرِ ٱلصَّٰبِرِينَ","src":"deck"},{"id":"q499","ar":"أَحَلَّ","en":"to make lawful","pos":"verb","root":"حلل","rank":499,"cov":86.3,"ref":"2:187","ayah":"أُحِلَّ لَكُمْ لَيْلَةَ ٱلصِّيَامِ ٱلرَّفَثُ إِلَىٰ نِسَآئِكُمْ ۚ هُنَّ لِبَاسٌۭ لَّكُمْ وَأَنتُمْ لِبَاسٌۭ لَّهُنَّ ۗ عَلِمَ ٱللَّهُ أَنَّكُمْ كُنتُمْ تَخْتَانُونَ أَنفُسَكُمْ فَتَابَ عَلَيْكُمْ وَعَفَا عَنكُمْ ۖ فَٱلْـَٰٔنَ بَٰشِرُوهُنَّ وَٱبْتَغُوا۟ مَا كَتَبَ ٱللَّهُ لَكُمْ ۚ وَكُلُوا۟ وَٱشْرَبُوا۟ حَتَّىٰ يَتَبَيَّنَ لَكُمُ ٱلْخَيْطُ ٱلْأَبْيَضُ مِنَ ٱلْخَيْطِ ٱلْأَسْوَدِ مِنَ ٱلْفَجْرِ ۖ ثُم","src":"deck"},{"id":"q500","ar":"أَمِنَ","en":"he felt safe","pos":"verb","root":"أمن","rank":500,"cov":86.4,"ref":"2:196","ayah":"وَأَتِمُّوا۟ ٱلْحَجَّ وَٱلْعُمْرَةَ لِلَّهِ فَإِنْ أُحْصِرْتُمْ فَمَا ٱسْتَيْسَرَ مِنَ ٱلْهَدْىِ وَلَا تَحْلِقُوا۟ رُءُوسَكُمْ حَتَّىٰ يَبْلُغَ ٱلْهَدْىُ مَحِلَّهُۥ فَمَن كَانَ مِنكُم مَّرِيضًا أَوْ بِهِۦٓ أَذًى مِّن رَّأْسِهِۦ فَفِدْيَةٌ مِّن صِيَامٍ أَوْ صَدَقَةٍ أَوْ نُسُكٍ فَإِذَآ أَمِنتُمْ فَمَن تَمَتَّعَ بِٱلْعُمْرَةِ إِلَى ٱلْحَجِّ فَمَا ٱسْتَيْسَرَ مِنَ ٱلْهَدْىِ فَمَن لَّمْ يَجِدْ فَصِيَ","src":"ai"}],"nur":[{"title":"Water and wells","cards":[{"id":"n1","q":"How many types of water are valid for purification?","a":"There are seven types."},{"id":"n2","q":"What are the seven types of water valid for purification?","a":"Rainwater, seawater, river water, well water, melted snow water, melted hail water, and spring water."},{"id":"n3","q":"How many categories is water divided into?","a":"Five categories."},{"id":"n4","q":"What is the first category of water?","a":"Pure and purifying, not disliked (absolute water)."},{"id":"n5","q":"What is the second category of water?","a":"Pure and purifying, yet disliked (water from which a cat or similar animal has drunk, provided the quantity is small)."},{"id":"n6","q":"What is the third category of water?","a":"Pure but not purifying (water used for removing ritual impurity or an act of worship)."},{"id":"n7","q":"When is water considered \"used\"?","a":"The moment it separates from the body."},{"id":"n8","q":"What are the two types of water with which it is not permitted to perform wuḍū’?","a":"Water extracted from trees or fruit and water whose natural properties have been altered by boiling or being overpowered by a mixture."},{"id":"n9","q":"What is the ruling regarding water extracted from trees or fruit, even if it exudes naturally?","a":"It is not permitted to perform wuḍū’ with it, according to the most prominent opinion."},{"id":"n10","q":"What is the ruling regarding water whose natural properties have been altered by boiling?","a":"It is not permitted to perform wuḍū’ with it."},{"id":"n11","q":"What is the ruling regarding water whose natural properties have been overpowered by another substance mixed into it?","a":"It is not permitted to perform wuḍū’ with it."},{"id":"n12","q":"When does a solid substance \"overpower\" water, making it invalid for wuḍū’?","a":"When the substance removes the water’s thinness and fluidity."},{"id":"n13","q":"Does the alteration of all characteristics (color, taste, smell) by a solid substance (e.g., saffron) invalidate water?","a":"No, it does not invalidate it."},{"id":"n14","q":"How is \"overpowering\" determined when mixing water with a liquid that has two characteristics (like milk)?","a":"It is considered overpowering if one of those characteristics appears in the water."},{"id":"n15","q":"How is \"overpowering\" determined when mixing water with a liquid that has three characteristics (like vinegar)?","a":"It is considered overpowering if two of those characteristics appear in the water."},{"id":"n16","q":"How is \"overpowering\" determined for liquids that possess no distinct characteristics?","a":"It is determined by weight."},{"id":"n17","q":"What is the rule for mixing used water with absolute water based on weight?","a":"If the volume of used water is greater than the absolute water, it is invalid; if the absolute water is greater, it is valid."},{"id":"n18","q":"When does impurity (najis) make stagnant water invalid?","a":"When any amount of impurity falls into it (when it is in a small quantity)."},{"id":"n19","q":"When does impurity (najis) make flowing water invalid?","a":"When the effect of the impurity (color, taste, or smell) is apparent in the water."},{"id":"n20","q":"How is a \"small quantity\" of water defined?","a":"Less than ten by ten cubits."},{"id":"n21","q":"What is the rule for small quantities of water when a pollutant falls into it?","a":"It becomes impure even if the effect of the impurity is not apparent."},{"id":"n22","q":"What is considered water of \"questionable purity\" (the fifth category)?","a":"Water from which a donkey or a mule has drunk."},{"id":"n23","q":"Which animals produce \"Pure and Purifying\" leftover water (su'r)?","a":"A human, a horse, or any animal whose meat is permissible to eat."},{"id":"n24","q":"Which animals produce \"Impure and Forbidden\" leftover water (su'r)?","a":"A dog, a pig, or any beast of prey (such as a cheetah or a wolf)."},{"id":"n25","q":"Which animals produce \"Disliked\" (Makruh) leftover water (su'r)?","a":"A cat, a free-roaming chicken, birds of prey (such as a falcon, hawk, or kite), or a mouse."},{"id":"n26","q":"When is the leftover water of a cat or bird of prey considered disliked?","a":"Only if other water is available."},{"id":"n27","q":"Does the \"disliked\" rule for leftover water apply to a scorpion?","a":"No."},{"id":"n28","q":"What should one do if they only have water from which a donkey or mule has drunk?","a":"Perform wuḍū’ with it, then perform tayammum, then pray."},{"id":"n29","q":"What should one do if pure vessels are mixed with impure ones and the majority are pure?","a":"Exercise personal discretion (taḥarri) to select a vessel for both wuḍū’ and drinking."},{"id":"n30","q":"What should one do if pure vessels are mixed with impure ones and the majority are impure?","a":"Exercise personal discretion (taḥarri) only for the purpose of drinking."},{"id":"n31","q":"What is the rule regarding exercising discretion (taḥarri) with mixed garments?","a":"One should always exercise discretion, regardless of whether the majority of the garments are pure or impure."},{"id":"n32","q":"What is the mandatory action for a small well if an impurity like a drop of blood or wine falls into it?","a":"The entire contents of the well must be extracted."},{"id":"n33","q":"If a pig falls into a small well and is removed alive without its mouth touching the water, is the well purified?","a":"No, the entire contents of the well must still be extracted."},{"id":"n34","q":"What is the ruling if a dog, sheep, or human dies in a small well?","a":"The entire contents of the well must be extracted."},{"id":"n35","q":"What is the rule if an animal decays or bloats inside a small well?","a":"The entire contents of the well must be extracted."},{"id":"n36","q":"What is the estimated volume of a well if its specific volume of extraction is unknown?","a":"200 buckets."},{"id":"n37","q":"How many buckets must be extracted if a chicken or cat dies in a well?","a":"40 buckets."},{"id":"n38","q":"How many buckets must be extracted if a mouse or similar animal dies in a well?","a":"20 buckets."},{"id":"n39","q":"What items are purified by the act of extracting the water from a well?","a":"The well itself, the bucket, the rope, and the hands of the person extracting the water."},{"id":"n40","q":"Do animal droppings, manure, or cow dung invalidate a well?","a":"Generally, no."},{"id":"n41","q":"Under what exceptions do animal droppings/manure invalidate a well?","a":"If the observer finds it repulsive, or if every bucket extracted contains droppings."},{"id":"n42","q":"Does the presence of pigeon or sparrow droppings corrupt water?","a":"No."},{"id":"n43","q":"Does the death of aquatic animals with no flowing blood (e.g., fish, frogs, mosquitoes) corrupt water?","a":"No."},{"id":"n44","q":"What is the rule if a human or an animal whose meat is permissible to eat falls into water?","a":"It does not corrupt the water, provided they are removed alive and there was no impurity on their body."},{"id":"n45","q":"What is the status of water if a mule, donkey, bird of prey, or wild animal falls into it, according to the authentic (ṣaḥīḥ) opinion?","a":"It is not corrupted."},{"id":"n46","q":"What is the rule regarding the saliva of an animal that has fallen into water?","a":"The water takes on the legal ruling of that animal."},{"id":"n47","q":"How far back is a well considered impure if a dead animal is found inside?","a":"For the preceding 24 hours (a day and a night)."},{"id":"n48","q":"How far back is a well considered impure if a dead, bloated animal is found inside?","a":"For the preceding three days and nights (if the exact time of the fall is unknown)."}]},{"title":"Istinja and relieving oneself","cards":[{"id":"n49","q":"What is required of a man regarding istibrā’ before beginning wuḍū’?","a":"He must ensure all traces of urine have ceased and his heart is at ease (using methods like walking or clearing his throat) until he is certain no further seepage is occurring."},{"id":"n50","q":"When is performing istinjā’ (cleaning the private parts) considered Sunnah?","a":"When the impurity has not spread beyond the point of exit."},{"id":"n51","q":"What is the ruling if the impurity spreads beyond the exit up to the size of a dirham?","a":"It is mandatory (wājib) to remove it with water."},{"id":"n52","q":"What is the ruling if the impurity spreads beyond the exit and exceeds the size of a dirham?","a":"It is obligatory (farḍ) to remove it."},{"id":"n53","q":"What is the requirement for cleaning the area of the passage during ghusl?","a":"It is obligatory (farḍ) to wash the area, even if the amount of impurity is minimal."},{"id":"n54","q":"What is the Sunnah regarding the method of istinjā’?","a":"To cleanse with a stone or similar absorbent object."},{"id":"n55","q":"Which is more preferred (aḥabb) for istinjā’, water or a stone?","a":"Water."},{"id":"n56","q":"What is the most excellent practice for istinjā’?","a":"To combine both water and a stone: wipe first, then wash."},{"id":"n57","q":"Is it permissible to use only water or only a stone for istinjā’?","a":"Yes, both are permissible."},{"id":"n58","q":"What is the Sunnah requirement for istinjā’?","a":"The cleansing of the site (attaining purity)."},{"id":"n59","q":"Is using a specific number of stones a confirmed Sunnah or encouraged (mandūb)?","a":"It is encouraged (mandūb)."},{"id":"n60","q":"How many stones should one use if cleanliness is achieved?","a":"Three stones, even if cleanliness could have been achieved with fewer."},{"id":"n61","q":"What is the method for using three stones for men in istinjā’?","a":"1st: front to back; 2nd: back to front; 3rd: front to back (if testicles hang) or back to front (if they do not)."},{"id":"n62","q":"What is the method for women in istinjā’ using stones?","a":"Start from the front and move to the back to prevent soiling."},{"id":"n63","q":"How should one clean with water using fingers?","a":"Wash the hand first, then rub the site using the pads of one, two, or three fingers as needed."},{"id":"n64","q":"What is the recommended finger usage for men when cleaning with water?","a":"Start with the middle finger, then the ring finger. Do not rely on only one finger."},{"id":"n65","q":"What is the recommended finger usage for women when cleaning with water?","a":"Start by using the ring finger and the middle finger together to avoid stimulation."},{"id":"n66","q":"What should one strive for when cleaning the site in istinjā’?","a":"Thorough cleaning until the unpleasant odor is removed."},{"id":"n67","q":"Is it encouraged to relax the gluteal muscles during cleaning?","a":"Yes, provided one is not fasting."},{"id":"n68","q":"What should one do after finishing istinjā’ with water?","a":"Wash the hand a second time and dry the area before standing up."},{"id":"n69","q":"Why is it particularly recommended to dry the area before standing up?","a":"Especially if one is fasting."},{"id":"n70","q":"Is it permitted to expose the ‘awrah for the purpose of istinjā’?","a":"No, it is not permitted."},{"id":"n71","q":"When does the presence of impurity make the prayer invalid?","a":"If it extends beyond the exit and exceeds the size of a dirham, and the person has the means to remove it but fails to do so."},{"id":"n72","q":"What should one do regarding istinjā’ if others are present?","a":"One should devise a method to remove the impurity without exposing the ‘awrah."},{"id":"n73","q":"What are some examples of items that are disliked (makrūh) to use for istinjā’?","a":"Bones, food items, unfired bricks (ājūr), pottery shards, charcoal, glass, plaster/gypsum, and honored items (like silk or cotton)."},{"id":"n74","q":"Is it permitted to use the right hand for istinjā’?","a":"It is disliked (makrūh) to use the right hand unless there is an excuse."},{"id":"n75","q":"With which foot should one enter the restroom?","a":"The left foot."},{"id":"n76","q":"What should one say before entering the restroom?","a":"Seek refuge in Allah from the accursed Satan (A‘ūdhu billāhi mina-sh-shayṭāni-r-rajīm)."},{"id":"n77","q":"How should one sit while relieving oneself?","a":"While leaning on the left side."},{"id":"n78","q":"Is speaking allowed while relieving oneself?","a":"It is disliked; do not speak unless necessary."},{"id":"n79","q":"What is the ruling on facing or turning one’s back toward the Qiblah while relieving oneself?","a":"It is strictly disliked (makrūh taḥrīman), even if within a building."},{"id":"n80","q":"What celestial or environmental directions are disliked to face while relieving oneself?","a":"The sun, the moon, or the direction of the wind."},{"id":"n81","q":"List three places where it is disliked to urinate or defecate.","a":"In water, in a shaded area used by people, in a hole, on a public path, or under a fruit-bearing tree."},{"id":"n82","q":"What is the ruling on urinating while standing?","a":"It is disliked, unless there is a valid excuse."},{"id":"n83","q":"With which foot should one exit the restroom?","a":"The right foot."},{"id":"n84","q":"What should one say upon exiting the restroom?","a":"\"Al-ḥamdu lillāhi-lladhī adhhaba ‘annī-l-adhā wa ‘āfānī\" (Praise be to Allah, who has removed from me harm and granted me health)."},{"id":"n85","q":"How many obligatory elements (farā’iḍ) are there in wuḍū’?","a":"Four."},{"id":"n86","q":"What is the vertical boundary for washing the face?","a":"From the top of the forehead to the bottom of the chin."},{"id":"n87","q":"What is the horizontal boundary for washing the face?","a":"The area between the earlobes."},{"id":"n88","q":"Which parts must be included when washing the hands and arms?","a":"Including the elbows."},{"id":"n89","q":"Which parts must be included when washing the feet?","a":"Including the ankles."},{"id":"n90","q":"What is the requirement for the head in wuḍū’?","a":"Wiping a quarter of the head."},{"id":"n91","q":"What is the worldly ruling (reason) for performing wuḍū’?","a":"To render permissible acts that are otherwise prohibited (e.g., prayer)."}]},{"title":"Wudu","cards":[{"id":"n92","q":"What is the afterlife ruling for performing wuḍū’?","a":"The attainment of reward in the Hereafter."},{"id":"n93","q":"List the conditions for the obligation (wujūb) of wuḍū’.","a":"Sanity, puberty, Islam, ability to use sufficient water, presence of ritual impurity (ḥadath), absence of menstruation or post-partum bleeding, and the arrival of the prayer time (ḍīq al-waqt)."},{"id":"n94","q":"What are the conditions for the validity (ṣiḥḥah) of wuḍū’?","a":"Ensuring water reaches the entire skin surface with pure water, absence of factors that invalidate it (e.g., menstruation), and removal of anything preventing water from reaching the skin (e.g., wax or grease)."},{"id":"n95","q":"Is it mandatory to wash the outer surface of a thick beard during wuḍū’?","a":"Yes, according to the most authentic legal opinion."},{"id":"n96","q":"Is it mandatory for water to reach the skin beneath a sparse beard?","a":"Yes."},{"id":"n97","q":"Is it mandatory to wash hair that hangs down beyond the circular perimeter of the face?","a":"No."},{"id":"n98","q":"Is it mandatory to wash the parts of the lips that remain hidden when the mouth is closed?","a":"No."},{"id":"n99","q":"What is the ruling if fingers are tightly pressed together, or if long nails cover the fingertip, or if there is dried dough blocking the water?","a":"It is mandatory to wash the skin beneath these areas."},{"id":"n100","q":"Do substances like accumulated dirt (grime) or flea droppings invalidate wuḍū’?","a":"No, they do not prevent its validity."},{"id":"n101","q":"What is the ruling on a tight ring during wuḍū’?","a":"It is mandatory to move it to allow water to reach the skin beneath it."},{"id":"n102","q":"What should one do if washing cracked skin on the feet causes harm?","a":"It is permissible to pour water over the medicine applied to those cracks."},{"id":"n103","q":"Is it necessary to repeat the washing or wiping of an area if one trims their nails or mustache after performing wuḍū’?","a":"No."},{"id":"n104","q":"How many Sunnah practices are there in wuḍū’?","a":"Eighteen."},{"id":"n105","q":"What are the first three Sunnah practices of wuḍū’?","a":"Washing the hands up to the wrists, saying the Basmalah, and using the siwāk (or a finger if unavailable)."},{"id":"n106","q":"What are the Sunnah practices regarding the mouth and nose?","a":"Rinsing the mouth three times and sniffing water into the nose three times."},{"id":"n107","q":"When is \"thoroughness\" (mubālaghah) in rinsing the mouth and nose recommended?","a":"It is recommended for those who are not fasting."},{"id":"n108","q":"What is the Sunnah practice regarding a thick beard?","a":"Running water through it with a palmful of water from underneath."},{"id":"n109","q":"What is meant by \"takhīl al-aṣābi‘\"?","a":"Interlacing the fingers."},{"id":"n110","q":"What is the recommended number of times to wash each part?","a":"Three times."},{"id":"n111","q":"What are the Sunnah practices regarding the head and ears?","a":"Wiping the entire head once and wiping the ears."},{"id":"n112","q":"What is meant by \"al-walā’\" in the context of wuḍū’?","a":"Performing the steps in quick succession (continuity)."},{"id":"n113","q":"What is the Sunnah practice regarding the neck?","a":"Wiping the back of the neck (but not the throat)."},{"id":"n114","q":"Which parts of the body should be prioritized in terms of sequence according to the Sunnah?","a":"Starting with the right side, the tips of the fingers/toes, and the front of the head."},{"id":"n115","q":"What are the eighteen Sunnah practices of wuḍū’?","a":"There\nare eighteen recommended practices (Sunan) in wuḍū’:\n\nWashing the hands up to the wrists.\n\nSaying the Basmalah (Bismillāh) at the beginning.\n\nUsing the siwāk (miswak) at the beginning; if\n\tunavailable, using a finger suffices.\n\nRinsing the mouth (maḍmaḍah) three times, even\n\twith a single handful of water.\n\nSniffing water into the nose (istinshāq) using three\n\thandfuls.\n\n& 7. Thoroughness (mubālaghah) in rinsing the\n\tmouth and nose (for those not fasting).\n\nRunning water through a thick beard with a palmful of water\n\tfrom underneath.\n\nInterlacing the fingers (takhīl al-aṣābi‘).\n\nWashing each part three times.\n\nWiping the entire head once.\n\nWiping the ears, even if using the leftover moisture from the\n\thead.\n\nRubbing (dalk) the limbs during washing.\n\nContinuity (al-walā’—performing the steps in\n\tquick succession).\n\nHaving the intention (niyyah).\n\nAdhering to the sequence prescribed by Allah in His Book.\n\nStarting with the right side, the tips of the fingers/toes,\n\tand the front of the head.\n\nWiping the back of the neck (not the throat). Note: Some\n\tscholars maintain that the last four are merely desirable\n\t(mustaḥabb)."},{"id":"n116","q":"What are the fourteen etiquettes of wuḍū’?","a":"There\nare fourteen manners of wuḍū’:\n\nSitting in an elevated place.\n\nFacing the Qiblah.\n\nNot seeking the assistance of others.\n\nRefraining from worldly speech.\n\nCombining the intention of the heart with the utterance of\n\tthe tongue.\n\nReciting the traditional supplications (du‘ā’).\n\nSaying the Basmalah before washing each limb.\n\nInserting the little finger into the ear canal.\n\nMoving a loose ring.\n\nRinsing the mouth and nose with the right hand and blowing\n\tthe nose with the left.\n\nPerforming wuḍū’ before the prayer time enters\n\t(for those who do not have an excuse).\n\nReciting the Shahadatayn (the two testimonies of\n\tfaith) afterward.\n\nDrinking from the remaining water of the wuḍū’\n\twhile standing.\n\nSaying: \"Allāhummaj‘alnī minat-tawwābīna\n\twaj‘alnī minal-mutaṭahhirīn\" (O Allah, make me among\n\tthe repentant and make me among those who are purified)."},{"id":"n117","q":"How many acts are considered disliked (makrūhāt) while performing wuḍū’?","a":"Six."},{"id":"n118","q":"What is the ruling regarding the amount of water used in wuḍū’?","a":"Both excessiveness (isrāf) and using too little (taqtīr) are disliked."},{"id":"n119","q":"Is it permissible to strike the face with water during wuḍū’?","a":"No, it is disliked."},{"id":"n120","q":"Is engaging in worldly speech during wuḍū’ allowed?","a":"It is disliked."},{"id":"n121","q":"What is the ruling on seeking the assistance of others for performing wuḍū’?","a":"It is disliked unless there is a valid excuse."},{"id":"n122","q":"What is the specific dislike regarding wiping the head?","a":"Wiping the head three times using fresh (new) water for each wipe."},{"id":"n123","q":"When is it Fard to do Wudu?","a":"Obligatory (Farḍ): Necessary for the\nritually impure (muḥdath) to perform:\n\nPrayer, even if it is a supererogatory (nafl) prayer.\n\nThe funeral prayer (Janāzah).\n\nThe prostration of recitation (Sajdat al-Tilāwah).\n\nTouching the Qur’an, even if it is only one verse."},{"id":"n124","q":"When is it Wajib to do Wudu?","a":"Performing Tawāf around the Ka'bah."},{"id":"n125","q":"When is it Mandub to do Wudu?","a":"Before sleeping while in a state of purity, and upon waking.\n\nMaintaining a constant state of purity.\n\nPerforming wuḍū’ over an existing wuḍū’\n\t(renewing it).\n\nAfter backbiting.\n\nAfter telling a lie.\n\nAfter gossiping/tale-bearing (namīmah).\n\nAfter every sin.\n\nBefore reciting poetry.\n\nAfter laughing out loud (qahqahah) outside of prayer.\n\nAfter washing a deceased person.\n\nAfter carrying a deceased person.\n\nAt the time of every prayer.\n\nBefore performing ghusl for janābah.\n\nFor a person in a state of janābah before eating,\n\tdrinking, sleeping, or intimacy.\n\nWhen angry.\n\nBefore reciting the Qur’an.\n\nBefore narrating Hadith.\n\nBefore studying religious knowledge.\n\nBefore the Adhan.\n\nBefore the Iqamah.\n\nBefore delivering a sermon (khuṭbah).\n\nBefore visiting the Prophet (peace be upon him).\n\nWhile standing on the plains of Arafah.\n\nBefore Sa’i between Safa and Marwah.\n\nAfter eating camel meat.\n\nTo exit a disagreement among scholars (such as after touching\n\ta woman)."},{"id":"n126","q":"What are the 12 things that invalidate Wudu?","a":"Wuḍū’\nis invalidated by twelve things:\n\nAnything discharged from the two passages (sabilayn),\n\texcluding wind from the vagina (in the most authentic opinion).\n\nFlowing impurity from other than the two passages, such as\n\tblood or pus.\n\nChildbirth, even if no blood is seen.\n\nVomiting food, water, coagulated blood, or bile, provided it\n\tfills the mouth—defined as an amount that cannot be contained\n\twithout effort, according to the most authentic opinion. Scattered\n\tinstances of vomiting are aggregated if the cause is the same.\n\nBlood that dominates or equals the amount of saliva.\n\nSleep during which the buttocks are not firmly seated on the\n\tground.\n\nThe lifting of the buttocks of a sleeping person before they\n\twake up, even if they do not physically fall.\n\nFainting.\n\nInsanity.\n\nIntoxication.\n\nA loud laugh (qahqahah) by an adult who is awake\n\tduring a prayer that includes bowing (rukū’) and\n\tprostration (sujūd), even if they intentionally exit the\n\tprayer by doing so.\n\nTouching one’s private part with an erect penis without a\n\tbarrier."},{"id":"n127","q":"How many things invalidate wuḍū’?","a":"Twelve."},{"id":"n128","q":"Does wind discharged from the vagina invalidate wuḍū’?","a":"No, according to the most authentic opinion."},{"id":"n129","q":"What is the rule regarding flowing impurity from areas other than the two passages?","a":"It invalidates wuḍū’ (e.g., blood or pus)."},{"id":"n130","q":"Does childbirth invalidate wuḍū’?","a":"Yes, even if no blood is seen."},{"id":"n131","q":"How is vomiting defined as an invalidator of wuḍū’?","a":"It must fill the mouth (an amount that cannot be contained without effort)."},{"id":"n132","q":"When are scattered instances of vomiting aggregated?","a":"If the cause of the vomiting is the same."},{"id":"n133","q":"What is the rule regarding blood and saliva?","a":"It invalidates wuḍū’ if the blood dominates or equals the amount of saliva."},{"id":"n134","q":"Does sleep invalidate wuḍū’?","a":"Only if the buttocks are not firmly seated on the ground."},{"id":"n135","q":"What is the ruling if a sleeping person’s buttocks are lifted?","a":"It invalidates wuḍū’, even if they do not physically fall."},{"id":"n136","q":"What mental states/conditions invalidate wuḍū’?","a":"Fainting, insanity, and intoxication."},{"id":"n137","q":"When does a loud laugh (qahqahah) invalidate wuḍū’?","a":"If done by an awake adult during a prayer that contains bowing and prostration."},{"id":"n138","q":"Does touching one's private parts invalidate wuḍū’?","a":"Yes, if it is done with an erect penis and without a barrier."},{"id":"n139","q":"How many things are listed as not invalidating wuḍū’?","a":"Ten."},{"id":"n140","q":"Does the appearance of blood that does not flow invalidate wuḍū’?","a":"No."},{"id":"n141","q":"If a piece of flesh falls off without blood flowing (like a Guinea worm), is wuḍū’ invalidated?","a":"No."},{"id":"n142","q":"Does a worm exiting from a wound, ear, or nose invalidate wuḍū’?","a":"No."},{"id":"n143","q":"Does touching one's penis invalidate wuḍū’?","a":"Only if it meets the conditions (erect, without a barrier); otherwise, no."},{"id":"n144","q":"Does touching a woman invalidate wuḍū’?","a":"No."},{"id":"n145","q":"Does vomiting invalidate wuḍū’ if it does not fill the mouth?","a":"No."},{"id":"n146","q":"What is the ruling on vomiting phlegm?","a":"It does not invalidate wuḍū’, even in large quantities."},{"id":"n147","q":"If a person sways while asleep and it is only possible their buttocks lost contact with the floor, is wuḍū’ invalidated?","a":"No."},{"id":"n148","q":"If a person sleeps while seated firmly, even if leaning against something, does it invalidate wuḍū’?","a":"No."},{"id":"n149","q":"Does sleeping while in the rukū’ or sujūd of prayer invalidate wuḍū’?","a":"No."},{"id":"n150","q":"How many circumstances render ghusl (major ablution) obligatory (farḍ)?","a":"Seven."},{"id":"n151","q":"What is the requirement for the discharge of semen to make ghusl obligatory?","a":"It must separate from its origin due to desire, even if it happens without sexual intercourse."}]},{"title":"Ghusl","cards":[{"id":"n152","q":"What act of intercourse besides the discharge of semen makes ghusl obligatory?","a":"Insertion of the glans (or an equivalent portion) into either of the two passages of a living human."},{"id":"n153","q":"What is the ruling regarding ejaculation of semen from intercourse with a deceased person or an animal?","a":"Ghusl becomes obligatory."},{"id":"n154","q":"If one wakes up and finds thin, wet fluid, when is ghusl obligatory?","a":"It is obligatory if one's penis was not erect before falling asleep."},{"id":"n155","q":"Does finding suspected semen after waking from intoxication or fainting require ghusl?","a":"Yes."},{"id":"n156","q":"What is the ruling on ghusl for menstruation or post-partum bleeding occurring before embracing Islam?","a":"According to the most authentic opinion, ghusl is obligatory."},{"id":"n157","q":"What is the ruling regarding the ghusl of a deceased person?","a":"It is a communal obligation (farḍ kifāyah)."},{"id":"n158","q":"How many things are listed as not necessitating ghusl?","a":"Ten."},{"id":"n159","q":"Does the discharge of madhī (pre-seminal fluid) require ghusl?","a":"No."},{"id":"n160","q":"Does the discharge of wadī require ghusl?","a":"No."},{"id":"n161","q":"If a person has a nocturnal emission (iḥtilām) but finds no wetness upon waking, is ghusl required?","a":"No."},{"id":"n162","q":"Is ghusl required for childbirth if no blood is seen?","a":"No (according to the ṣaḥīḥ opinion)."},{"id":"n163","q":"What is the rule on intercourse involving a barrier?","a":"If the barrier prevents the sensation of pleasure, ghusl is not required."},{"id":"n164","q":"Does receiving an enema require ghusl?","a":"No."},{"id":"n165","q":"Does inserting a finger or object into the two passages require ghusl?","a":"No."},{"id":"n166","q":"Does intercourse with a deceased person or animal require ghusl?","a":"Only if there is ejaculation; without it, it is not required."},{"id":"n167","q":"Is ghusl required if one has contact with a virgin without removing her virginity and without ejaculation?","a":"No."},{"id":"n168","q":"How many obligatory (farḍ) elements are there in Ghusl?","a":"Eleven."},{"id":"n169","q":"Which two facial openings must be washed for Ghusl?","a":"The mouth and the nose."},{"id":"n170","q":"What is the general requirement for the body?","a":"Washing the entire body once."},{"id":"n171","q":"What is the requirement regarding the foreskin?","a":"Washing the inside, provided it can be retracted without difficulty."},{"id":"n172","q":"Which specific body part must be washed in addition to the general skin surface?","a":"The navel."},{"id":"n173","q":"What is the rule regarding skin piercings?","a":"Any non-closed skin piercings must be washed."},{"id":"n174","q":"What is the distinction regarding braided hair between men and women?","a":"Men must wash the inside of braided hair in all cases; women are not required to if water reaches the roots."},{"id":"n175","q":"Which facial hair areas must be washed to ensure water reaches the skin beneath?","a":"The beard, the mustache, and the eyebrows."},{"id":"n176","q":"Is washing the external genitalia obligatory?","a":"Yes."},{"id":"n177","q":"How many recommended practices (Sunan) are there in Ghusl?","a":"Twelve."},{"id":"n178","q":"What are the initial steps one should take before beginning the washing of the body?","a":"Starting with the Basmalah, making the intention (niyyah), washing the hands up to the wrists, removing any impurity on the body, and washing the private parts."},{"id":"n179","q":"What is the recommendation regarding wuḍū’ during Ghusl?","a":"Perform wuḍū’ as one does for prayer, including the triple washing and head wiping."},{"id":"n180","q":"What should one do if standing in a place where water collects?","a":"Delay the washing of the feet."},{"id":"n181","q":"What is the Sunnah practice for pouring water over the body?","a":"Pour water over the body three times (or submerge oneself in running water)."},{"id":"n182","q":"What is the recommended order for washing the body with water?","a":"Start by pouring water on the head, then the right shoulder, followed by the left."},{"id":"n183","q":"What is meant by dalk?","a":"Rubbing the body."},{"id":"n184","q":"What is the recommendation regarding the timing of the washing process?","a":"Maintaining continuity (muwālāh)."},{"id":"n185","q":"How does the etiquette (ādāb) of ghusl relate to that of wuḍū’?","a":"It is identical, with specific distinctions."},{"id":"n186","q":"What is a specific distinction regarding etiquette in ghusl?","a":"One should not face the Qiblah, as ghusl is usually performed while exposing the ‘awrah."},{"id":"n187","q":"What is the ruling on acts disliked in wuḍū’ when performing ghusl?","a":"They are also disliked in ghusl."},{"id":"n188","q":"For how many occasions is performing ghusl a Sunnah?","a":"Four."},{"id":"n189","q":"What are the four occasions when ghusl is Sunnah?","a":"The Friday prayer, the two Eid prayers, entering the state of Iḥrām, and standing at Arafah for a pilgrim after midday (zawāl)."},{"id":"n190","q":"How many situations are listed where performing ghusl is encouraged (mandūb)?","a":"Sixteen."},{"id":"n191","q":"Is ghusl recommended for someone who embraces Islam even if they are already in a state of ritual purity?","a":"Yes."},{"id":"n192","q":"What are the recommended times for ghusl regarding recovery or growth?","a":"Upon reaching the age of puberty (without nocturnal emission) and upon recovering from insanity or unconsciousness."},{"id":"n193","q":"What medical-related practice makes ghusl encouraged?","a":"After undergoing cupping (ḥijāmah)."},{"id":"n194","q":"What specific occasions related to a deceased person or holy nights make ghusl encouraged?","a":"After washing a deceased person, on the Night of Emancipation (Laylat al-Barā’ah), and on the Night of Decree (Laylat al-Qadr)."},{"id":"n195","q":"What locations or pilgrimage rituals are associated with recommended ghusl?","a":"Before entering Medina, for the standing at Muzdalifah, and upon entering Mecca for the Tawaf al-Ziyārah."},{"id":"n196","q":"Is ghusl recommended specifically before performing the Tawaf al-Ziyārah?","a":"Yes."},{"id":"n197","q":"Which prayer services are listed as occasions for ghusl?","a":"The solar eclipse prayer (Ṣalāt al-Kusūf) and the rain prayer (Ṣalāt al-Istisqā’)."},{"id":"n198","q":"Which environmental or emotional conditions make ghusl encouraged?","a":"Times of extreme fear/panic, unusual or terrifying darkness, and during a severe storm or fierce wind."},{"id":"n199","q":"How many conditions are there for the validity of tayammum?","a":"Eight."}]},{"title":"Tayammum","cards":[{"id":"n200","q":"What is the reality of the intention (niyyah)?","a":"The firm resolve of the heart to perform the act."},{"id":"n201","q":"When must the intention for tayammum be made?","a":"At the exact moment of striking the hands onto the substance used for tayammum."},{"id":"n202","q":"What are the three requirements for the validity of the intention?","a":"Islam, discernment (tamyīz), and conscious knowledge of what is being intended."},{"id":"n203","q":"What are the three specific intents required to make prayer permissible via tayammum?","a":"The intention of purification, the intention of making prayer permissible, or the intention of an independent act of worship that requires purification."},{"id":"n204","q":"Can one pray if they only intended the act of tayammum itself?","a":"No."},{"id":"n205","q":"Can one pray if they intended tayammum only for reciting the Qur'an while not in a state of janābah?","a":"No."},{"id":"n206","q":"What is the minimum distance from water that permits tayammum?","a":"Being at least one mile away."},{"id":"n207","q":"Does being in a city prevent one from using tayammum if water is a mile away?","a":"No, it is still permitted."},{"id":"n208","q":"What are some environmental or logistical excuses for tayammum?","a":"Severe cold (with fear of death/illness), fear of an enemy, thirst (preserving water for drinking), or lack of an instrument to draw water."},{"id":"n209","q":"Is the need for water for cooking broth a valid excuse for tayammum?","a":"No, but it is permitted if the water is needed to knead dough."},{"id":"n210","q":"Does the fear of missing the Friday prayer allow for tayammum?","a":"No."},{"id":"n211","q":"Does the fear of missing the Funeral or Eid prayer allow for tayammum?","a":"Yes, even if one is a follower."},{"id":"n212","q":"What are the requirements for the substance used for tayammum?","a":"It must be a pure substance from the earth's natural composition (e.g., soil, stone, or sand)."},{"id":"n213","q":"Is tayammum valid using gold, silver, or wood?","a":"No."},{"id":"n214","q":"What is required regarding the coverage of the limbs during tayammum?","a":"Comprehensive coverage; the entire surface area must be wiped."},{"id":"n215","q":"Can tayammum be performed by wiping with only two fingers?","a":"No, it is invalid; the whole hand or the majority of it must be used."},{"id":"n216","q":"How many strikes are required for tayammum?","a":"Two distinct strikes with the palms of the hands."},{"id":"n217","q":"Can dust falling naturally on the body be used for tayammum?","a":"Yes, provided it is wiped over the skin with the correct intention."},{"id":"n218","q":"What is the requirement regarding the cessation of invalidating factors?","a":"Any contradiction to purity, such as menstruation, post-partum bleeding, or active janābah, must have ceased."},{"id":"n219","q":"What must be removed from the skin before performing tayammum?","a":"Anything that prevents physical contact with the skin, such as wax or grease."},{"id":"n220","q":"What are the Pillars (Arkān) of tayammum?","a":"Wiping the face and wiping the hands (up to the elbows)."},{"id":"n221","q":"How many Sunnah practices are there in tayammum?","a":"Seven."},{"id":"n222","q":"What is the recommended sequence for tayammum?","a":"The face, then the arms."},{"id":"n223","q":"Which Sunnah action involves the movement of the hands on the dust?","a":"Moving the hands forward after placing them on the dust and moving them backward."},{"id":"n224","q":"What is recommended regarding the fingers during the strike?","a":"Keeping the fingers spread apart."},{"id":"n225","q":"What are the 7 Sunnahs of Tayammum","a":"There\nare seven Sunnah practices in tayammum:\n\nSaying the Basmalah at the beginning.\n\nFollowing the proper sequence (face, then arms).\n\nMaintaining continuity (muwālāh).\n\nMoving the hands forward after placing them on the dust.\n\nMoving them backward.\n\nShaking the dust off the hands.\n\nKeeping the fingers spread apart during the strike."},{"id":"n226","q":"When is it recommended (mandūb) to delay tayammum?","a":"For someone who has a reasonable hope of finding water before the prayer time expires."},{"id":"n227","q":"When is it mandatory (wājib) to delay the prayer due to the prospect of water?","a":"If one is explicitly promised water, even if there is a fear of having to perform it as a qaḍā’ (missed) prayer."},{"id":"n228","q":"Under what conditions must one delay prayer if waiting for a garment or water skin?","a":"Provided one does not fear missing the prayer time entirely."},{"id":"n229","q":"How far is it mandatory to search for water if its proximity is suspected and safety is assured?","a":"Up to four hundred paces."},{"id":"n230","q":"Is it required to search for water if safety is not assured?","a":"No."},{"id":"n231","q":"When is it mandatory to request water from companions while traveling?","a":"When traveling in a context where people are not typically stingy or possessive."},{"id":"n232","q":"If a companion offers water at market value, what is the obligation?","a":"It is mandatory to buy it, provided the money is surplus to essential travel expenses."},{"id":"n233","q":"How many prayers can one perform with a single tayammum?","a":"As many obligatory (farā’iḍ) and supererogatory (nawāfil) prayers as they wish."},{"id":"n234","q":"Is it valid to perform tayammum before the prayer time enters?","a":"Yes."},{"id":"n235","q":"If the majority or exactly half of the body is wounded, what is the ruling?","a":"The person performs tayammum."},{"id":"n236","q":"If the majority of the body is healthy, what is the procedure?","a":"Wash the healthy parts and wipe (masḥ) over the wounded parts."},{"id":"n237","q":"Should one combine both full washing (ghusl) and tayammum for the same purification?","a":"No."},{"id":"n238","q":"What are the two primary invalidators of tayammum?","a":"Anything that invalidates wuḍū’ and gaining the ability to use a sufficient quantity of water."}]},{"title":"Wiping over socks and splints; menstruation","cards":[{"id":"n239","q":"What is the ruling for an individual who is a double amputee (hands and feet) and also has wounds covering their face?","a":"They shall pray without ritual purification, and they are not required to repeat the prayer later."},{"id":"n240","q":"Is it valid to wipe over leather socks (khuffayn) in the state of minor ritual impurity (ḥadath aṣghar)?","a":"Yes."},{"id":"n241","q":"Does this ruling apply to both men and women? (i.e. wiping over leather socks)","a":"Yes."},{"id":"n242","q":"Is it valid to wipe over socks made of non-leather, thick material?","a":"Yes, even if they do not have leather soles."},{"id":"n243","q":"What are the 7 conditions for the validity of wiping socks?","a":"Seven\nconditions are required for the validity of wiping over socks:\n\nWearing them after having washed the feet completely (it is\n\tsufficient if the feet were washed before completing the rest of the\n\twuḍū’, provided it is completed before an invalidator\n\toccurs).\n\nThe socks must cover the ankles.\n\nIt must be possible to walk in them continuously. (Wiping is\n\tnot valid on socks made of glass, wood, or iron).\n\nEach sock must be free of holes that exceed the size of three\n\tsmall toes.\n\nThey must remain on the feet without the need for\n\ttying/binding.\n\nThey must be thick enough to prevent water from reaching the\n\tskin.\n\nThe front of the foot must remain, specifically a length\n\tequal to three small fingers; if one lacks the front part of the\n\tfoot, they cannot wipe over the sock, even if the heel remains."},{"id":"n244","q":"How long is the duration for wiping over socks for a resident?","a":"A day and a night (24 hours)."},{"id":"n245","q":"How long is the duration for wiping over socks for a traveler?","a":"Three days and nights (72 hours)."},{"id":"n246","q":"When does the duration of the wiping period begin?","a":"From the moment an invalidator of wuḍū’ occurs after putting on the socks."},{"id":"n247","q":"What happens if a resident starts wiping and then travels before their 24-hour period expires?","a":"They complete the traveler's duration (three days and nights)."},{"id":"n248","q":"If a traveler returns to residency and has already wiped for a full day and night, what must they do?","a":"They must remove them; otherwise, they complete the full duration."},{"id":"n249","q":"What is the obligatory amount of surface area to be wiped on each foot?","a":"A surface area equal to three small fingers on the top of the front part of the foot."},{"id":"n250","q":"What is the Sunnah method for wiping the socks?","a":"Spread the fingers apart and wipe from the toes toward the shin."},{"id":"n251","q":"What are the four things that invalidate the wiping (masḥ) over socks?","a":"Anything that invalidates wuḍū’, removing the sock (or the majority of the foot exiting into the leg-part), water reaching the majority of one of the feet inside the sock, and the expiration of the time period."},{"id":"n252","q":"In the case where wiping is invalidated by removing the sock, water entering, or time expiration, what is required?","a":"One only needs to wash their feet."},{"id":"n253","q":"Is it valid to wipe over a turban, cap, or face veil?","a":"No."},{"id":"n254","q":"Is it valid to wipe over gloves?","a":"No."},{"id":"n255","q":"What is the requirement when a person has a bandage/splint on a wound or break?","a":"If unable to wash the limb or wipe the skin directly, it is mandatory to wipe over the majority of the binding."},{"id":"n256","q":"Is there a time limit for wiping over a splint?","a":"No."},{"id":"n257","q":"Does one need to be in a state of ritual purity when applying a splint?","a":"No, it is not required."},{"id":"n258","q":"Can one wipe the splint on one foot and wash the other?","a":"Yes, it is permissible."},{"id":"n259","q":"What is the status of the wipe if the splint falls off before the injury heals?","a":"The wiping remains valid; replacing the splint is permitted, and while not mandatory, re-wiping is preferred."},{"id":"n260","q":"What is the ruling if an eye infection or a covered broken nail makes even wiping harmful?","a":"One may omit the wiping entirely."},{"id":"n261","q":"Is intention (niyyah) required for wiping over socks, splints, or the head?","a":"No."},{"id":"n262","q":"What is the definition of menstruation (Ḥayḍ)?","a":"Blood discharged by the womb of a mature female, not due to illness or pregnancy, and before reaching menopause."},{"id":"n263","q":"What are the duration limits for menstruation (Ḥayḍ)?","a":"Minimum: 3 days; Average: 5 days; Maximum: 10 days."},{"id":"n264","q":"What is the maximum duration for post-partum bleeding (Nifās)?","a":"40 days."},{"id":"n265","q":"What is the minimum duration for post-partum bleeding (Nifās)?","a":"There is no minimum limit."},{"id":"n266","q":"How is chronic irregular bleeding (Istināḍah) defined?","a":"Blood that is less than 3 days, or exceeds 10 days (for menstruation) or 40 days (for post-partum)."},{"id":"n267","q":"What is the minimum period of purity (Ṭuhr) between two menstrual cycles?","a":"15 days."},{"id":"n268","q":"Is there a maximum limit for the period of purity (Ṭuhr)?","a":"No."},{"id":"n269","q":"How many acts are forbidden during menstruation and post-partum?","a":"Eight."},{"id":"n270","q":"What are the eight forbidden acts during Ḥayḍ and Nifās?","a":"Prayer, fasting, reciting a verse of the Qur’an, touching the Qur’an (unless encased), entering a mosque, Tawāf, sexual intercourse, and enjoying the area between the navel and the knees."},{"id":"n271","q":"When is intercourse permitted after the blood stops at the maximum duration?","a":"It is permitted immediately without ghusl."},{"id":"n272","q":"If the blood stops before the maximum duration, when does intercourse become permitted?","a":"When she performs ghusl, performs tayammum and prays, or if the time for a prayer passes while she had enough time to perform ghusl and the opening takbir but failed to do so."},{"id":"n273","q":"Do women have to make up missed fasts due to menstruation or post-partum bleeding?","a":"Yes."},{"id":"n274","q":"Do women have to make up missed prayers due to menstruation or post-partum bleeding?","a":"No."},{"id":"n275","q":"How many things are forbidden during janābah (major ritual impurity)?","a":"Five (Prayer, reciting a verse of the Qur’an, touching the Qur’an, entering a mosque, and Tawāf)."},{"id":"n276","q":"How many things are forbidden during minor ritual impurity (ḥadath)?","a":"Three (Prayer, Tawāf, and touching the Muṣḥaf)."},{"id":"n277","q":"Does the blood of istiḥāḍah (chronic irregular bleeding) prevent prayer, fasting, or intercourse?","a":"No."},{"id":"n278","q":"What must a person with a chronic excuse (like istiḥāḍah or incontinence) do for each prayer time?","a":"Perform wuḍū’ for the time of every obligatory prayer."},{"id":"n279","q":"How long does wuḍū’ last for someone with a chronic excuse?","a":"It is valid for the duration of the prayer time and is invalidated only by the expiration of that time."},{"id":"n280","q":"How is a person officially considered \"excused\" (ma‘dhūr)?","a":"When the condition persists for an entire prayer time without interruption long enough to perform wuḍū’ and prayer."},{"id":"n281","q":"How is the continuity of an excuse maintained?","a":"If the condition occurs at least once in every subsequent prayer time."},{"id":"n282","q":"When does the status of being \"excused\" terminate?","a":"Once an entire prayer time passes without the occurrence of the condition."}]},{"title":"Impurities and how to remove them","cards":[{"id":"n283","q":"What are the two categories of impurities (najāsah)?","a":"Heavy (Ghalīẓah) and Light (Khafīfah)."},{"id":"n284","q":"List five examples of heavy impurities (Ghalīẓah).","a":"Wine, flowing blood, meat of a carcass (maytah), its skin/hide, and urine of animals whose meat is not eaten."},{"id":"n285","q":"Are dog excrement and the dung of beasts of prey considered heavy or light?","a":"Heavy."},{"id":"n286","q":"How are the droppings of chickens, ducks, and geese classified?","a":"As heavy impurities."},{"id":"n287","q":"What is the status of anything that invalidates wuḍū’ upon exiting the human body?","a":"It is a heavy impurity."},{"id":"n288","q":"List the three examples of light impurities (Khafīfah) provided.","a":"Urine of a horse, urine of animals whose meat is eaten, and droppings of birds whose meat is not eaten."},{"id":"n289","q":"How much of a heavy impurity is pardoned?","a":"Up to the size of a dirham."},{"id":"n290","q":"How much of a light impurity is pardoned?","a":"An amount less than a quarter of the garment or body."},{"id":"n291","q":"Are fine splashes of urine (like needle tips) pardoned?","a":"Yes."},{"id":"n292","q":"If a mattress becomes damp from the sweat of a sleeper, when does it become impure?","a":"Only if the effect of the impurity (color, smell, or taste) appears on the body."},{"id":"n293","q":"Does a clean, dry garment become impure when wrapped in a wet, impure one?","a":"Not if the wet garment does not squeeze out moisture."},{"id":"n294","q":"Does a wet garment become impure by spreading it on dry, impure ground?","a":"No, even if it becomes slightly damp."},{"id":"n295","q":"What is the ruling if wind blows an impurity onto a garment?","a":"It does not become impure unless its effect (color, smell, or taste) appears on the garment."},{"id":"n296","q":"How is a visible impurity purified?","a":"By removing the substance itself; even a single wash is sufficient, and remaining traces that are difficult to remove are pardoned."},{"id":"n297","q":"How is an invisible impurity purified?","a":"By washing three times, squeezing the garment each time."},{"id":"n298","q":"Can liquids other than water be used for purification?","a":"Yes, any substance that removes the impurity, such as vinegar or rosewater, is valid."},{"id":"n299","q":"How are leather socks purified of solid impurities?","a":"By rubbing (dalk), even if the impurity was wet."},{"id":"n300","q":"How are smooth objects like swords purified?","a":"By wiping."},{"id":"n301","q":"When is ground that was once impure considered purified for prayer?","a":"Once the effect of the impurity is removed and the ground dries."},{"id":"n302","q":"Does the purification of ground for prayer make it valid for tayammum?","a":"No, it is not valid for tayammum."},{"id":"n303","q":"How is vegetation or grass on impure ground purified?","a":"By drying."},{"id":"n304","q":"What is Istihālah (transformation) in the context of purification?","a":"The purification of an impurity when its nature changes, such as becoming salt or being burned by fire."},{"id":"n305","q":"How is semen purified?","a":"If dry, by scraping it off; if liquid, by washing it."},{"id":"n306","q":"How can the hide of a carcass be purified?","a":"By true tanning (using astringents like qaraẓ) or by functional tanning (using earth and sunlight)."},{"id":"n307","q":"Which types of skin are excluded from purification by tanning?","a":"Pig skin and human skin."},{"id":"n308","q":"Does ritual slaughter (dhakāh) purify the hide of non-edible animals?","a":"Yes, according to the most authentic legal opinion (though the meat remains impure)."},{"id":"n309","q":"Do animals without flowing blood become impure upon death?","a":"No."},{"id":"n310","q":"What are examples of parts from animals without flowing blood that are considered pure?","a":"Shorn hair, feathers, horns, hooves, and bones (provided they are not greasy)."},{"id":"n311","q":"What is the ruling on the purity of nerves?","a":"They are considered impure according to the ṣaḥīḥ opinion."},{"id":"n312","q":"Are the musk pod and musk itself pure?","a":"Yes, and the animal is permissible to eat."},{"id":"n313","q":"Is it valid to pray while wearing civet?","a":"Yes, as it is pure."},{"id":"n314","q":"What are the three conditions for the obligation of prayer?","a":"Islam, puberty, and sanity."},{"id":"n315","q":"At what age should children be ordered to pray?","a":"Age seven."},{"id":"n316","q":"How should children be disciplined for failing to pray by age ten?","a":"Using the hand, not a stick."}]},{"title":"Prayer times","cards":[{"id":"n317","q":"What is the cause of the obligation of prayer?","a":"The arrival of its time."},{"id":"n318","q":"Does the obligation of prayer have a fixed instant or a flexible window?","a":"It has a \"spacious\" (flexible) window of obligation at the beginning of its time."},{"id":"n319","q":"What is the time for Fajr?","a":"From the true dawn until just before sunrise."},{"id":"n320","q":"When does the time for Zuhr begin and end?","a":"It begins at the sun's meridian passage (zawāl) and ends when an object’s shadow is twice its length (or equal to it, excluding the shadow at meridian)."},{"id":"n321","q":"What is the time for ‘Asr?","a":"From the end of Zuhr time until sunset."},{"id":"n322","q":"What is the time for Maghrib?","a":"From sunset until the disappearance of the red twilight."},{"id":"n323","q":"When does the time for ‘Isha and Witr begin and end?","a":"From the end of Maghrib until dawn."},{"id":"n324","q":"Can Witr be performed before ‘Isha?","a":"No, due to the required sequence."},{"id":"n325","q":"Is Witr obligatory for one who does not have enough time to perform both ‘Isha and Witr?","a":"No."},{"id":"n326","q":"In what two situations is it permitted to combine two obligatory prayers?","a":"At Arafah for the pilgrim, and at Muzdalifah (Maghrib and ‘Isha) by the order of the leader."},{"id":"n327","q":"Is it valid to combine Maghrib and ‘Isha on the road to Muzdalifah?","a":"No."},{"id":"n328","q":"What is the recommended time for Fajr for men?","a":"Isfār (waiting for the sky to brighten)."},{"id":"n329","q":"What is the recommended time for Zuhr during summer?","a":"Ibrād (delaying until the heat lessens)."},{"id":"n330","q":"What is the recommended approach for Zuhr during winter?","a":"Performing it early (unless it is cloudy, then delay)."},{"id":"n331","q":"What is the recommended time for ‘Asr?","a":"Delaying as long as the sun does not change its color; performing it early if it is cloudy."},{"id":"n332","q":"When should Maghrib be performed?","a":"Early, unless it is cloudy, then delay."},{"id":"n333","q":"When is the recommended time for ‘Isha?","a":"Delaying until the first third of the night; performing it early if it is cloudy."},{"id":"n334","q":"For whom is it recommended to delay Witr until the end of the night?","a":"For those confident they will wake up."},{"id":"n335","q":"What are the three times when obligatory (farḍ) or mandatory (wājib) prayers that were already obligatory are forbidden?","a":"At sunrise until the sun rises high; when the sun is at its meridian (zenith) until it passes; and when the sun turns yellow (near sunset) until it sets."},{"id":"n336","q":"Is it valid to perform a funeral prayer that arrives during the prohibited times?","a":"Yes, but it is performed with dislike (karāhah)."},{"id":"n337","q":"What is the ruling on the prostration of recitation (Sajdat al-Tilāwah) for a verse recited during prohibited times?","a":"It is valid to perform it, albeit with dislike."},{"id":"n338","q":"Is today’s ‘Asr prayer valid if performed at sunset?","a":"Yes, though it is disliked."},{"id":"n339","q":"What is the ruling on performing nafl (supererogatory) prayers during the three prohibited times?","a":"They are disliked to the degree of taḥrīm (prohibition), even if they have a specific reason (like a vow or the two units after Tawāf)."},{"id":"n340","q":"Is it disliked to perform nafl prayer after the Fajr prayer?","a":"Yes."},{"id":"n341","q":"What is the ruling on nafl prayer after the ‘Asr prayer?","a":"It is disliked."},{"id":"n342","q":"Can one perform nafl prayer when the Iqāmah is called?","a":"No, it is disliked, except for the Sunnah of Fajr."},{"id":"n343","q":"Is it disliked to pray nafl when the Imam exits to deliver the Friday sermon?","a":"Yes, until he finishes the prayer."},{"id":"n344","q":"What is the ruling on nafl prayers before and after the Eid prayer?","a":"It is disliked before the Eid prayer (anywhere) and after the Eid prayer (in the mosque)."},{"id":"n345","q":"Is it disliked to perform nafl prayer between the two combined prayers at Arafah and Muzdalifah?","a":"Yes."},{"id":"n346","q":"Name three physical or mental states that make performing nafl prayer disliked.","a":"Suppressing the urge to urinate or defecate, when desired food is served, or when anything occupies the mind and disrupts concentration (khushū‘)."}]},{"title":"Adhan and iqamah","cards":[{"id":"n347","q":"Is nafl prayer allowed when the time for an obligatory prayer is very tight?","a":"It is disliked."},{"id":"n348","q":"What is the ruling for the Adhan and Iqāmah?","a":"They are strongly emphasized Sunnah (Sunnah Mu’akkadah) for men for obligatory prayers."},{"id":"n349","q":"Are Adhan and Iqāmah recommended for women?","a":"No, they are disliked for women."},{"id":"n350","q":"What are the basic requirements for the format of the Adhan?","a":"Begin with four Takbīrs, end with two Takbīrs, and recite each phrase twice."},{"id":"n351","q":"Is tarjī‘ (repeating testimonies softly) used in the Adhan?","a":"No."},{"id":"n352","q":"What special phrase is added to the Fajr Adhan?","a":"\"Aṣ-ṣalātu khayrun mina-n-nawm\" (Prayer is better than sleep), recited twice after \"Ḥayya ‘ala-l-falāḥ.\""},{"id":"n353","q":"What phrase is added to the Iqāmah?","a":"\"Qad qāmati-ṣ-ṣalāh\" (Prayer has begun), recited twice after \"Ḥayya ‘ala-l-falāḥ.\""},{"id":"n354","q":"What is the difference in pacing between the Adhan and the Iqāmah?","a":"One should pause during the Adhan and perform the Iqāmah rapidly."},{"id":"n355","q":"Is the Adhan valid if recited in a language other than Arabic (e.g., Persian)?","a":"No, according to the most prominent opinion."},{"id":"n356","q":"What are the recommended personal qualities for a Mu’adhdhin?","a":"He should be righteous, knowledgeable of the Sunnah, and knowledgeable of prayer times."},{"id":"n357","q":"What physical actions should the Mu’adhdhin perform while calling the Adhan?","a":"Be in a state of wuḍū’, face the Qiblah (unless riding), place fingers in his ears, and turn his face right for Ḥayya ‘ala-ṣ-ṣalāh and left for Ḥayya ‘ala-l-falāḥ."},{"id":"n358","q":"What should a Mu’adhdhin do if calling the Adhan from a minaret?","a":"He should turn around while calling it."},{"id":"n359","q":"Is there a required interval between the Adhan and Iqāmah?","a":"Yes, he should pause to allow the congregation to arrive."},{"id":"n360","q":"What is the recommended pause during the Maghrib Adhan?","a":"A duration equivalent to reciting three short verses or taking three steps."},{"id":"n361","q":"What is the tathwīb (reminder) for Fajr, and what is its phrasing?","a":"It is an additional call: \"Aṣ-ṣalāh, aṣ-ṣalāh, yā muṣallīn!\" (Prayer, prayer, O worshippers!)."},{"id":"n362","q":"What are some of the actions or characteristics disliked for a Mu’adhdhin or in the Adhan/Iqāmah?","a":"Singing/musical chanting (talḥīn), being in a state of impurity (ḥadath or janābah), being a child who lacks discernment, an insane or intoxicated person, a woman, a corrupt person (fāsiq), being seated, or speaking during the call."},{"id":"n363","q":"Is it recommended to repeat the Adhan?","a":"Yes, it is recommended to repeat the Adhan, but not the Iqāmah."},{"id":"n364","q":"What is the ruling on calling the Adhan for Zuhr on Friday in a city?","a":"Both the Adhan and Iqāmah are disliked."},{"id":"n365","q":"How should one handle Adhan and Iqāmah for missed prayers (fawā’it)?","a":"Both are performed for the missed prayer."},{"id":"n366","q":"If multiple prayers are missed in one sitting, how are the Adhan and Iqāmah performed?","a":"Perform both for the first prayer. For subsequent prayers in that same sitting, it is disliked to leave out the Iqāmah."},{"id":"n367","q":"What should one do when hearing the Adhan?","a":"Stop talking and repeat what is said."},{"id":"n368","q":"What should one say during the Ḥay‘alah (Ḥayya ‘ala-ṣ-ṣalāh/falāḥ)?","a":"\"Lā ḥawla wa lā quwwata illā billāh\" (There is no power nor strength except by Allah)."},{"id":"n369","q":"What should one say when hearing the Fajr reminder (tathwīb)?","a":"\"Ṣadaqta wa bararta\" (You have spoken the truth and acted righteously) or \"Mā shā’allāh\" (As Allah wills)."}]},{"title":"Conditions and pillars of prayer","cards":[{"id":"n370","q":"What is the prayer (du‘a) recited after the Adhan?","a":"\"Allāhumma Rabba hādhihi-d-da‘wati-t-tāmmah, wa-ṣ-ṣalāti-l-qā’imah, āti Sayyidanā Muḥammadan al-wasīlata wa-l-faḍīlah, wa-b‘athu maqāman maḥmūdan alladhī wa‘attahu.\""},{"id":"n371","q":"What are the 27 conditions for the validity of prayer?","a":"There are twenty-seven conditions for the validity of prayer:\n\nPurity: From ritual impurity (ḥadath).\n\nPurity of Body.\n\nPurity of Clothing.\n\nPurity of Place: From non-pardoned impurity,\n\tspecifically at the spots where the feet, hands, knees, and forehead\n\trest (according to the most authentic opinion).\n\nCovering the ‘Awrah: It is not\n\tinvalidated if visible from a pocket or lower hem.\n\nFacing the Qiblah: For one in\n\tMecca who can see the Ka'bah, it is mandatory to face its exact\n\tspot. For those who cannot see it, facing its direction is\n\tsufficient.\n\nTime: The prayer time must have arrived.\n\nKnowledge of Time: Having the conviction that the time\n\thas entered.\n\nIntention (Niyyah).\n\nOpening Takbīr (Taḥrīmah):\n\tMust be performed without delay, while standing before bowing for\n\trukū’, with the intention coinciding with the Takbīr,\n\tand audibly enough for oneself to hear.\n\nIntention of Following: If praying behind an Imam.\n\nSpecifying the Obligatory Prayer.\n\nSpecifying the Mandatory (Wājib)\n\tPrayer: (Not required for Nafl).\n\nStanding (Qiyām): In prayers\n\tother than Nafl.\n\nRecitation (Qirā’ah): At least\n\tone verse in the two cycles of an obligatory prayer, and in every\n\tcycle of Nafl and Witr. No specific part of the Qur’an\n\tis mandatory. The follower does not recite, but listens attentively;\n\tit is makrūh taḥrīman if they do.\n\nBowing (Rukū’).\n\nProstration (Sujūd): Placing the\n\tforehead on a solid surface; if on the palm or sleeve, the surface\n\tmust be clean.\n\nForehead & Nose: Prostrating on the forehead is\n\tmandatory; the nose is mandatory as well—one cannot rely solely on\n\tthe nose unless there is an excuse.\n\nLeveling: The place of prostration should not be\n\thigher than the place of the feet by more than half a cubit.\n\nPhysical Placement: Placing both hands, both knees,\n\tand at least some of the toes of both feet on the ground. Placing\n\tonly the top of the feet is insufficient.\n\nSequence: Performing rukū’ before sujūd.\n\nRising: Sitting briefly between prostrations.\n\nReturn to Prostration.\n\nFinal Sitting: For the duration of the Tashahhud.\n\nOrder: Ensuring the final sitting occurs after all\n\tother pillars.\n\nConsciousness: Being awake.\n\nKnowledge: Knowing the prayer’s structure,\n\tdistinguishing between obligatory and Sunnah acts, and believing the\n\tobligatory acts are indeed obligatory."},{"id":"n372","q":"Regarding the purity of the place, where specifically must one be free of non-pardoned impurity?","a":"At the spots where the feet, hands, knees, and forehead rest."},{"id":"n373","q":"What is the rule for covering the ‘awrah?","a":"It is not invalidated if visible from a pocket or lower hem."},{"id":"n374","q":"How does the requirement for facing the Qiblah differ for those in Mecca vs. those outside?","a":"Those in Mecca who can see the Ka'bah must face its exact spot; others only need to face its direction."},{"id":"n375","q":"What are the four requirements for the Opening Takbīr (Taḥrīmah)?","a":"No delay, standing before bowing, intention coinciding with the Takbīr, and audibly enough to hear oneself."},{"id":"n376","q":"What is the ruling for a follower reciting behind an Imam?","a":"The follower does not recite but listens attentively; it is makrūh taḥrīman to recite."},{"id":"n377","q":"What is required when prostrating on a surface like a palm or sleeve?","a":"The surface must be clean."},{"id":"n378","q":"What is the ruling regarding the nose during sujūd?","a":"Prostrating on the forehead is mandatory, and the nose is also mandatory (one cannot rely solely on the nose unless there is an excuse)."},{"id":"n379","q":"What is the limit for the elevation difference between the place of prostration and the feet?","a":"It should not be higher by more than half a cubit."},{"id":"n380","q":"Is it sufficient to place only the top of the feet on the ground during sujūd?","a":"No; at least some of the toes of both feet must be on the ground."},{"id":"n381","q":"What is the minimum duration for the final sitting?","a":"For the duration of the Tashahhud."},{"id":"n382","q":"What is meant by the condition of \"Knowledge\" for the validity of prayer?","a":"Knowing the prayer’s structure, distinguishing between obligatory and Sunnah acts, and believing the obligatory acts are indeed obligatory."},{"id":"n383","q":"What are the four main pillars (Arkān) of the prayer?","a":"Standing, Recitation, Bowing, and Prostration."},{"id":"n384","q":"Which additional act is considered a pillar by some scholars?","a":"The final sitting."},{"id":"n385","q":"How does the text categorize the conditions (Sharā’iṭ) of the prayer?","a":"As either external prerequisites for beginning the prayer or continuous conditions for validity."},{"id":"n386","q":"Is prayer valid on a mat with a clean side but a dirty bottom?","a":"Yes."},{"id":"n387","q":"Under what condition is prayer on a clean garment over a dirty lining valid?","a":"If the garment is not padded or stiff."},{"id":"n388","q":"What is the ruling on praying on the clean end of a garment if the impure end moves during prayer?","a":"It is valid according to the ṣaḥīḥ opinion."},{"id":"n389","q":"What should a person do if they have no cover for their ‘awrah?","a":"They pray as they are, but praying in impure clothing is preferred to praying naked."},{"id":"n390","q":"What is the extent of the ‘awrah for men?","a":"From the navel to the knees."},{"id":"n391","q":"What is the extent of the ‘awrah for free women?","a":"The entire body except for the face, hands, and feet."},{"id":"n392","q":"How should those physically unable to face the Qiblah (e.g., due to illness or fear) pray?","a":"They face their direction of safety."},{"id":"n393","q":"If a person is uncertain about the Qiblah and has no guide, what should they do?","a":"They exercise discretion (taḥarri)."},{"id":"n394","q":"What happens if a person realizes they are facing the
