<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ihsan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Amiri+Quran&family=Libre+Baskerville:wght@400;700&family=Inter:wght@400;500;600;700;800&family=Scheherazade+New:wght@400;700&display=swap" rel="stylesheet">
<style>
/* Plan: deep emerald + saffron gold on green-biased neutrals. One-column mobile app shell, bottom nav; years stacked like a path. */
:root{
  --bg:#F3F6F2; --surface:#FFFFFF; --ink:#14231C; --muted:#5B6B62; --line:#DCE4DE;
  --brand:#0E5A43; --brand-ink:#FFFFFF; --gold:#C8912B; --gold-soft:#F6E8C9;
  --ok:#1E8A4C; --ok-soft:#DDF3E5; --bad:#C2413A; --bad-soft:#FBE3E1; --warn:#B7791F;
  --display:"Libre Baskerville", Georgia, serif; --body:"Inter", -apple-system, system-ui, "Segoe UI", sans-serif;
  --arabic:"Scheherazade New", "Amiri", "Traditional Arabic", serif; --quran:"Amiri Quran", "Amiri", serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1612; --surface:#15221C; --ink:#E7EFEA; --muted:#93A69B; --line:#26372E;
  --brand:#3FB98A; --brand-ink:#06140E; --gold:#E2B055; --gold-soft:#3A2F17;
  --ok:#4CC27E; --ok-soft:#163A26; --bad:#EF7A72; --bad-soft:#3E1C1A; --warn:#E2B055; color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0D1612; --surface:#15221C; --ink:#E7EFEA; --muted:#93A69B; --line:#26372E;
  --brand:#3FB98A; --brand-ink:#06140E; --gold:#E2B055; --gold-soft:#3A2F17;
  --ok:#4CC27E; --ok-soft:#163A26; --bad:#EF7A72; --bad-soft:#3E1C1A; --warn:#E2B055; color-scheme:dark;}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ar{font-family:var(--arabic);direction:rtl;unicode-bidi:isolate}
#app{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
main{flex:1;padding:16px 16px 104px}
h1,h2,h3{font-family:var(--display);font-weight:400;text-wrap:balance;margin:0}
h1{font-size:1.7rem} h2{font-size:1.3rem}
.muted{color:var(--muted)} .small{font-size:.86rem}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;position:sticky;top:0;background:var(--bg);z-index:5;border-bottom:1px solid var(--line)}
.brandmark{display:flex;align-items:center;gap:10px;font-family:var(--display);font-size:1.25rem}
.brandmark svg{width:28px;height:28px}
.stats{display:flex;gap:8px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-weight:700;font-size:.88rem;font-variant-numeric:tabular-nums}
.chip svg{width:16px;height:16px}
.label{font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:800;margin:22px 0 10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.stack{display:grid;gap:12px}
.row{display:flex;gap:10px;align-items:center}
.spread{display:flex;justify-content:space-between;align-items:center;gap:10px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--brand);border-radius:99px;transition:width .4s}
.pill{display:inline-flex;align-items:center;gap:4px;font-size:.74rem;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--line);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.gold{background:var(--gold-soft);color:var(--warn)} .pill.brand{background:color-mix(in srgb,var(--brand) 14%,transparent);color:var(--brand)}
/* today */
.today{background:var(--brand);color:var(--brand-ink);border-radius:18px;padding:16px;display:grid;gap:12px}
.today .nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.today .nums div{background:rgba(255,255,255,.12);border-radius:12px;padding:8px 10px}
.today .nums b{display:block;font-size:1.4rem;font-variant-numeric:tabular-nums;line-height:1.2}
.today .nums span{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;font-weight:800;opacity:.85}
/* year cards */
.year{display:grid;gap:12px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;border-bottom-width:3px;width:100%}
.year.current{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.year.locked{opacity:.72}
.year .head{display:flex;gap:14px;align-items:center}
.yr-badge{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font-family:var(--display);font-size:1.5rem;background:var(--brand);color:var(--brand-ink);flex:none}
.year.locked .yr-badge{background:var(--line);color:var(--muted)}
.gates{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.gate{border:1px solid var(--line);border-radius:12px;padding:8px 10px;font-size:.78rem;font-weight:700;display:grid;gap:6px}
.gate .bar{height:6px}
.gate.done{border-color:var(--ok);background:var(--ok-soft)}
/* lists */
.item{display:grid;grid-template-columns:44px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:100%}
.item[disabled]{cursor:default}
.ico{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--arabic);font-size:1.35rem;color:#fff}
.item .t{font-weight:800;line-height:1.3}
.item .s{font-size:.84rem;color:var(--muted)}
.back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;padding:6px 0;color:var(--muted);font-weight:700}
.hero{border-radius:18px;padding:18px;color:#fff;background:var(--brand);margin:6px 0 4px}
.hero p{margin:6px 0 0;opacity:.92;font-size:.92rem}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;padding:6px 0}
.check i{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;margin-top:1px}
.check.on i{background:var(--ok);border-color:var(--ok);color:#fff}
.check i svg{width:14px;height:14px}
/* buttons */
.btn{width:100%;border:0;border-radius:14px;padding:14px;font-weight:800;font-size:.98rem;letter-spacing:.03em;text-transform:uppercase;background:var(--brand);color:var(--brand-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--brand) 62%,#000)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 color-mix(in srgb,var(--brand) 62%,#000)}
.btn[disabled]{background:var(--line);color:var(--muted);box-shadow:none;cursor:default;transform:none}
.btn.ghost{background:transparent;color:var(--brand);box-shadow:none;border:2px solid var(--line)}
.btn.small{width:auto;padding:9px 14px;font-size:.8rem}
.btn.gold{background:var(--gold);color:#241604;box-shadow:0 4px 0 color-mix(in srgb,var(--gold) 60%,#000)}
/* full-screen player */
.player{position:fixed;inset:0;background:var(--bg);z-index:20;display:flex;flex-direction:column}
.player-in{max-width:560px;width:100%;margin:0 auto;flex:1;display:flex;flex-direction:column;min-height:0}
.phead{display:flex;align-items:center;gap:12px;padding:14px 16px}
.x{background:none;border:0;padding:4px;color:var(--muted)} .x svg{width:24px;height:24px}
.phead .bar{flex:1;height:12px}
.phead .count{font-weight:800;font-size:.85rem;color:var(--muted);font-variant-numeric:tabular-nums}
.pbody{flex:1;overflow-y:auto;padding:8px 16px 16px}
.pfoot{padding:14px 16px 20px;border-top:1px solid var(--line);background:var(--surface)}
.pfoot.ok{background:var(--ok-soft);border-color:transparent} .pfoot.bad{background:var(--bad-soft);border-color:transparent}
.fb{margin-bottom:12px} .fb strong{display:block;font-size:1.08rem}
.pfoot.ok .fb strong{color:var(--ok)} .pfoot.bad .fb strong{color:var(--bad)}
.kicker{font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--brand);margin-bottom:8px}
.big-ar{font-family:var(--quran);direction:rtl;text-align:center;font-size:2.6rem;line-height:1.9;margin:6px 0}
.line-ar{font-family:var(--arabic);direction:rtl;text-align:right;font-size:1.45rem;line-height:1.95;margin:0 0 10px}
.ayah{font-family:var(--quran);direction:rtl;text-align:right;font-size:1.3rem;line-height:2.1;background:var(--bg);border-radius:12px;padding:10px 12px;margin:10px 0 4px}
.ref{font-size:.8rem;color:var(--muted)}
.answer{white-space:pre-line}
details{margin-top:10px} summary{cursor:pointer;color:var(--brand);font-weight:700;font-size:.9rem}
.q{font-size:1.15rem;font-weight:800;margin:0 0 16px;line-height:1.4}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-bottom-width:4px;border-radius:14px;padding:13px 15px;font-weight:600;line-height:1.4}
.opt.sel{border-color:var(--brand);background:color-mix(in srgb,var(--brand) 10%,var(--surface))}
.opt.right{border-color:var(--ok);background:var(--ok-soft)} .opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt[disabled]{cursor:default}
.grades{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.grade{border:0;border-radius:12px;padding:10px 4px;font-weight:800;font-size:.86rem;color:#fff;display:grid;gap:2px}
.grade span{font-size:.72rem;font-weight:700;opacity:.9}
.g0{background:var(--bad)} .g1{background:var(--warn)} .g2{background:var(--ok)} .g3{background:#2F6E8F}
.done-screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px;padding:24px}
.done-screen .big{font-family:var(--display);font-size:2rem}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;max-width:360px}
.tile{border:1px solid var(--line);border-radius:14px;padding:12px;background:var(--surface)}
.tile b{display:block;font-size:1.5rem;font-variant-numeric:tabular-nums}
.tile span{font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:800}
.notice{display:flex;gap:10px;align-items:flex-start;background:var(--gold-soft);border-radius:12px;padding:10px 12px;font-size:.86rem}
.notice svg{flex:none;width:20px;height:20px;margin-top:1px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:10}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:1fr 1fr;padding:6px 16px 10px}
nav.tabs button{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px;font-size:.78rem;font-weight:800;color:var(--muted)}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-current="page"]{color:var(--brand)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;padding:16px;z-index:40}
.modal .card{max-width:380px;width:100%}
.btnrow{display:flex;gap:10px;flex-wrap:wrap;margin-top:12px}
.btnrow .btn{flex:1;min-width:130px;width:auto;font-size:.82rem;padding:12px}
select{font:inherit;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink)}
.review-list .card{padding:12px 14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

.reader .fs0 .ar-read{font-size:1.15rem}.reader .fs0 .en-read{font-size:.9rem}
.reader .fs1 .ar-read{font-size:1.3rem}.reader .fs1 .en-read{font-size:.97rem}
.reader .fs2 .ar-read{font-size:1.5rem}.reader .fs2 .en-read{font-size:1.04rem}
.reader .fs3 .ar-read{font-size:1.75rem}.reader .fs3 .en-read{font-size:1.14rem}
.reader .fs4 .ar-read{font-size:2rem}.reader .fs4 .en-read{font-size:1.25rem}
.reader .fs5 .ar-read{font-size:2.35rem}.reader .fs5 .en-read{font-size:1.38rem}
.reader .ar-read{line-height:2.2!important;word-spacing:.06em}
.reader .en-read{line-height:1.7;letter-spacing:.005em}
.reader .para{border-radius:12px;padding:4px 8px;margin:0 -8px;transition:background .25s}
.reader .para.speaking{background:color-mix(in srgb,var(--gold) 16%,transparent)}
.tool.listen{color:var(--brand);border-color:color-mix(in srgb,var(--brand) 40%,var(--line))}
.tool.listen.on{background:var(--brand);color:var(--brand-ink)}
body{letter-spacing:.003em}

.tags{display:inline-flex;flex-wrap:wrap;gap:4px;margin-top:4px}.tags .pill{font-size:.68rem;padding:2px 7px}
.item.lib-link{border-style:dashed}

.reader .ar-read{font-family:var(--arabic);direction:rtl;text-align:right;font-size:1.45rem;line-height:2.15;margin:0 0 6px}
.reader .en-read{margin:0 0 16px;color:var(--ink);line-height:1.6;padding-bottom:12px;border-bottom:1px dashed var(--line)}
.reader .en-read:last-child{border-bottom:0;padding-bottom:0}
.reader .card .ar-read+.ar-read{border-top:1px dashed var(--line);padding-top:8px}

.tools{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
.tool{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:7px 12px;font:inherit;font-size:.82rem;font-weight:700;color:var(--muted)}
.tool svg{width:16px;height:16px}.tool.on{color:var(--warn);border-color:color-mix(in srgb,var(--gold) 50%,transparent)}
.tool:active{transform:scale(.96)}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.9rem;font-weight:600;z-index:60;max-width:90vw;text-align:center;animation:pop .3s ease-out}

.grades.two{grid-template-columns:1fr 1fr}
.grades.two .grade{padding:14px 8px;font-size:1.05rem}

/* calmer palette: warm cream base, green as an accent only */
:root{--bg:#FAF7F0;--line:#E9E2D3;--muted:#6B6B60;--ink:#1F2420}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141412;--surface:#1D1C19;--line:#302E29;--muted:#A19D92;--ink:#EEEBE3;--brand:#4DB58C;--brand-ink:#0B1410;--ok-soft:#1E2E24;--gold-soft:#3A2F17}}
:root[data-theme="dark"]{--bg:#141412;--surface:#1D1C19;--line:#302E29;--muted:#A19D92;--ink:#EEEBE3;--brand:#4DB58C;--brand-ink:#0B1410;--ok-soft:#1E2E24;--gold-soft:#3A2F17}
@media (prefers-color-scheme:dark){.today{box-shadow:none}.continue{box-shadow:none}}
.topbar{background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px)}
.today{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-top:4px solid var(--gold);box-shadow:0 6px 18px rgba(60,50,20,.06)}
.today .nums div{background:color-mix(in srgb,var(--gold) 9%,var(--bg))}
.today .nums b{color:var(--brand)}
.today .nums span{color:var(--muted);opacity:1}
.hero{background:color-mix(in srgb,var(--c,var(--brand)) 8%,var(--surface));color:var(--ink);border:1px solid color-mix(in srgb,var(--c,var(--brand)) 22%,transparent)}
.hero h1{color:var(--c,var(--brand))}
.hero p{color:var(--muted);opacity:1}
.hero-art{opacity:.55!important}
.yr-badge{background:color-mix(in srgb,var(--brand) 10%,var(--surface));color:var(--brand)}
.year.current .yr-badge{background:var(--brand);color:var(--brand-ink)}
.btn.gold,.today .btn{background:var(--gold);color:#2A1E05;box-shadow:0 4px 0 color-mix(in srgb,var(--gold) 60%,#000)}

.modules{display:flex;flex-direction:column;gap:10px}
details.module{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:4px 12px}
details.module>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer}
details.module>summary::-webkit-details-marker{display:none}
details.module>summary .m-txt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
details.module>summary .t{font-weight:800;font-size:1.05rem}
details.module>summary .s{font-size:.82rem;color:var(--muted)}
details.module>summary .bar{margin-top:6px}
details.module[open]>summary{border-bottom:1px solid var(--line);margin-bottom:10px}
details.module>.stack{padding-bottom:12px}
.item.soon{opacity:.75;border-style:dashed}

.continue{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:18px;margin:0 0 14px;overflow:hidden;box-shadow:0 6px 18px rgba(14,90,67,.07)}
.continue h2{margin:2px 0 0;font-size:1.25rem;max-width:62%}
.continue .c-art{position:absolute;right:10px;top:8px;opacity:.95}
.continue .btn{width:auto;padding:12px 22px}
.week{display:flex;justify-content:space-between;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:10px 12px;margin:0 0 14px}
.wd{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:.75rem;font-weight:700;color:var(--muted)}
.wd svg{filter:grayscale(1);opacity:.3}.wd.on svg{filter:none;opacity:1}
.wd.now span{color:var(--brand);text-decoration:underline;text-underline-offset:3px}
.art-ico{background:transparent!important;width:44px;height:48px;display:grid;place-items:center}
.hero{position:relative;overflow:hidden}.hero-art{position:absolute;right:-6px;bottom:-10px;opacity:.35;pointer-events:none}
.hero h1,.hero p{position:relative;max-width:78%}
ol.pts{margin:0;padding-left:1.4em}ol.pts li{margin:0 0 6px;line-height:1.5}ol.pts li::marker{color:var(--gold);font-weight:800}
.explain{margin:14px 0 120px;border-left:4px solid var(--gold);background:color-mix(in srgb,var(--gold) 9%,var(--surface));border-radius:12px;padding:12px 14px}
.burst{display:flex;gap:12px;align-items:center;text-align:left;background:color-mix(in srgb,var(--gold) 14%,var(--surface));border:1px solid color-mix(in srgb,var(--gold) 40%,transparent);border-radius:16px;padding:12px 16px;animation:pop .5s ease-out}
.burst b{display:block}.burst span{font-size:.85rem;color:var(--muted)}
@keyframes pop{0%{transform:scale(.8);opacity:0}70%{transform:scale(1.04)}100%{transform:scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){.burst{animation:none}}
input.search,textarea.search{width:100%;box-sizing:border-box;font:inherit;font-size:1rem;padding:14px 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink)}
input.search:focus,textarea.search:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px color-mix(in srgb,var(--brand) 18%,transparent)}
nav.tabs .in{grid-template-columns:repeat(4,1fr)}

.welcome{min-height:100%;display:grid;place-items:center;padding:28px 18px;background:radial-gradient(120% 60% at 50% 0%,color-mix(in srgb,var(--gold) 18%,var(--bg)),var(--bg))}
.welcome-in{max-width:440px;width:100%;text-align:center}
.w-logo{width:72px;margin:0 auto 6px}
.w-ar{font-size:2.4rem;color:var(--brand);margin:0;line-height:1.4}
.welcome h1{font-size:2.6rem;margin:0}
.w-tag{color:var(--muted);margin:6px 0 22px;font-size:1.05rem}
.w-points{display:grid;gap:10px;text-align:left;margin-bottom:20px}
.w-points div{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:2px}
.w-points span{color:var(--muted);font-size:.9rem}
.w-hadith{font-family:var(--display);font-size:1.05rem;margin:0 0 18px}
.w-hadith span{display:block;font-family:var(--body);font-size:.78rem;color:var(--muted);margin-top:4px;letter-spacing:.06em;text-transform:uppercase}
.coming{display:grid;gap:8px}
.item[disabled]{opacity:.8}
</style>

<div id="app"></div>
<script>

async function loadYear(n){ INDEX = null;
  if (DATA[n]) return DATA[n];

  for (const y of YEARS) if (y.n === n) for (const b of y.books) b.lines = d.books[b.id];

}

function schedule(st, g){
  const s = st ? { ...st } : { ivl:0, ease:2.5, reps:0, lapses:0, due:today() };
  const wasReview = s.ivl >= 1;
  if (g === 0){ if (wasReview){ s.lapses++; s.ease = Math.max(1.3, s.ease-0.2); } s.ivl = 0; }
  else if (g === 1){ if (wasReview){ s.ivl = Math.max(s.ivl+1, Math.round(s.ivl*1.2)); s.ease = Math.max(1.3, s.ease-0.15); } else s.ivl = 0; }
  else if (g === 2){ s.ivl = wasReview ? Math.max(s.ivl+1, Math.round(s.ivl*s.ease)) : 1; }
  else { s.ivl = wasReview ? Math.max(s.ivl+2, Math.round(s.ivl*s.ease*1.3)) : 3; s.ease += 0.15; }
  s.reps++; s.due = today() + s.ivl;
  return { s, wasReview };
}
const ivlLabel = (st, g) => { const n = schedule(st, g).s.ivl; return n === 0 ? "again" : n < 30 ? n + "d" : Math.round(n/30) + "mo"; };
function deckStats(deck){
  if (!deck.cards) return { total:deckSize(deck), nw:deckSize(deck), learning:0, due:0, mastered:0 };

  for (const c of deck.cards){ const st = S.cards[c.id];

  return { total:deck.cards.length, nw, learning, due, mastered };
}

}

/* ---- Jibreel-style numbered points for long English answers ---- */
function points(text){
  const t = String(text).trim();
  const bold = s => { const m = s.match(/^([^:–—]{2,40})(:|\s[–—]\s)(.+)$/); return m ? `<b>${esc(m[1])}</b>${esc(m[2])}${esc(m[3])}` : esc(s); };
  const list = (intro, items) => `${intro?`<p style="margin:0 0 10px">${esc(intro)}</p>`:""}<ol class="pts">${items.map(i=>`<li>${bold(i.replace(/^(and|or)\s+/i,"").replace(/[.;,]\s*$/,""))}</li>`).join("")}</ol>`;
  const ci = t.indexOf(":");
  if (ci > 0 && ci < 140){ const items = t.slice(ci+1).split(/;\s+|,\s+(?![^()]*\))/).map(s=>s.trim()).filter(Boolean);
    if (items.length >= 3 && items.every(i => i.length <= 110)) return list(t.slice(0, ci+1), items); }
  const semi = t.split(/;\s+/); if (semi.length >= 3) return list("", semi);
  const sent = t.match(/[^.!?]+[.!?]+(\s|$)/g);
  if (t.length > 260 && sent && sent.length >= 3) return list("", sent.map(s=>s.trim()));
  return `<p style="margin:0">${esc(t)}</p>`;
}

}

const norm = s => String(s||"").normalize("NFKD").replace(/[\u0610-\u061A\u064B-\u065F\u0670\u06D6-\u06ED\u0640]/g,"").replace(/[أإآٱ]/g,"ا").replace(/ى/g,"ي").replace(/ة/g,"ه").replace(/[\u0300-\u036f]/g,"").toLowerCase();

    for (const b of y.books.filter(b => b.type !== "text")) (b.lines||[]).forEach((l,i) => INDEX.push({ y:y.n, src:b, kind:"line", i, a:l.ar, e:l.en, n:l.note||"", k:norm(l.ar+" "+l.en+" "+(l.note||"")) }));
    for (const b of y.books.filter(b => b.type === "text" && TEXTS[b.file])) TEXTS[b.file].sections.forEach((s,i) => INDEX.push({ y:y.n, src:b, kind:"sec", i, a:(s.v||s.p).join(" "), e:s.he||s.h, k:norm(s.h+" "+(s.he||"")+" "+s.p.join(" ")+" "+(s.en||[]).join(" ")) }));

// Where reports go. Set to an email address (or leave empty to use the phone's share sheet / copy).
const REPORT_TO = "";
const isSaved = k => (S.saved||[]).includes(k);
function toggleSave(k){ S.saved = S.saved||[]; const i = S.saved.indexOf(k); if (i >= 0) S.saved.splice(i,1); else S.saved.unshift(k); save(); toast(i >= 0 ? "Removed from saved" : "Saved. Find it under Search"); }
function toast(t){ document.querySelectorAll(".toast").forEach(x => x.remove()); const el = document.createElement("div"); el.className = "toast"; el.setAttribute("role","status"); el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2200); }
function toolRow(k, know){ return `<div class="tools"><button class="tool ${isSaved(k)?"on":""}" data-save="${esc(k)}" aria-label="Save">${isSaved(k)?ICON.saved:ICON.save}<span>${isSaved(k)?"Saved":"Save"}</span></button>
  <button class="tool" data-report="${esc(k)}" aria-label="Report a problem">${ICON.flag}<span>Report</span></button>
  ${know?`<button class="tool" id="know" aria-label="I already know this">${ICON.know}<span>I know this</span></button>`:""}</div>`; }
function itemByKey(k){
  const [kind, id, i] = k.split("|");
  if (kind === "c") for (const y of YEARS) for (const d of y.decks) { const c = (d.cards||[]).find(c => c.id === id); if (c) return { kind:"card", c, src:d, y:y.n }; }
  if (kind === "t") { const b = bookById(id), T = b && TEXTS[b.file]; if (b) return { kind:"sec", src:b, y:b.year, i:+i, s:T ? T.sections[+i] : null }; }
  if (kind === "l") for (const y of YEARS) for (const b of y.books) if (b.id === id && b.lines && b.lines[+i]) return { kind:"line", l:b.lines[+i], src:b, y:y.n, i:+i };

}
const keyCard = c => `c|${c.id}`, keyLine = (b, l) => `l|${b.id}|${b.lines.indexOf(l)}`;
function reportText(r){ const it = itemByKey(r.k); const what = !it ? r.k : it.kind === "sec" ? `${it.src.title}, section ${it.i+1}${it.s?`: ${it.s.h}\n${it.s.p.slice(0,2).join("\n")}`:""}` : it.kind === "card" ? `${it.src.title}\nQ: ${it.c.f}\nA: ${it.c.b}` : `${it.src.title}, ${it.src.type==="hadith"?"hadith":"line"} ${it.i+1}\n${it.l.ar||""}\n${it.l.en||""}`;
  return `Ihsan report [${r.k}]\nProblem: ${r.why}${r.note?`\nNote: ${r.note}`:""}\n\n${what}`; }
async function sendReports(list){

  if (REPORT_TO) { location.href = `mailto:${REPORT_TO}?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`; }
  else if (navigator.share) { try { await navigator.share({ title:subject, text:body }); } catch(e){ return false; } }
  else { try { await navigator.clipboard.writeText(body); toast("Report copied. Paste it to the Ihsan team"); } catch(e){ return false; } }
  list.forEach(r => r.sent = true); save(); return true;
}

  const deckById = Object.fromEntries(decks.map(d=>[d.id,d]));

function renderStudy(){

function knowCard(c){
  if (!S.cards[c.id]){ const t = today(); S.newDone[t] = S.newDone[t]||{}; S.newDone[t][c.deck] = (S.newDone[t][c.deck]||0) + 1; }
  S.cards[c.id] = { ivl:21, ease:2.6, reps:1, lapses:0, due:today()+21, known:true };
  Q.q = Q.q.filter((x, j) => j <= Q.i || x.id !== c.id); Q.done++; Q.i++; Q.shown = false; save();

function grade(g){
  const c = Q.q[Q.i], prev = S.cards[c.id];

/* ======================= BOOK LESSON ======================= */
let B = null;
function bookQuiz(b, l){
  if (b.type === "hadith") return { prompt:null, q:"Which of these hadith did you just read?", answer:snip(l.en), options:shuffle([snip(l.en), ...distinct(b.lines.map(x=>snip(x.en)), snip(l.en), 3)]),
    explain:{ title:l.note, body:snip(l.en, 420) } };
  const ans = snip(l.en, 260);
  return { prompt:l.ar, q:"What does this line mean?", answer:ans, options:shuffle([ans, ...distinct(b.lines.map(x=>snip(x.en,260)), ans, 3)]),
    explain:{ title:"The full line", body:l.en, note:l.note && snip(l.note, 360) } };
}
function startLesson(bookId, idx){
  const b = YEARS.flatMap(y=>y.books).find(x=>x.id===bookId), lines = b.lines.slice(idx*b.per, idx*b.per+b.per);
  const quiz = shuffle(lines).slice(0, Math.min(3, lines.length)).map(l => ({ kind:"mcq", ...bookQuiz(b, l) }));
  B = { b, idx, steps:[...lines.map(l=>({kind:"read", l})), ...quiz], i:0, sel:null, answered:false, correct:0, nq:quiz.length };
  renderLesson();
}
function renderLesson(){
  const st = B.steps[B.i]; if (!st) return finishLesson();
  let body, foot;
  if (st.kind === "read"){
    const nth = B.steps.filter((x,j)=>x.kind==="read" && j<=B.i).length;
    body = `<div class="kicker">${esc(B.b.title)} · ${B.b.type==="hadith"?"hadith":"line"} ${nth}</div><div class="card">
      ${B.b.type==="hadith"
        ? `<p style="margin:0 0 10px;font-size:1.02rem">${esc(st.l.en)}</p><details><summary>Arabic text</summary><p class="line-ar" style="font-size:1.25rem;margin-top:8px">${esc(st.l.ar)}</p></details><p class="ref" style="margin-top:10px">${esc(st.l.note)}</p>`
        : `<p class="line-ar">${esc(st.l.ar)}</p><p style="margin:0">${esc(st.l.en)}</p>${st.l.note?`<details><summary>${B.b.id==="majalla"?"Explanation and example":"Commentary"}</summary><div class="small answer">${points(st.l.note)}</div></details>`:""}`}</div>`;
    body += toolRow(keyLine(B.b, st.l), false);
    foot = `<div class="pfoot"><button class="btn" id="next">Continue</button></div>`;
  } else {
    body = `<div class="kicker">Check your understanding</div>${st.prompt?`<p class="line-ar">${esc(st.prompt)}</p>`:""}<p class="q" style="font-size:1.05rem">${esc(st.q)}</p>
      <div class="opts">${st.options.map((o,i)=>{ let cls=""; if (B.answered){ if (o===st.answer) cls="right"; else if (i===B.sel) cls="wrong"; } else if (i===B.sel) cls="sel";
        return `<button class="opt ${cls}" data-o="${i}" ${B.answered?"disabled":""}>${esc(o)}</button>`; }).join("")}</div>
      ${B.answered && st.explain ? `<div class="explain"><div class="kicker" style="margin:0 0 6px">${esc(st.explain.title)}</div><p style="margin:0">${esc(st.explain.body)}</p>${st.explain.note?`<div class="small muted" style="margin-top:8px">${points(st.explain.note)}</div>`:""}</div>` : ""}`;

    else { const ok = st.options[B.sel] === st.answer; foot = `<div class="pfoot ${ok?"ok":"bad"}" role="status"><div class="fb"><strong>${ok?"Correct, masha'Allah":"Not quite"}</strong>${ok?"":`<span class="small">The highlighted answer is correct.</span>`}</div><button class="btn" id="next">Continue</button></div>`; }
  }
  $("#app").innerHTML = `<div class="player"><div class="player-in"><div class="phead"><button class="x" id="quit" aria-label="Leave lesson">${ICON.x}</button><div class="bar"><i style="width:${B.i/B.steps.length*100}%;background:${B.b.color}"></i></div></div><div class="pbody">${body}</div>${foot}</div></div>`;

/* ======================= FINAL TEST ======================= */
let T = null;
function makeTest(y){
  const qs = [], decks = y.decks.filter(d=>d.cards), perDeck = Math.floor(30 / decks.length);
  decks.forEach((d, di) => {
    const pool = d.cards.filter(c => c.b.length <= 170), n = di === decks.length-1 ? 30 - perDeck*(decks.length-1) : perDeck;
    for (const c of shuffle(pool).slice(0, n)){
      let same = pool.filter(x => x.g && x.g === c.g).map(x=>x.b), ds = distinct(same, c.b, 3); if (ds.length < 3) ds = distinct(pool.map(x=>x.b), c.b, 3);
      qs.push({ src:d.title, promptAr:c.fa && c.f.length < 60 ? c.f : null, q:c.fa && c.f.length < 60 ? "What does this mean?" : c.f, qAr:c.fa && c.f.length >= 60, answer:c.b, ansAr:!!c.ba, options:shuffle([c.b, ...ds]) });
    } });
  const lines = y.books.filter(b => b.lines).flatMap(b => b.lines.map(l => ({...l, b})));
  for (const l of shuffle(lines).slice(0, TEST_LEN - qs.length)){ const q = bookQuiz(l.b, l); qs.push({ src:l.b.title, promptAr:q.prompt, q:q.q, answer:q.answer, options:q.options }); }
  return shuffle(qs);
}
function startTest(n){ T = { n, qs:makeTest(yearOf(n)), i:0, sel:null, wrong:[], right:0 }; renderTest(); }
function renderTest(){
  const q = T.qs[T.i]; if (!q) return finishTest();
  $("#app").innerHTML = `<div class="player"><div class="player-in"><div class="phead"><button class="x" id="quit" aria-label="Leave test">${ICON.x}</button><div class="bar"><i style="width:${T.i/T.qs.length*100}%;background:var(--gold)"></i></div><span class="count">${T.i+1}/${T.qs.length}</span></div>
    <div class="pbody"><div class="kicker">Year ${T.n} final test · ${esc(q.src)}</div>
    ${q.promptAr?`<p class="line-ar" style="text-align:center;font-size:${q.promptAr.length<20?"2.2rem":"1.4rem"}">${esc(q.promptAr)}</p>`:""}
    <p class="q ${q.qAr?"ar":""}" style="${q.qAr?"text-align:right;font-size:1.3rem;line-height:1.9":""}">${esc(q.q)}</p>
    <div class="opts">${q.options.map((o,i)=>`<button class="opt ${i===T.sel?"sel":""} ${q.ansAr?"ar":""}" style="${q.ansAr?"text-align:right;font-size:1.15rem":""}" data-o="${i}">${esc(o)}</button>`).join("")}</div></div>
    <div class="pfoot"><button class="btn" id="next" ${T.sel===null?"disabled":""}>${T.i+1<T.qs.length?"Next question":"Finish test"}</button></div></div></div>`;
  document.querySelectorAll("[data-o]").forEach(x => x.onclick = () => { T.sel = +x.dataset.o; renderTest(); });
  $("#next").onclick = () => { if (q.options[T.sel] === q.answer) T.right++; else T.wrong.push({ ...q, given:q.options[T.sel] }); T.i++; T.sel = null; renderTest(); };
  $("#quit").onclick = () => confirmBox("Leave the test? This attempt won't count.", () => { const n=T.n; T = null; go({name:"year", n}); });
}
async function finishTest(){
  const score = T.right / T.qs.length, passed = score >= PASS, n = T.n;
  const rec = S.tests[n] = S.tests[n] || { attempts:0, best:0, passed:false }; rec.attempts++; rec.best = Math.max(rec.best, score);
  const firstPass = passed && !rec.passed;
  if (passed){ rec.passed = true; if (n < YEARS.length && !S.unlocked.includes(n+1)) S.unlocked.push(n+1); }
  touchDay(firstPass ? 100 : 5);
  const wrong = T.wrong; T = null;
  if (passed && n < YEARS.length) { try { await loadYear(n+1); } catch(e){} }
  $("#app").innerHTML = `<div class="player"><div class="player-in"><div class="pbody"><div class="done-screen" style="padding:24px 0 8px"><div style="width:80px">${ICON.logo}</div><div class="big">${passed ? "Passed, alhamdulillah" : "Not yet"}</div>
    <div class="tiles"><div class="tile"><b>${pct(score)}</b><span>Your score</span></div><div class="tile"><b>${PASS*100}%</b><span>Pass mark</span></div></div>
    <p class="muted" style="margin:0;max-width:340px">${passed ? (n < YEARS.length ? `Year ${n+1} is now unlocked.` : "You have completed the five years. Your specialisation year is now open: choose the module you want to study further.") : "Review the questions below, keep up your flashcards, and try again when you're ready."}</p></div>
    ${wrong.length?`<p class="label">Questions to review (${wrong.length})</p><div class="stack review-list">${wrong.map(w=>`<div class="card">${w.promptAr?`<p class="line-ar" style="font-size:1.2rem;margin:0">${esc(w.promptAr)}</p>`:""}<p style="margin:0 0 6px;font-weight:700" class="${w.qAr?"ar":""}">${esc(w.q)}</p>
      <p class="small" style="margin:0;color:var(--ok)"><b>Correct:</b> ${esc(w.answer)}</p><p class="small" style="margin:4px 0 0;color:var(--bad)"><b>You chose:</b> ${esc(w.given)}</p></div>`).join("")}</div>`:""}
    </div><div class="pfoot"><button class="btn" id="cont">Continue</button></div></div></div>`;
  $("#cont").onclick = () => go({ name:"home" });
}

/* ======================= RENDER ======================= */
function render(){
  const app = $("#app");
  if (!S.welcomed){ app.innerHTML = welcomeView(); $("#begin").onclick = () => { S.welcomed = true; save(); go({name:"year", n:1}); }; return; }
  if (view.name === "home") app.innerHTML = homeView();
  else if (view.name === "year") app.innerHTML = yearView(view.n);
  else if (view.name === "book") { const b = bookById(view.id); if (b.type === "text" && !TEXTS[b.file]) { app.innerHTML = shell(`<p class="muted">Loading ${esc(b.title)}…</p>`); loadText(b.file).then(render, () => { toast("Could not load the text. Check your connection."); go({name:"year", n:b.year}); }); return; } app.innerHTML = bookView(view.id); }
  else if (view.name === "read") return openRead(view.id, view.i);
  else if (view.name === "search") app.innerHTML = searchView();
  else if (view.name === "spec") app.innerHTML = specView();
  else if (view.name === "library") app.innerHTML = libraryView();
  else app.innerHTML = profileView();
  app.querySelectorAll("[data-go]").forEach(b => b.onclick = () => go({ name:b.dataset.go }));
  app.querySelectorAll("[data-year]").forEach(b => b.onclick = () => go({ name:"year", n:+b.dataset.year }));
  app.querySelectorAll("[data-book]").forEach(b => b.onclick = () => go({ name:"book", id:b.dataset.book }));
  app.querySelectorAll("[data-lesson]").forEach(b => b.onclick = () => { if (!b.disabled) startLesson(view.id, +b.dataset.lesson); });
  app.querySelectorAll("[data-deck]").forEach(b => b.onclick = () => startStudy([YEARS.flatMap(y=>y.decks).find(d=>d.id===b.dataset.deck)]));
  app.querySelectorAll("[data-study]").forEach(b => b.onclick = () => startStudy(activeYears().flatMap(y=>y.decks)));
  app.querySelectorAll("[data-test]").forEach(b => b.onclick = () => { if (!b.disabled) startTest(+b.dataset.test); });
  app.querySelectorAll("[data-read]").forEach(b => b.onclick = () => { const [id, i] = b.dataset.read.split("|"); openRead(id, +i); });
  app.querySelectorAll("[data-spec]").forEach(b => b.onclick = () => go({ name:"spec" }));
  app.querySelectorAll("[data-pick]").forEach(b => b.onclick = () => { if (!specOpen()) return; const m = b.dataset.pick;
    confirmBox(`Choose ${m} as your specialisation?`, () => { S.spec = m; save(); render(); }); });
  const cs = $("#changespec"); if (cs) cs.onclick = () => confirmBox("Change your specialisation? Your progress in the five years is kept.", () => { S.spec = null; save(); render(); });
  const cn = $("#continue"); if (cn) cn.onclick = () => { const nl = nextLesson(); if (nl) startLesson(nl.b.id, nl.i); };
  const la = $("#loadall"); if (la) la.onclick = async () => { la.disabled = true; la.textContent = "Loading the books…"; try { await Promise.all(LIB().map(b => loadText(b.file))); } catch(e){ toast("Some books could not load"); } INDEX = null; render(); };
  const sq = $("#sq"); if (sq){ sq.oninput = () => { view.q = sq.value; $("#sres").innerHTML = searchResults(sq.value); bindResults(); }; bindResults(); if (view.q !== undefined) { sq.focus(); sq.setSelectionRange(sq.value.length, sq.value.length); } }
  const sd = $("#sendall"); if (sd) sd.onclick = async () => { const ok = await sendReports(S.reports.filter(r=>!r.sent)); if (ok) { toast("Thank you, jazak Allahu khayran"); render(); } };
  const ag = $("#advgrades"); if (ag) ag.onchange = () => { S.advancedGrades = ag.checked; save(); };
  const npd = $("#npd"); if (npd) npd.onchange = () => { S.newPerDay = +npd.value; save(); };
  const sk = $("#skipday"); if (sk) sk.onclick = () => { S.offset++; save(); render(); };
  const ft = $("#fasttrack"); if (ft) ft.onclick = () => { const y = yearOf(Math.max(...S.unlocked));
    if (!y.prepared) return confirmBox(`Year ${y.n} has no texts yet. Mark its final test as passed? (Testing only)`, () => {
      S.tests[y.n] = { attempts:1, best:1, passed:true }; if (y.n < YEARS.length && !S.unlocked.includes(y.n+1)) S.unlocked.push(y.n+1);
      save(); loadYear(Math.min(y.n+1, YEARS.length)).then(() => go({ name:"home" })); });
    confirmBox(`Mark every Year ${y.n} lesson done and every flashcard mastered, so you can try the final test? (Testing only)`, () => {
      y.books.forEach(b => S.books[b.id] = [...Array(lessonsOf(b)).keys()]);
      y.decks.forEach(d => d.cards.forEach(c => S.cards[c.id] = { ivl:MASTER_IVL+3, ease:2.5, reps:4, lapses:0, due:today()+10 }));
      S.log = S.log.concat(Array(60).fill(1)); save(); go({ name:"year", n:y.n }); }); };
  const rs = $("#reset"); if (rs) rs.onclick = () => confirmBox("Reset all progress, XP, flashcards and test results?", () => { S = fresh(); save(); go({ name:"home" }); });
}
(async function init(){
  $("#app").innerHTML = `<div class="done-screen" style="min-height:60vh"><div style="width:64px">${ICON.logo}</div><p class="muted">Loading…</p></div>`;
  try { await Promise.all(S.unlocked.map(loadYear)); }
  catch(e){ $("#app").innerHTML = `<div class="done-screen"><p><b>Couldn't load the lessons.</b></p><p class="muted small">Check your connection and refresh the page.</p></div>`; return; }
  render();
})();

</script>
