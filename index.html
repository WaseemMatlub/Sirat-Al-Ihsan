from the Mufti?","a":"No; if the Qadi or Amīr is also a Mufti, this suffices."},{"id":"n814","q":"What is the minimum requirement for a Khutbah (sermon) to be valid?","a":"Simply saying something like Tasbīḥ or Taḥmīd, though it is disliked."},{"id":"n815","q":"Is it required to have a sitting between the two Khutbahs?","a":"Yes, delivering two sermons with a sitting between them is a Sunnah."},{"id":"n816","q":"What is the recommended length for the two Khutbahs?","a":"They should be brief, roughly the length of a long Mufaṣṣal Sūrah."},{"id":"n817","q":"Is the Adhān for the Jumu‘ah prayer considered a Sunnah of the Khutbah?","a":"Yes, it is one of the 18 Sunnahs."},{"id":"n818","q":"What is the custom regarding the Imam's stance during the Khutbah in cities conquered by force?","a":"It is a Sunnah to stand while leaning on a sword (this does not apply to cities conquered by treaty)."},{"id":"n819","q":"What are some of the actions required at the start of the Khutbah?","a":"Praising Allah, reciting the Shahādatayn, and sending blessings upon the Prophet (ﷺ)."},{"id":"n820","q":"What must the Imam do between the two Khutbahs?","a":"Repeat the praise and blessings at the start of the second sermon and offer supplication for the believers."},{"id":"n821","q":"What are the Sunnahs of the Khutbah?","a":"There\nare 18 Sunnahs, including:\n\nPurification and covering the ‘Awrah.\n\nSitting on the pulpit before starting.\n\nThe Adhān (as with the prayer).\n\nStanding while leaning on a sword (in cities conquered by\n\t\tforce; without it for those conquered by treaty).\n\nFacing the congregation.\n\nStarting with praising Allah, the Shahādatayn, and\n\t\tsending blessings on the Prophet (ﷺ).\n\nProviding advice, reminders, and reciting a Qur'anic verse.\n\nDelivering two sermons with a sitting between them.\n\nRepeating the praise and blessings at the start of the\n\t\tsecond sermon and supplicating for the believers.\n\nEnsuring the congregation hears it and keeping the two\n\t\tsermons brief (about the length of a long Mufaṣṣal\n\t\tSūrah)."},{"id":"n822","q":"When does it become mandatory to cease trade and walk to the Friday prayer?","a":"Upon the first Adhān."},{"id":"n823","q":"Once the Imam emerges for the Khutbah and prayer, what is prohibited?","a":"Praying, talking, returning greetings, and saying \"Yarhamuk-Allah\" to one who sneezes until the prayer finishes."},{"id":"n824","q":"What behaviors are disliked during the Khutbah?","a":"Eating, drinking, fidgeting, or turning around."},{"id":"n825","q":"Does the Jumu‘ah prayer fulfill the obligation of Zuhr for those who are not strictly obligated to attend (like travelers)?","a":"Yes, if they perform it, it fulfills their obligatory Zuhr prayer."},{"id":"n826","q":"Is it permitted for those obligated to perform Jumu‘ah to pray Zuhr beforehand?","a":"No, it is forbidden."},{"id":"n827","q":"What happens to the Zuhr prayer if one sets out for Jumu‘ah while the Imam is already praying?","a":"The Zuhr is invalidated, even if one fails to catch the Jumu‘ah prayer."},{"id":"n828","q":"At what point in the prayer can one still be considered to have \"caught\" Jumu‘ah?","a":"If one catches it during the Tashahhud or the prostration of forgetfulness, they complete it as a Jumu‘ah."}]},{"title":"Eid, fear, eclipse and rain prayers","cards":[{"id":"n829","q":"What is the legal ruling of the two Eid prayers according to the soundest opinion?","a":"They are Wājib for those upon whom the Friday prayer is obligatory."},{"id":"n830","q":"Is the Khutbah required for the validity of the Eid prayer?","a":"No, it is valid without it, though omitting it is sinful, as is delivering it before the prayer."},{"id":"n831","q":"What are some of the recommendations (Sunnahs) for Eid al-Fiṭr?","a":"Eating an odd number of dates, Ghusl, Miswāk, perfume, best clothes, paying Ṣadaqat al-Fiṭr, expressing joy, giving charity, waking up early, and praying Ṣubḥ in one's local mosque."},{"id":"n832","q":"What is the proper behavior while walking to the Eid prayer ground?","a":"Walk silently while reciting the Takbīr."},{"id":"n833","q":"Is it required to return from the prayer ground using the same route?","a":"No, one should return by a different route."},{"id":"n834","q":"What is the ruling on performing voluntary (Nafl) prayers before or after the Eid prayer?","a":"They are disliked before the Eid prayer (both at home and the ground) and disliked after it at the prayer ground."},{"id":"n835","q":"What is the time window for the Eid prayer?","a":"From when the sun rises to the height of a spear or two until it reaches its zenith."},{"id":"n836","q":"Describe the procedure for the first cycle of the Eid prayer.","a":"Intend the prayer, start with the Opening Takbīr, recite Thana’, perform three extra Takbīrs (raising hands for each), seek refuge, say Basmalah, recite Fātiḥah and a Sūrah, then bow."},{"id":"n837","q":"Which Sūrahs are recommended for the Eid prayer?","a":"Sabbih Isma Rabbika for the first cycle and al-Ghāshiyah for the second."},{"id":"n838","q":"Describe the procedure for the second cycle of the Eid prayer.","a":"Basmalah, Fātiḥah, a Sūrah, then perform three extra Takbīrs (raising hands)."},{"id":"n839","q":"What is the ruling if one misses the Eid prayer with the Imam?","a":"It is not made up."},{"id":"n840","q":"How does Eid al-Aḍḥā differ from Eid al-Fiṭr in practice?","a":"Delay eating until after the prayer, recite Takbīr aloud on the way, and the sermon covers laws of sacrifice and Takbīr al-Tashrīq."},{"id":"n841","q":"Can the Eid al-Aḍḥā prayer be delayed?","a":"Yes, if there is a valid excuse, it may be delayed for up to three days."},{"id":"n842","q":"What is the duration of Takbīr al-Tashrīq?","a":"From the Fajr of ‘Arafah until the ‘Aṣr of the day of Eid."},{"id":"n843","q":"Who is obligated to perform Takbīr al-Tashrīq?","a":"According to the fatwa, it is required for everyone, including those praying alone and travelers, after every obligatory prayer."},{"id":"n844","q":"How are the eclipse prayers (Kusūf and Khusūf) performed?","a":"As two cycles performed like Nafl by the Friday prayer Imam or his deputy."},{"id":"n845","q":"Are Adhān, Iqāmah, or Khutbah required for the eclipse prayer?","a":"No, they are not."},{"id":"n846","q":"What is the verbal call used to gather people for the eclipse prayer?","a":"\"Aṣ-Ṣalātu Jāmi‘ah\" (The prayer is communal)."},{"id":"n847","q":"What is the Sunnah regarding the length of the eclipse prayer?","a":"It is Sunnah to lengthen the cycles, the bowing, and the prostrating."},{"id":"n848","q":"What should the Imam do while the eclipse is clearing?","a":"The Imam should supplicate while facing the Qiblah, while the congregation says \"Amen.\""},{"id":"n849","q":"Is it better to supplicate standing or sitting during an eclipse prayer?","a":"Standing is better."},{"id":"n850","q":"What should be done if the Imam is absent during a solar eclipse?","a":"People pray individually."},{"id":"n851","q":"For which events is the prayer performed individually (similar to the lunar eclipse)?","a":"Lunar eclipses (Khusūf), dark storms, severe winds, and states of panic (Afzā‘)."},{"id":"n852","q":"What are the recommended behaviors for the people during the three days set aside to pray for rain (Istisqā’)?","a":"Walking to the location, wearing worn/patchy clothing, and maintaining a state of humility, submissiveness, and fear of Allah with heads bowed."},{"id":"n853","q":"Is there a requirement regarding charity during the Istisqā’ days?","a":"Yes, it is recommended to give charity daily before leaving."},{"id":"n854","q":"Who should be brought along to the prayer for rain?","a":"Animals, the elderly, and children."},{"id":"n855","q":"Where is the Istisqā’ prayer held in Mecca, Jerusalem, and Medina?","a":"In their respective Grand Mosques."},{"id":"n856","q":"What is the posture of the Imam and the people during the supplication for rain?","a":"The Imam stands facing the Qiblah with raised hands, while the people sit facing the Qiblah saying \"Amen.\""},{"id":"n857","q":"Is the \"turning of the garment\" (Qalb al-Ridā’) practiced in this tradition?","a":"No, it is not permitted."},{"id":"n858","q":"Are non-Muslims permitted to attend the prayer for rain?","a":"No, they are not permitted to attend."},{"id":"n859","q":"Under what conditions is Ṣalāt al-Khawf (Fear Prayer) permissible?","a":"It is permissible when facing an enemy or a beast, or when fearing drowning or fire."},{"id":"n860","q":"Briefly describe the procedure when the Imam divides the congregation into two parties for a two-cycle prayer.","a":"One party prays one Rak‘ah with the Imam then guards; the second party arrives and prays the remaining one with the Imam. The Imam makes Salām alone. The second party departs; the first returns, completes their final Rak‘ah without extra recitation, makes Salām, and departs."},{"id":"n861","q":"What happens if the danger is extreme/intense?","a":"They pray individually while mounted or walking, gesturing in whatever direction they can."},{"id":"n862","q":"Is the \"extreme danger\" method of prayer (gesturing while moving) permissible without an enemy present?","a":"No, it is not."},{"id":"n863","q":"Is it recommended to carry weapons during Ṣalāt al-Khawf?","a":"Yes, it is recommended."}]},{"title":"Funerals and martyrs","cards":[{"id":"n864","q":"What is preferred if the congregation is not divided into two parties?","a":"It is best for each party to pray with its own Imam as in normal conditions."},{"id":"n865","q":"What is the recommended way to position a person who is dying (Muḥṭaḍar)?","a":"Place them on their right side facing the Qiblah, or on their back, with the head slightly raised."},{"id":"n866","q":"How should the Shahādah be prompted to the dying person?","a":"It should be prompted gently without nagging."},{"id":"n867","q":"Which chapters of the Qur'an are recommended for relatives and neighbors to recite in the presence of a dying person?","a":"Sūrah Yāsīn (and al-Ra‘d according to some)."},{"id":"n868","q":"What should be done with the body immediately after death?","a":"Close the mouth (tie it if necessary) and the eyes, and recite the specified du'a."},{"id":"n869","q":"What should be placed on the abdomen of the deceased, and why?","a":"Iron, to prevent bloating."},{"id":"n870","q":"How should the hands be positioned on the deceased?","a":"They should be placed at the sides, not on the chest."},{"id":"n871","q":"Is it permitted to recite the Qur'an over the deceased immediately after death?","a":"It is Makrūh (disliked) until after the body has been washed."},{"id":"n872","q":"Is it permitted to notify people about a death?","a":"Yes, it is permissible."},{"id":"n873","q":"How should the process of preparing and washing the deceased (Ghusl) be handled?","a":"It should be hastened."},{"id":"n874","q":"Where should the body be placed during the washing process?","a":"On a bed perfumed with incense (an odd number of times)."},{"id":"n875","q":"What must be done regarding the ‘Awrah?","a":"It must be covered."},{"id":"n876","q":"Is Wuḍū’ performed for the deceased?","a":"Yes, but without rinsing the mouth or nose (unless they were in a state of major impurity)."},{"id":"n877","q":"What type of water should be used for the washing?","a":"Warm water mixed with lotus leaves or soap-like substances."},{"id":"n878","q":"What is the correct sequence for washing the body?","a":"Wash the head and beard first, then turn the body to the left to wash the right side, then turn to the right to wash the left side."},{"id":"n879","q":"What should be done if there is a discharge from the body after the wash?","a":"Prop the body up, wipe the abdomen, and wash away the discharge (the whole wash does not need repeating)."},{"id":"n880","q":"What is Ḥanūṭ and where is it applied?","a":"It is a scent applied to the head and beard."},{"id":"n881","q":"Where is camphor applied on the deceased?","a":"To the points of prostration."},{"id":"n882","q":"Are there any prohibitions regarding the grooming of the deceased during the wash?","a":"Yes, no cutting nails or hair, and no combing of the hair or beard."},{"id":"n883","q":"Is it permissible for a spouse to wash the deceased partner?","a":"A wife may wash her husband, but a husband may not wash his wife."},{"id":"n884","q":"If a woman dies among men (or vice versa), how is the Tayammum performed?","a":"They perform it using a cloth; if a Maḥram (non-marriageable relative) is present, they may do it without a cloth."},{"id":"n885","q":"How is Tayammum performed for an ambiguous gender (Khunthā Mushkil)?","a":"In the same manner as a woman dying among men."},{"id":"n886","q":"Who is responsible for the funeral costs of a wife?","a":"Her husband (even if he is poor)."},{"id":"n887","q":"If the deceased has no wealth and no supporting relatives, who is responsible for funeral costs?","a":"The public treasury (Bayt al-Māl), followed by the community at large."},{"id":"n888","q":"What are the Sunnah components of the shroud (Kafan) for men?","a":"A shirt (Qamīṣ), a waist-wrap (Izār), and a full-body wrap (Lifāfah)."},{"id":"n889","q":"What is the minimum required shroud for men?","a":"The Izār and the Lifāfah."},{"id":"n890","q":"What are the requirements for the material and style of the shroud?","a":"It should be white cotton, wrapped from left to right, with no hemmed edges, sleeves, pockets, or headgear."},{"id":"n891","q":"How does the shroud for women differ from men?","a":"It includes a head covering (Khimār) and a chest binding cloth."},{"id":"n892","q":"Where are the braids of the deceased woman's hair placed?","a":"In two braids placed on the chest over the shirt."},{"id":"n893","q":"How should the Khimār be placed in the shroud?","a":"It is placed under the Lifāfah."},{"id":"n894","q":"What is the procedure for scenting the shroud?","a":"Perfume the shrouds with incense an odd number of times before wrapping the body."},{"id":"n895","q":"What is the legal ruling of the funeral prayer (Ṣalāt al-Janāzah)?","a":"It is a communal obligation (Farḍ Kifāyah)."},{"id":"n896","q":"What are the pillars (Arkān) of the funeral prayer?","a":"The Takbīrs and standing."},{"id":"n897","q":"What are the conditions for the deceased regarding the funeral prayer?","a":"They must be Muslim, clean, placed in front of the congregation, and present (or the majority of the body, or at least half including the head)."},{"id":"n898","q":"What are the conditions regarding the person performing the funeral prayer?","a":"The person praying should not be riding (without an excuse)."},{"id":"n899","q":"Where should the deceased be placed during the prayer?","a":"On the ground (not on animals or people’s hands, unless there is an excuse)."},{"id":"n900","q":"Where should the Imam stand in relation to the deceased?","a":"Parallel to the chest of the deceased."},{"id":"n901","q":"What is the sequence of the Takbīrs in the funeral prayer?","a":"1. Opening praise (Thanā’); 2. Blessings upon the Prophet (ﷺ); 3. Supplication for the deceased; 4. Salām."},{"id":"n902","q":"When should the hands be raised during the funeral prayer?","a":"Only for the first Takbīr."},{"id":"n903","q":"Should one follow the Imam if he adds a fifth Takbīr?","a":"No; do not follow him, but wait for his Salām."},{"id":"n904","q":"What is recited in the third Takbīr for children or the insane?","a":"\"O Allah, make him a forerunner for us, a reward, a treasure, and an intercessor whose intercession is accepted.\""},{"id":"n905","q":"What is the order of priority for leading the funeral prayer?","a":"The authority (Sulṭān), then his deputy, then the Qadi, then the local Imam, then the guardian."},{"id":"n906","q":"What is the preferred way to pray over multiple deceased persons?","a":"It is better to pray over each individually."},{"id":"n907","q":"If multiple deceased persons are prayed over together, how should they be arranged?","a":"Aligned in a row facing the Qiblah so the chest of each is before the Imam."},{"id":"n908","q":"What is the order of arrangement for multiple deceased persons in a single funeral prayer (nearest to furthest from the Imam)?","a":"Men, then boys, then ambiguous genders, then women."},{"id":"n909","q":"If multiple deceased persons are to be buried in the same grave, what is the order of placement?","a":"The order is reversed (women, then ambiguous genders, then boys, then men)."},{"id":"n910","q":"What should one do if they arrive after the funeral prayer has already begun?","a":"Wait for the Imam's next Takbīr to join."},{"id":"n911","q":"What should one do if they arrive after the Imam has finished the funeral prayer?","a":"Pray what was missed after the Imam finishes (before the body is lifted)."},{"id":"n912","q":"What is the ruling regarding performing the funeral prayer inside a congregational mosque?","a":"It is disliked if the body is inside or outside while some people are inside."},{"id":"n913","q":"What is the ruling for a newborn who is born alive (cries)?","a":"They are washed and prayed over."},{"id":"n914","q":"What is the ruling for a newborn born without signs of life?","a":"They are washed and buried, but not prayed over."},{"id":"n915","q":"Is a child captured without a Muslim parent prayed over?","a":"No, unless they or a parent convert, or if they were not captured alongside a parent."},{"id":"n916","q":"For which categories of criminals is the funeral prayer not performed (even if they were washed)?","a":"Rebels, highway robbers killed while fighting, stealth assassins, armed muggers in the city at night, and those killed in clan feuds."},{"id":"n917","q":"What is the ruling for those who commit suicide?","a":"They are washed and prayed over."},{"id":"n918","q":"Is the funeral prayer performed for someone who kills a parent intentionally?","a":"No."},{"id":"n919","q":"How many men is it Sunnah to have carry the bier (Janāzah)?","a":"Four men."},{"id":"n920","q":"What is the recommended number of steps to carry the bier?","a":"40 steps."},{"id":"n921","q":"What is the recommended sequence for carrying the bier?","a":"Start with the front right corner, then the back right, then the front left, finishing with the back left."},{"id":"n922","q":"What is the recommended pace when carrying the bier?","a":"Hasten the pace without jogging (to avoid shaking the deceased)."},{"id":"n923","q":"Is it better to walk in front of or behind the bier?","a":"Walking behind the bier is better than walking in front."},{"id":"n924","q":"What is the comparative merit of walking behind vs. in front of the bier?","a":"Walking behind is considered like a Farḍ prayer, while walking in front is like a Nafl prayer."},{"id":"n925","q":"What is disliked when walking with the funeral procession?","a":"Raising voices in Dhikr and sitting down before the body is placed on the ground."},{"id":"n926","q":"How deep should a grave be dug?","a":"At least half a person's height or to the chest; deeper is better."},{"id":"n927","q":"When should a side niche (Laḥd) be used, and when should a trench (Shaqq) be used?","a":"A Laḥd is used in hard ground, and a Shaqq is used in soft soil."},{"id":"n928","q":"What should be recited when lowering the deceased into the grave?","a":"\"In the name of Allah and upon the way of the Messenger of Allah (ﷺ).\""},{"id":"n929","q":"How should the deceased be positioned in the grave?","a":"Facing the Qiblah on the right side, with the knots of the shroud untied."},{"id":"n930","q":"What materials are recommended and what are disliked for covering the niche?","a":"Use mud bricks or reeds; baked bricks and wood are disliked."},{"id":"n931","q":"How should the finished grave be shaped?","a":"It should be mounded (tasnīm); it should not be made square."},{"id":"n932","q":"Is building structures on or writing on a grave permissible?","a":"Building structures for decoration is forbidden; writing is permissible only to identify the deceased."},{"id":"n933","q":"Is it permitted to bury multiple people in one grave?","a":"Yes, if necessary, provided they are separated by earth."},{"id":"n934","q":"How far is it acceptable to transport a body for burial?","a":"Transporting up to a mile or two is acceptable; more than that is disliked."},{"id":"n935","q":"Is it permitted to move a body after burial?","a":"No, it is forbidden by consensus, unless the land was usurped or seized by pre-emption."},{"id":"n936","q":"In what specific cases is exhumation permitted?","a":"If valuables were dropped in, shrouds were stolen, or personal wealth was buried with the deceased."},{"id":"n937","q":"Is it permitted to exhume a body to correct its position (e.g., if it was not facing the Qiblah)?","a":"No, it is not permitted."},{"id":"n938","q":"What is the ruling on visiting graves?","a":"It is recommended for both men and women (the soundest view)."},{"id":"n939","q":"What is recommended to be recited during a grave visit?","a":"Sūrah Yāsīn."},{"id":"n940","q":"What is the belief regarding the recitation of Sūrah Yāsīn at a grave?","a":"It is related that Allah lightens the burden of those in the graves according to the number of verses read."},{"id":"n941","q":"Is sitting at a grave for the purpose of recitation considered Makrūh (disliked)?","a":"No, it is not."},{"id":"n942","q":"List three acts that are considered disliked regarding graves.","a":"Sitting on graves for non-recitation purposes, stepping/walking on them, sleeping on them, relieving oneself on them, or uprooting green plants/trees."},{"id":"n943","q":"Is it permitted to uproot plants from a cemetery?","a":"It is disliked to uproot green plants or trees, but permissible to uproot dried-out ones."},{"id":"n944","q":"How is a martyr (Shahīd) defined in relation to those who kill them?","a":"Anyone killed by belligerents, rebels, highway robbers, or thieves in one's home at night (even if killed with a heavy object)."},{"id":"n945","q":"What is the status of someone found dead on the battlefield?","a":"They are considered a martyr if there are traces of wounds on them."},{"id":"n946","q":"What conditions must be met for someone killed by a Muslim to be considered a martyr?","a":"The killer must have used a sharp weapon, the deceased must be an adult Muslim, not in a state of major ritual impurity or menstruation/post-partum, and they must not have lived long enough after the injury to show signs of life (e.g., eating, drinking, or extended movement)."},{"id":"n947","q":"How is the body of a martyr prepared for burial?","a":"They are buried in their blood and clothing; they are not washed."},{"id":"n948","q":"Is the funeral prayer performed for a martyr?","a":"Yes, the funeral prayer is performed over them."},{"id":"n949","q":"Are there any items that must be removed from the martyr before burial?","a":"Yes, items unsuitable for a shroud, such as heavy armor, weapons, and furs, are removed."},{"id":"n950","q":"When must a martyr be washed, contrary to the standard ruling?","a":"If they were in a state of major impurity, menstruation, or post-partum, or if they were a child or insane."},{"id":"n951","q":"What actions or signs after the battle indicate that a martyr must be washed?","a":"If they survived long enough to eat, drink, sleep, receive medical treatment, or were aware enough to pray a full prayer time."},{"id":"n952","q":"What happens to the status of a martyr if they are moved from the battlefield?","a":"They must be washed, unless they were moved to avoid being trampled."},{"id":"n953","q":"What legal or personal acts after the battle necessitate washing a martyr?","a":"If they made a will, bought or sold something, or spoke extensively after the battle."},{"id":"n954","q":"How are those killed in the city under questionable circumstances, or by Ḥadd punishment or Qiṣāṣ handled?","a":"They are washed and prayed over."}]},{"title":"Fasting","cards":[{"id":"n955","q":"How is fasting (al-Ṣawm) defined?","a":"Refraining during the day from intentionally or mistakenly introducing anything into the stomach (or that which has the same ruling), and from sexual intercourse, with the intention (Niyyah)."},{"id":"n956","q":"Who is the fast obligatory for?","a":"Those who are Muslim, sane, and pubescent."},{"id":"n957","q":"Is knowledge of the obligation required for the fast to be mandatory?","a":"Yes; for those who convert in hostile territory, it becomes mandatory once they learn of the obligation."},{"id":"n958","q":"What are the conditions for the performance (Adā’) of the fast?","a":"Physical health (no illness, menstruation, or post-partum bleeding) and residency (not traveling)."},{"id":"n959","q":"What are the conditions for the validity of the fast?","a":"Intention, purity from menstruation/post-partum bleeding, and absence of things that invalidate the fast."},{"id":"n960","q":"Is Janābah (major ritual impurity) a condition for the validity of the fast?","a":"No, purity from Janābah is not a condition for validity."},{"id":"n961","q":"What are the three types of fasts categorized as Farḍ?","a":"Ramadan (both Adā’ and Qaḍā’), expiations (Kaffārāt), and vows (Nadhr)."},{"id":"n962","q":"What is the ruling for making up a voluntary fast that was spoiled?","a":"It is Wājib."},{"id":"n963","q":"What is the Sunnah way to fast ‘Ashura?","a":"Fasting it with the 9th of Muharram."},{"id":"n964","q":"Which days are considered Mandūb (recommended) for fasting?","a":"Three days a month (especially the Ayyām al-Bīḍ—13th, 14th, 15th), Mondays and Thursdays, six days of Shawwāl, and any fast proven by Sunnah (like the fast of Prophet Dawud)."},{"id":"n965","q":"What is the ruling on fasting ‘Ashura alone without the 9th?","a":"It is Makrūh Tanzīhī."},{"id":"n966","q":"Which days are considered Makrūh Taḥrīmī to fast?","a":"The two Eids and the days of Tashrīq."},{"id":"n967","q":"What are some examples of disliked (Makrūh) fasts?","a":"Isolating Friday or Saturday, fasting on the days of Nayruz or Mihrajan (unless by habit), Wiṣāl fasting (joining days and nights), and fasting an entire lifetime."},{"id":"n968","q":"For which types of fasts is a specific intention not required?","a":"Ramadan, time-bound vows, and Nafl (supererogatory) fasts."},{"id":"n969","q":"What is the latest time one can form the intention for Ramadan, time-bound vows, or Nafl fasts?","a":"Before mid-day (al-ḍuḥā al-kubrā)."},{"id":"n970","q":"What is the rule if a healthy resident intends a different type of obligatory fast during the month of Ramadan?","a":"It still counts as a fast of Ramadan."},{"id":"n971","q":"For which types of fasts is it required to make the intention from the night (Tabyīt)?","a":"Qaḍā’ of Ramadan, Qaḍā’ of spoiled Nafl fasts, all Kaffārāt (expiations), and unconditional vows."},{"id":"n972","q":"How is the beginning of the month of Ramadan established?","a":"By sighting the crescent or, if the sky is overcast, by completing 30 days of Sha’bān."},{"id":"n973","q":"What is the Day of Doubt (Yawm al-Shakk)?","a":"The 30th of Sha’bān when there is uncertainty about whether it is the start of Ramadan."},{"id":"n974","q":"Is it permitted to fast the Day of Doubt?","a":"It is disliked, unless it is a Nafl (supererogatory) fast one is already in the habit of performing without wavering."},{"id":"n975","q":"If a person sees the crescent alone and the judge rejects their testimony, what must they do?","a":"They must still fast, but they cannot break their fast based solely on their own personal sighting of the Shawwāl crescent."},{"id":"n976","q":"If the sky is overcast, what is the requirement for establishing the start of Ramadan?","a":"The testimony of one just witness (including a woman, slave, or one previously punished for slander)."},{"id":"n977","q":"If the sky is clear, what is the requirement for establishing the start of Ramadan or Shawwāl?","a":"A large congregation of people, the size of which is left to the discretion of the Imam."},{"id":"n978","q":"What is the ruling regarding the geographic scope of the sighting?","a":"If the crescent is sighted in one region, it is binding upon all other regions (Ẓāhir al-Madhhab and the fatwa)."},{"id":"n979","q":"If the crescent is sighted during the day, is it counted for that day?","a":"No; it is considered for the following night."},{"id":"n980","q":"Does eating, drinking, or having intercourse due to forgetfulness invalidate the fast?","a":"No."},{"id":"n981","q":"If you see someone who is fasting eating by mistake, should you remind them?","a":"Yes, if the person is strong enough to fast; if they are not, it is better not to."},{"id":"n982","q":"Does an emission of fluid caused by looking or thinking invalidate the fast?","a":"No, even if it is persistent."},{"id":"n983","q":"Does applying oil or kohl invalidate the fast, even if the taste is felt in the throat?","a":"No."},{"id":"n984","q":"Does Ḥijāmah (cupping) invalidate the fast?","a":"No."},{"id":"n985","q":"Does backbiting (Ghaybah) invalidate the fast?","a":"No."},{"id":"n986","q":"If a person intends to break their fast but does not actually do so, is the fast invalidated?","a":"No."},{"id":"n987","q":"What is the ruling if smoke, dust, or a fly enters the throat involuntarily?","a":"The fast is not invalidated."},{"id":"n988","q":"Does tasting medicine invalidate the fast, provided one is mindful?","a":"No."},{"id":"n989","q":"If one wakes up in a state of Janābah (major impurity), is the fast valid if they remain that way throughout the day?","a":"Yes, the fast is still valid."},{"id":"n990","q":"Does pouring water or oil into the urethra invalidate the fast?","a":"No."},{"id":"n991","q":"Does water entering the ear (e.g., while swimming) invalidate the fast?","a":"No."},{"id":"n992","q":"Does scratching the ear with a stick repeatedly until earwax exits invalidate the fast?","a":"No."},{"id":"n993","q":"What is the ruling on swallowing nasal mucus (Nukhāmah) after inhaling it intentionally?","a":"It does not invalidate the fast, although it is recommended to spit it out."},{"id":"n994","q":"Does involuntary vomiting invalidate the fast?","a":"No, even if it fills the mouth."},{"id":"n995","q":"Does intentional vomiting of less than a mouthful invalidate the fast?","a":"No (per the soundest view)."},{"id":"n996","q":"Does swallowing a food particle stuck between the teeth invalidate the fast?","a":"No, provided the particle is smaller than a chickpea."},{"id":"n997","q":"Does chewing something taken from outside the mouth invalidate the fast?","a":"No, if it is the size of a sesame seed and is chewed until it disappears and no taste is felt in the throat."},{"id":"n998","q":"What are the two requirements for the acts listed in this chapter?","a":"Both making up the day (Qaḍā’) and paying the expiation (Kaffārah)."},{"id":"n999","q":"What conditions must be met for these acts to require Qaḍā’ and Kaffārah?","a":"They must be performed intentionally, willingly, and without necessity."},{"id":"n1000","q":"Does intercourse invalidate the fast?","a":"Yes, it requires both Qaḍā’ and Kaffārah for both the doer and the recipient (in either passage)."},{"id":"n1001","q":"Does eating or drinking medication or sustenance invalidate the fast?","a":"Yes, it requires Qaḍā’ and Kaffārah."},{"id":"n1002","q":"What is the ruling on swallowing rainwater that enters the mouth?","a":"It requires Qaḍā’ and Kaffārah."},{"id":"n1003","q":"Is eating raw meat or dried meat (Qadīd) considered an invalidating act requiring Kaffārah?","a":"Yes, even if the raw meat is malodorous (unless it has worms)."},{"id":"n1004","q":"What is the ruling regarding swallowing wheat grains?","a":"It requires Qaḍā’ and Kaffārah."},{"id":"n1005","q":"Is chewing or swallowing a sesame seed taken from outside the mouth an invalidating act?","a":"Yes, it requires Qaḍā’ and Kaffārah (per the chosen view)."},{"id":"n1006","q":"Does eating clay or dirt require Qaḍā’ and Kaffārah?","a":"Yes, for Armenian clay, or other types if one is accustomed to eating them."},{"id":"n1007","q":"Does swallowing the saliva of one's wife or friend require Qaḍā’ and Kaffārah?","a":"Yes."},{"id":"n1008","q":"If someone mistakenly believes an act breaks the fast (e.g., applying oil to the mustache) and then eats, does Kaffārah apply?","a":"If they act based on a jurist's ruling or a Hadith they do not fully understand, Kaffārah is not required. If they know the correct interpretation, Kaffārah applies."},{"id":"n1009","q":"Is Kaffārah obligatory upon a woman who is forced into intercourse?","a":"No; it is only obligatory if she submits willingly."},{"id":"n1010","q":"When is the Kaffārah (expiation) dropped?","a":"If the person begins menstruation, post-partum bleeding, or an illness that makes breaking the fast permissible on that same day."},{"id":"n1011","q":"Is Kaffārah dropped if one travels after it has already become binding?","a":"No, it is not."},{"id":"n1012","q":"What is the order of the Kaffārah?","a":"1. Freeing a slave; 2. Fasting two consecutive months; 3. Feeding 60 poor people."},{"id":"n1013","q":"What are the requirements for feeding the poor in Kaffārah?","a":"A full lunch and dinner, or providing half a Ṣā‘ of wheat/flour, or a full Ṣā‘ of dates/barley per person (or the equivalent value)."},{"id":"n1014","q":"Does a single Kaffārah suffice for multiple acts of invalidation performed on different days?","a":"Yes, provided no previous Kaffārah was performed in between, even if the days belong to two different Ramadans (per the soundest view)."},{"id":"n1015","q":"When is a single Kaffārah not sufficient for multiple acts?","a":"If a Kaffārah was performed between the acts of invalidation."},{"id":"n1016","q":"What is the ruling for acts that break the fast but do not require Kaffārah?","a":"Only Qaḍā’ (making up the day) is required."},{"id":"n1017","q":"Does eating raw rice, dough, or flour require Kaffārah?","a":"No, only Qaḍā’ is required."},{"id":"n1018","q":"What is the ruling for consuming substances not typically eaten, such as pebbles, iron, or stones?","a":"It only requires Qaḍā’."},{"id":"n1019","q":"Does using an enema (Iḥtiqān) invalidate the fast with Kaffārah?","a":"No, it only requires Qaḍā’."},{"id":"n1020","q":"What is the ruling for placing medication in the nose (Isti‘āṭ)?","a":"It only requires Qaḍā’."},{"id":"n1021","q":"If a person has liquid poured into their throat while they are asleep, does it require Kaffārah?","a":"No, it only requires Qaḍā’."},{"id":"n1022","q":"What is the ruling for applying oil or water to the ear?","a":"According to the soundest view, it only requires Qaḍā’."},{"id":"n1023","q":"Under what conditions does applying medicine to a head or body wound require Qaḍā’?","a":"If the medicine reaches the abdomen (from a Jā’ifah wound) or the brain (from an Āmah wound)."},{"id":"n1024","q":"Does rainwater or snow entering the throat invalidate the fast if not swallowed intentionally?","a":"According to the soundest view, it requires Qaḍā’ (but no Kaffārah)."},{"id":"n1025","q":"What is the ruling if water enters the throat by accident while performing Maḍmaḍah (rinsing the mouth)?","a":"It requires Qaḍā’."},{"id":"n1026","q":"If a person remembers they are fasting while eating, but then continues to eat intentionally, what is the ruling?","a":"According to the soundest view, it requires Qaḍā’."},{"id":"n1027","q":"If one eats after failing to make the intention at night, even if they form the intention later that day, what is required?","a":"Qaḍā’."},{"id":"n1028","q":"What is the ruling if one breaks their fast thinking the sun has set, only to realize it is still visible?","a":"It requires Qaḍā’."},{"id":"n1029","q":"Does emission caused by Tafkhīdh (thigh-to-thigh contact) or masturbation require Kaffārah?","a":"No, it only requires Qaḍā’."},{"id":"n1030","q":"Does emission caused by kissing or touching with desire require Kaffārah?","a":"No, it only requires Qaḍā’."},{"id":"n1031","q":"Does introducing a moist finger or cotton into the rectum or internal vaginal passage require Kaffārah?","a":"No, it only requires Qaḍā’."},{"id":"n1032","q":"Does intentional inhalation of smoke require Kaffārah?","a":"No, it only requires Qaḍā’."},{"id":"n1033","q":"What is the ruling on forcing oneself to vomit?","a":"According to the soundest view, it requires Qaḍā’ (even if it is less than a mouthful)."},{"id":"n1034","q":"What is the ruling on swallowing voluntary vomit that filled the mouth?","a":"It requires Qaḍā’."},{"id":"n1035","q":"Does eating a particle of food stuck between the teeth that is the size of a chickpea (or larger) require Kaffārah?","a":"No, it only requires Qaḍā’."},{"id":"n1036","q":"If a person becomes insane or faints for the entire duration of the month of Ramadan, must they make up the days?","a":"No, Qaḍā’ is not required for the days of insanity or unconsciousness."},{"id":"n1037","q":"What is the ruling for a traveler who decides to reside (iqāmah) and then eats, or a resident who travels and then eats?","a":"It requires Qaḍā’."},{"id":"n1038","q":"What is the ruling on having intercourse while unaware of dawn (Fajr), only to realize later that it had already broken?","a":"It requires Qaḍā’."},{"id":"n1039","q":"What is the obligation (Imsāk) for a person whose fast has been invalidated during the day?","a":"They must refrain from eating or drinking for the remainder of the day."},{"id":"n1040","q":"If a woman becomes pure from menstruation or post-partum bleeding after dawn, what is her obligation?","a":"She must refrain from eating/drinking for the rest of the day and make up the day (Qaḍā’)."},{"id":"n1041","q":"What is the obligation for a child who reaches puberty during the day?","a":"They must refrain from eating/drinking for the rest of the day, but they do not need to make up the day (Qaḍā’)."},{"id":"n1042","q":"What is the obligation for a non-Muslim who converts to Islam during the day?","a":"They must refrain from eating/drinking for the rest of the day, but they do not need to make up the day (Qaḍā’)."},{"id":"n1043","q":"Who is required to make up the day (Qaḍā’) after failing to fast due to the reasons listed in this chapter?","a":"Those whose fast was invalidated, and women who were in a state of menstruation or post-partum bleeding at dawn."},{"id":"n1044","q":"What are the seven things considered disliked (Makrūh) for someone fasting?","a":"1. Tasting something (without excuse), 2. Chewing something (without excuse), 3. Chewing gum, 4. Kissing, 5. Physical intimacy (Mubāsharah), 6. Collecting and swallowing saliva, 7. Anything suspected of weakening the faster (e.g., bloodletting or cupping)."},{"id":"n1045","q":"Under what condition is physical intimacy (Mubāsharah) considered Makrūh?","a":"If one is not confident they can control themselves from ejaculation or intercourse (per the Ẓāhir al-Riwāyah)."},{"id":"n1046","q":"Why are actions like bloodletting (Faṣd) or cupping (Ḥijāmah) considered Makrūh?","a":"Because they are suspected of weakening the person fasting."},{"id":"n1047","q":"Under what condition is kissing or physical intimacy considered permissible?","a":"Provided one is safe and secure from ejaculation or intercourse."},{"id":"n1048","q":"Is it disliked to apply oil to the mustache or kohl while fasting?","a":"No, these are considered permissible."},{"id":"n1049","q":"Are Ḥijāmah (cupping) and Faṣd (bloodletting) always disliked?","a":"No, they are considered permissible, provided they do not weaken the faster."},{"id":"n1050","q":"What is the ruling on using the Miswāk while fasting?","a":"It is permissible and remains Sunnah throughout the entire day, even at the end of the day, regardless of whether it is fresh or moistened with water."},{"id":"n1051","q":"Is it permissible to rinse the mouth and nose for purposes other than Wuḍū’?","a":"Yes, this is permitted."},{"id":"n1052","q":"Is it permissible to take a bath or wash oneself while fasting?","a":"Yes."},{"id":"n1053","q":"Is it permissible to wrap oneself in a wet cloth to cool down?","a":"Yes, according to the fatwa."},{"id":"n1054","q":"What are the three recommended (Mustaḥabb) acts for one who is fasting?","a":"Eating Suhur, delaying the Suhur (until just before dawn), and hastening the Iftār (breaking the fast)."},{"id":"n1055","q":"When is it specifically recommended to hasten the Iftār?","a":"On clear days, when there is no doubt that the sun has set."},{"id":"n1056","q":"Who is permitted to break their fast according to the chapter on impediments?","a":"Those fearing increased illness, pregnant or nursing women fearing harm to themselves or their child, and those suffering from life-threatening hunger or thirst."},{"id":"n1057","q":"Is it better for a traveler to fast or break their fast?","a":"Fasting is better if it does not harm them and companions are also fasting; otherwise, it is better to break the fast and join their companions."},{"id":"n1058","q":"What is the rule for making up missed fasts if someone dies before their excuse is removed?","a":"They are not required to leave a will for fasting."},{"id":"n1059","q":"Must missed fasts (Qaḍā’) be performed on consecutive days?","a":"No, consecutive days are not required."},{"id":"n1060","q":"If a new Ramadan approaches and one has missed fasts from a previous year, what is the priority?","a":"Prioritize the new month of Ramadan; there is no penalty or expiation for delaying the makeup fast."},{"id":"n1061","q":"What is the Fidyah for an elderly or infirm person unable to fast?","a":"Providing half a Ṣā‘ of wheat per day."},{"id":"n1062","q":"Can Kaffārah (expiation) for broken oaths or killing be replaced by Fidyah if one becomes too frail?","a":"No."},{"id":"n1063","q":"Can a voluntary faster break their fast without an excuse?","a":"Yes."},{"id":"n1064","q":"Is hospitality considered a valid excuse to break a voluntary fast?","a":"Yes, for both the guest and the host."},{"id":"n1065","q":"Must voluntary fasts that are spoiled be made up?","a":"Yes, except for those started on the two Eids or Tashrīq days, which do not need to be made up (per Ẓāhir al-Riwāyah)."}]},{"title":"Vows and i'tikaf","cards":[{"id":"n1066","q":"What are the conditions for the validity of a vow (Nadhr)?","a":"It must be of a genus that is already obligatory, intended for worship, not currently obligatory, and must not be impossible."},{"id":"n1067","q":"Give examples of valid vows.","a":"Emancipation (‘Itq), seclusion (I‘tikāf), non-obligatory prayer, and fasting."},{"id":"n1068","q":"Give examples of invalid vows.","a":"Ablution (Wuḍū’), prostration of recitation, visiting the sick, or already-obligatory duties."},{"id":"n1069","q":"What is the rule regarding the fulfillment of a general vow?","a":"Once an absolute or conditional vow is made and the condition is met, it must be fulfilled."},{"id":"n1070","q":"Is a designated time, place, or recipient in a vow binding?","a":"No, these specific designations are not binding."},{"id":"n1071","q":"If someone vows to fast in Sha’bān, would fasting in Rajab satisfy it?","a":"Yes, fasting in another month satisfies the vow."},{"id":"n1072","q":"If someone vows to pray in Mecca, does praying elsewhere satisfy the vow?","a":"Yes, praying anywhere satisfies the vow."},{"id":"n1073","q":"What is the definition of I‘tikāf?","a":"Staying in a mosque where the five daily congregational prayers are held, with the intention of seclusion."},{"id":"n1074","q":"Where may women perform I‘tikāf?","a":"In their dedicated prayer space at home."},{"id":"n1075","q":"What are the three types of I‘tikāf?","a":"Wājib (due to a vow), Sunnah Kifāyah (the last ten days of Ramadan), and Mustaḥabb (at other times)."},{"id":"n1076","q":"Is fasting a requirement for all types of I‘tikāf?","a":"No, fasting is only a condition for I‘tikāf that has been vowed."},{"id":"n1077","q":"What is the minimum duration for a voluntary I‘tikāf?","a":"It can be a very short period, even while walking."},{"id":"n1078","q":"For what reasons is it permissible to leave the mosque during I‘tikāf?","a":"Shar‘ī needs (e.g., Friday/Eid prayer), natural needs (e.g., toilet, washing from Janābah), or emergencies (e.g., mosque collapsing, forced removal, fear for self/possessions)."},{"id":"n1079","q":"What is the consequence of leaving the mosque for an hour without an excuse during a mandatory I‘tikāf?","a":"It invalidates the I‘tikāf."},{"id":"n1080","q":"Is commercial trading permitted during I‘tikāf?","a":"It is disliked to present goods for sale or conduct commercial trading."},{"id":"n1081","q":"What is the ruling on keeping silent during I‘tikāf?","a":"It is disliked if one believes silence is an act of worship."},{"id":"n1082","q":"What are the prohibitions regarding physical conduct during I‘tikāf?","a":"Intercourse and its preliminaries are forbidden and invalidate the seclusion."},{"id":"n1083","q":"If one vows to seclude for \"days,\" are the nights included?","a":"Yes. Conversely, vowing for \"nights\" includes the days."}]}],"tahawiyya":[{"id":"t0","ar":"العقيدة الطحاوية","en":"The Creed of Imam Al-Tahawi","note":"About the AuthorThe creed of Imam Al-Tahawi is one of, if not the oldest complete works on Sunni creed in Islamic history. It was written by Imam Abu Ja'far Ahmed Al-Tahawi, an Egyptian scholar born in 239 A.H., in the city of Taha. Imam Al-Tahawi was the nephew of one of the greatest students of Imam Al-Shafi'i, Imam Isma'il ibn Yahya Al-Muzani, although Imam Al-Tahawi left the Shafi'i school early in his life to become a Hanafi. Imam Al-Tahawi studied under the auspices of the greatest inheritors and representatives of the Hanafi school, including Imam Ahmed ibn Imran Al-Hanafi, a scholar who had studied under both of the sahibayn, the two companions of Imam Abu Hanifa: Imam Muhammad Al-Shaybani and Qadi Abu Yusuf.\nImam Al-Tahawi is considered to be one of the highest authorities of the Hanafi school, mastering not only jurisprudence, but also Hadith, Arabic, and concievably all of the other Islamic sciences as well. He was a prolific author, writing Sharh Ma'ani ul-Athaar and Sharh Mushkil ul-Athaar, two crucial texts in Hadith literature, along with a host of other works in other topics.\nAbout the TextImam Al-Tahawi lived in the early stages of the Abbasid era, a time marked by"},{"id":"t1","ar":"المقدمة","en":"Introduction","note":""},{"id":"t2","ar":"بِسْمِ اللهِ الرَّحْمَنِ الرَّحِيمِ وَبِهِ نَسْتَعِينُ، الْحَمْدُ للهِ رَبِّ الْعَالَمِينَ.","en":"In the name of Allah, the Most Gracious, the Most Merciful. We ask Him for help. All praise is due to Allah, the Lord of the worlds.","note":"الرَّحْمَنِ: The Most Gracious - one of the most beautiful names of Allah, indicating His encompassing mercy for all creation.\nالرَّحِيمِ: The Most Merciful - indicating Allah's special mercy for the believers in particular.\nنَسْتَعِينُ: We seek assistance - acknowledging our dependence on Allah for all help and success."},{"id":"t3","ar":"قَالَ الْعَلَّامَةُ حُجَّةُ الْإِسْلَامِ أَبُو جَعْفَرٍ الْوَرَّاقُ الطَّحَاوِيُّ بِمِصْرَ رَحِمَهُ اللهُ: هَذَا ذِكْرُ بَيَانِ عَقِيدَةِ أَهْلِ السُّنَّةِ وَالْجَمَاعَةِ، عَلَى مَذْهَبِ فُقَهَاءِ الْمِلَّةِ: أَبِي حَنِيفَةَ النُّعْمَانِ بْنِ ثَابِتٍ الْكُوفِيِّ، وَأَبِي يُوسُفَ يَعْقُوبَ بْنِ إِبْرَاهِيمَ الْأَنْصَارِيِّ، وَأَبِي عَبْدِاللهِ مُحَمَّدِ بْنِ الْحَسَنِ الشَّيْبَانِيِّ رِضْوَانُ اللهِ عَلَيْهِمْ أَجْمَعِينَ؛ وَمَا يَعْتَقِدُونَ مِنْ أُصُولِ الدِّينِ، وَيَدِينُونَ بِهِ رَبَّ الْعَالَمِينَ.","en":"The great scholar, Hujjat al-Islam Abu Ja'far al-Warraq al-Tahawi (may Allah have mercy on him) said in Egypt: This is a presentation of the creed of the People of the Sunnah and the Community, according to the school of the jurists of this religion: Abu Hanifah al-Nu'man ibn Thabit al-Kufi, Abu Yusuf Ya'qub ibn Ibrahim al-Ansari, and Abu 'Abdillah Muhammad ibn al-Hasan al-Shaybani (may Allah be pleased with them all); and what they believe regarding the fundamentals of the religion and profess to the Lord of the worlds.","note":""},{"id":"t4","ar":"الإيمان بالله تعالى","en":"Faith in Allah Almighty","note":""},{"id":"t5","ar":"نَقُولُ فِي تَوْحِيدِ اللهِ مُعْتَقِدِينَ بِتَوْفِيقِ اللهِ: إِنَّ اللهَ وَاحِدٌ لَا شَرِيكَ لَهُ، وَلَا شَيْءَ مِثْلُهُ، وَلَا شَيْءَ يُعْجِزُهُ، وَلَا إِلَهَ غَيْرُهُ.","en":"Regarding the Oneness of Allah, believing with Allah's help, we say: Allah is One, without any partner. There is nothing like Him. Nothing can overwhelm Him. There is no god other than Him.","note":"تَوْحِيدِ: To make something one/to declare its oneness and uniqueness.\nشَرِيكَ: Partner - Allah has no partners, associates, or equals in His divinity.\nيُعْجِزُهُ: Can overwhelm Him - nothing in creation can overpower or defeat Allah."},{"id":"t6","ar":"قَدِيمٌ بِلَا ابْتِدَاءٍ، دَائِمٌ بِلَا انْتِهَاءٍ، لَا يَفْنَى وَلَا يَبِيدُ، وَلَا يَكُونُ إِلَّا مَا يُرِيدُ.","en":"He is eternal, without a beginning; everlasting, without an end. He will never perish or cease to be. Nothing happens except what He wills.","note":"قَدِيمٌ: Eternal - Allah exists without beginning, having no temporal origin. | دَائِمٌ: Everlasting - Allah will continue to exist forever without end. | يَفْنَى: Perish - Allah will never cease to exist or be destroyed. | يُرِيدُ: He wills - everything that occurs is according to Allah's divine will."},{"id":"t7","ar":"لَا تَبْلُغُهُ الْأَوْهَامُ، وَلَا تُدْرِكُهُ الْأَفْهَامُ، وَلَا يُشْبِهُ الْأَنَامَ، حَيٌّ لَا يَمُوتُ، قَيُّومٌ لَا يَنَامُ.","en":"Imaginations cannot conceive Him, nor can intellects comprehend Him. He does not resemble created beings. He is Living and never dies, the All-Sustaining and never sleeps.","note":"الْأَوْهَامُ: Imaginative faculty which extracts meanings from sensible things.\nالْأَفْهَامُ: Faculty of understanding from multiple angels, and thus doing 'Idraak'."},{"id":"t8","ar":"خَالِقٌ بِلَا حَاجَةٍ، رَازِقٌ بِلَا مُؤْنَةٍ، مُمِيتٌ بِلَا مَخَافَةٍ، بَاعِثٌ بِلَا مَشَقَّةٍ.","en":"He creates without any need, provides without any effort. He gives death without any fear and resurrects without any difficulty.","note":""},{"id":"t9","ar":"مَا زَالَ بِصِفَاتِهِ قَدِيمًا قَبْلَ خَلْقِهِ، لَمْ يَزْدَدْ بِكَوْنِهِمْ شَيْئًا لَمْ يَكُنْ قَبْلَهُمْ مِنْ صِفَاتِهِ، وَكَمَا كَانَ بِصِفَاتِهِ أَزَلِيًّا كَذَلِكَ لَا يَزَالُ عَلَيْهَا أَبَدِيًّا.","en":"He has eternally existed with His attributes before His creation. Their coming into being did not add anything to His attributes that was not there before. Just as He was with His attributes in pre-eternity, so He will remain upon them for all eternity.","note":""},{"id":"t10","ar":"لَيْسَ بَعْدَ خَلْقِ الْخَلْقِ اسْتَفَادَ اسْمَ الْخَالِقِ، وَلَا بِإِحْدَاثِ الْبَرِيَّةِ اسْتَفَادَ اسْمَ الْبَارِي.","en":"It was not after creating the creation that He acquired the name 'the Creator', nor by bringing the creation into existence did He acquire the name 'the Originator'.","note":""},{"id":"t11","ar":"لَهُ مَعْنَى الرُّبُوبِيَّةِ وَلَا مَرْبُوبَ، وَمَعْنَى الْخَالِقِيَّةِ وَلَا مَخْلُوقَ.","en":"He possessed the meaning of Lordship even when there was nothing to be Lord over, and the meaning of Creatorship even when there was no creation.","note":""},{"id":"t12","ar":"وَكَمَا أَنَّهُ مُحْيِي الْمَوْتَى بَعْدَمَا أَحْيَاهُمْ اسْتَحَقَّ هَذَا الِاسْمَ قَبْلَ إِحْيَائِهِمْ، كَذَلِكَ اسْتَحَقَّ اسْمَ الْخَالِقِ قَبْلَ إِنْشَائِهِمْ.","en":"Just as He is the Giver of life to the dead after He brings them to life, He deserved this name before bringing them to life. Likewise, He deserved the name 'the Creator' before creating them.","note":""},{"id":"t13","ar":"ذَلِكَ بِأَنَّهُ عَلَى كُلِّ شَيْءٍ قَدِيرٌ، وَكُلُّ شَيْءٍ إِلَيْهِ فَقِيرٌ، وَكُلُّ أَمْرٍ عَلَيْهِ يَسِيرٌ، لَا يَحْتَاجُ إِلَى شَيْءٍ، (لَيْسَ كَمِثْلِهِ شَيْءٌ، وَهُوَ السَّمِيعُ الْبَصِيرُ).","en":"That is because He is powerful over all things, and all things are in need of Him. Every matter is easy for Him. He is not in need of anything. 'There is nothing whatsoever like unto Him, and He is the All-Hearing, the All-Seeing.' (Qur'an 42:11).","note":""},{"id":"t14","ar":"خَلَقَ الْخَلْقَ بِعِلْمِهِ، وَقَدَّرَ لَهُمْ أَقْدَارًا، وَضَرَبَ لَهُمْ آجَالًا.","en":"He created the creation with His knowledge. He appointed destinies for them and set for them specific life spans.","note":""},{"id":"t15","ar":"لَمْ يَخْفَ عَلَيْهِ شَيْءٌ قَبْلَ أَنْ يَخْلُقَهُمْ، وَعَلِمَ مَا هُمْ عَامِلُونَ قَبْلَ أَنْ يَخْلُقَهُمْ، وَأَمَرَهُمْ بِطَاعَتِهِ، وَنَهَاهُمْ عَنْ مَعْصِيَتِهِ.","en":"Nothing was hidden from Him before He created them, and He knew what they would do before He created them. He commanded them to obey Him and forbade them from disobeying Him.","note":""},{"id":"t16","ar":"وَكُلُّ شَيْءٍ يَجْرِي بِتَقْدِيرِهِ وَمَشِيئَتِهِ، وَمَشِيئَتُهُ تَنْفُذُ لَا مَشِيئَةَ لِلْعِبَادِ إِلَّا مَا شَاءَ لَهُمْ، فَمَا شَاءَ لَهُمْ كَانَ، وَمَا لَمْ يَشَأْ لَمْ يَكُنْ.","en":"Everything runs according to His decree and will. His will is executed. There is no will for the servants except what He wills for them. So what He wills for them is, and what He does not will is not.","note":""},{"id":"t17","ar":"يَهْدِي مَنْ يَشَاءُ، وَيَعْصِمُ وَيُعَافِي فَضْلًا، وَيُضِلُّ مَنْ يَشَاءُ، وَيَخْذُلُ وَيَبْتَلِي عَدْلًا، وَكُلُّهُمْ يَتَقَلَّبُونَ فِي مَشِيئَتِهِ بَيْنَ فَضْلِهِ وَعَدْلِهِ.","en":"He guides whomever He wills, and protects and keeps them safe from harm out of His grace. And He leads astray whomever He wills, and forsakes and afflicts them out of His justice. All of them are subject to His will between His grace and His justice.","note":""},{"id":"t18","ar":"وَهُوَ مُتَعَالٍ عَنِ الْأَضْدَادِ وَالْأَنْدَادِ، لَا رَادَّ لِقَضَائِهِ، وَلَا مُعَقِّبَ لِحُكْمِهِ، وَلَا غَالِبَ لِأَمْرِهِ.","en":"He is exalted above having opposites or equals. There is no repeller of His decree, no deferrer of His judgment, and no overcomer of His command.","note":""},{"id":"t19","ar":"آمَنَّا بِذَلِكَ كُلِّهِ، وَأَيْقَنَّا أَنَّ كُلًّا مِنْ عِنْدِهِ.","en":"We believe in all of that, and we are certain that everything is from Him.","note":""},{"id":"t20","ar":"الإيمان بالقرآن الكريم","en":"Faith in the Noble Qur'an","note":""},{"id":"t21","ar":"وَأَنَّ مُحَمَّدًا عَبْدُهُ الْمُصْطَفَى، وَنَبِيُّهُ الْمُجْتَبَى، وَرَسُولُهُ الْمُرْتَضَى، وَأَنَّهُ خَاتَمُ الْأَنْبِيَاءِ، وَإِمَامُ الْأَتْقِيَاءِ، وَسَيِّدُ الْمُرْسَلِينَ، وَحَبِيبُ رَبِّ الْعَالَمِينَ، وَكُلُّ دَعْوَى النُّبُوَّةِ بَعْدَهُ فَغَيٌّ وَهَوَى، وَهُوَ الْمَبْعُوثُ إِلَى عَامَّةِ الْجِنِّ، وَكَافَّةِ الْوَرَى، بِالْحَقِّ وَالْهُدَى، وَبِالنُّورِ وَالضِّيَاءِ.","en":"And that Muhammad is His chosen servant, His selected Prophet, and His approved Messenger. And that he is the Seal of the Prophets, the Leader of the pious, the Master of the messengers, and the Beloved of the Lord of the worlds. Every claim to prophethood after him is misguidance and whimsy. He is the one sent to all of the jinn and the entirety of mankind with truth and guidance, and with light and illumination.","note":""},{"id":"t22","ar":"وَإِنَّ الْقُرْآنَ كَلَامُ اللهِ، مِنْهُ بَدَا بِلَا كَيْفِيَّةٍ قَوْلًا، وَأَنْزَلَهُ عَلَى رَسُولِهِ وَحْيًا، وَصَدَّقَهُ الْمُؤْمِنُونَ عَلَى ذَلِكَ حَقًّا، وَأَيْقَنُوا أَنَّهُ كَلَامُ اللهِ تَعَالَى بِالْحَقِيقَةِ، لَيْسَ بِمَخْلُوقٍ كَكَلَامِ الْبَرِيَّةِ، فَمَنْ سَمِعَهُ فَزَعَمَ أَنَّهُ كَلَامُ الْبَشَرِ فَقَدْ كَفَرَ، وَقَدْ ذَمَّهُ اللهُ وَعَابَهُ، وَأَوْعَدَهُ بِسَقَرَ، حَيْثُ قَالَ تَعَالَى: (سَأُصْلِيهِ سَقَرَ)، فَلَمَّا أَوْعَدَ اللهُ بِسَقَرَ لِمَنْ قَالَ: (إِنْ هَذَا إِلَّا قَوْلُ الْبَشَرِ) عَلِمْنَا وَأَيْقَنَّا أَنَّهُ قَوْلُ خَالِقِ الْبَشَرِ، وَلَا يُشْبِهُ قَوْلَ الْبَشَرِ.","en":"The Qur'an is the word of Allah. It came from Him as speech without it being possible to say how. He sent it down upon His Messenger as revelation. The believers accept this as the truth. They are certain that it is, in truth, the word of Allah Almighty. It is not created as is the speech of human beings. Anyone who hears it and claims it is the word of a human being has disbelieved. Allah has condemned and censured him and promised him the fire of Saqar, where He says, 'I will roast him in Saqar.' (Qur'an 74:26). When Allah promised the Fire for a person who says 'This is nothing but the word of a human being' (Qur'an 74:25), we know for certain that it is the word of the Creator of human beings and that it does not resemble the word of human beings.","note":"كَلَامُ اللهِ: The speech of Allah - the Qur'an is the direct speech of Allah, not created.\nوَحْيًا: As revelation - the Qur'an was revealed through divine inspiration to Prophet Muhammad ﷺ.\nبِمَخْلُوقٍ : Created - the Qur'an is not a created thing like human speech, but the eternal attribute of Allah."},{"id":"t23","ar":"كفر من قال بالتشبيه","en":"The Disbelief of One Who Likens Allah to Creation","note":""},{"id":"t24","ar":"وَمَنْ وَصَفَ اللهَ بِمَعْنًى مِنْ مَعَانِي الْبَشَرِ فَقَدْ كَفَرَ، فَمَنْ أَبْصَرَ هَذَا اعْتَبَرَ، وَعَنْ مِثْلِ قَوْلِ الْكُفَّارِ انْزَجَرَ، وَعَلِمَ أَنَّهُ بِصِفَاتِهِ لَيْسَ كَالْبَشَرِ.","en":"Anyone who describes Allah with any of the meanings of human beings has disbelieved. Whoever sees this should take heed and refrain from statements like those of the disbelievers, and he should know that Allah, with His attributes, is not like human beings.","note":""},{"id":"t25","ar":"رؤية الله حق","en":"The Vision of Allah is True","note":""},{"id":"t26","ar":"وَالرُّؤْيَةُ حَقٌّ لِأَهْلِ الْجَنَّةِ بِغَيْرِ إِحَاطَةٍ وَلَا كَيْفِيَّةٍ، كَمَا نَطَقَ بِهِ كِتَابُ رَبِّنَا: (وُجُوهٌ يَوْمَئِذٍ نَاضِرَةٌ إِلَى رَبِّهَا نَاظِرَةٌ)، وَتَفْسِيرُهُ عَلَى مَا أَرَادَهُ اللهُ تَعَالَى وَعَلِمَهُ، وَكُلُّ مَا جَاءَ فِي ذَلِكَ مِنَ الْحَدِيثِ الصَّحِيحِ عَنِ الرَّسُولِ ﷺ فَهُوَ كَمَا قَالَ، وَمَعْنَاهُ عَلَى مَا أَرَادَ لَا نَدْخُلُ فِي ذَلِكَ مُتَأَوِّلِينَ بِآرَائِنَا، وَلَا مُتَوَهِّمِينَ بِأَهْوَائِنَا، فَإِنَّهُ مَا سَلِمَ فِي دِينِهِ إِلَّا مَنْ سَلَّمَ للهِ عَزَّ وَجَلَّ وَلِرَسُولِهِ ﷺ، وَرَدَّ عِلْمَ مَا اشْتَبَهَ عَلَيْهِ إِلَى عَالِمِهِ.","en":"The vision of Allah by the people of Paradise is true, without their vision being encompassing and without the modality of their vision being known. As the Book of our Lord has stated: 'Faces on that Day will be radiant, looking at their Lord.' (Qur'an 75:22-23). The explanation of this is as Allah Himself willed and knows. Everything that has come down to us in this regard from the Messenger ﷺ in authentic hadith is as he said and means what he intended. We do not delve into that, interpreting it with our own opinions or imagining it according to our whims. For no one is safe in his religion unless he submits himself completely to Allah, the Exalted and Glorified, and to His Messenger ﷺ, and consigns knowledge of matters unclear to him to the one who knows them.","note":""},{"id":"t27","ar":"وَلَا يَثْبُتُ قَدَمُ الْإِسْلَامِ إِلَّا عَلَى ظَهْرِ التَّسْلِيمِ وَالِاسْتِسْلَامِ، فَمَنْ رَامَ عِلْمَ مَا حُظِرَ عَنْهُ عِلْمُهُ، وَلَمْ يَقْنَعْ بِالتَّسْلِيمِ فَهْمُهُ، حَجَبَهُ مَرَامُهُ عَنْ خَالِصِ التَّوْحِيدِ، وَصَافِي الْمَعْرِفَةِ، وَصَحِيحِ الْإِيمَانِ، فَيَتَذَبْذَبُ بَيْنَ الْكُفْرِ وَالْإِيمَانِ، وَالتَّصْدِيقِ وَالتَّكْذِيبِ، وَالْإِقْرَارِ وَالْإِنْكَارِ، مُوَسْوِسًا تَائِهًا، زَائِغًا شَاكًّا، لَا مُؤْمِنًا مُصَدِّقًا، وَلَا جَاحِدًا مُكَذِّبًا.","en":"One's foothold in Islam is not firm unless it is based on submission and surrender. Anyone who desires to know things which are beyond his capacity to know, and whose intellect is not content with submission, will find that his desire veils him from the pure oneness of Allah, clear knowledge, and correct faith. He will then waver between disbelief and belief, confirmation and denial, acceptance and rejection. He will be lost, wandering, deviant, and doubtful, being neither a confirming believer nor a denying rejector.","note":""},{"id":"t28","ar":"وَلَا يَصِحُّ الْإِيمَانُ بِالرُّؤْيَةِ لِأَهْلِ دَارِ السَّلَامِ لِمَنِ اعْتَبَرَهَا مِنْهُمْ بِوَهْمٍ، أَوْ تَأَوَّلَهَا بِفَهْمٍ، إِذَا كَانَ تَأْوِيلُ الرُّؤْيَةِ وَتَأْوِيلُ كُلِّ مَعْنًى يُضَافُ إِلَى الرُّبُوبِيَّةِ بِتَرْكِ التَّأْوِيلِ وَلُزُومِ التَّسْلِيمِ، وَعَلَيْهِ دِينُ الْمُسْلِمِينَ.","en":"Belief in the vision of Allah for the people of the Abode of Peace is not correct for one who understands it through his own imagination or interprets it with his own understanding, since the interpretation of the vision, and of every meaning related to Lordship, is by abandoning interpretation and adhering to submission. This is the religion of the Muslims.","note":""},{"id":"t29","ar":"وَمَنْ لَمْ يَتَوَقَّ النَّفْيَ وَالتَّشْبِيهَ زَلَّ وَلَمْ يُصِبِ التَّنْزِيهَ، فَإِنَّ رَبَّنَا جَلَّ وَعَلَا مَوْصُوفٌ بِصِفَاتِ الْوَحْدَانِيَّةِ، مَنْعُوتٌ بِنُعُوتِ الْفَرْدَانِيَّةِ، لَيْسَ فِي مَعْنَاهُ أَحَدٌ مِنَ الْبَرِيَّةِ.","en":"Anyone who does not guard himself against negation and anthropomorphism has erred and has not attained transcendence. For our Lord, the Glorified and Exalted, is described with the attributes of oneness, qualified with the qualities of uniqueness. No one from creation is in His meaning.","note":""},{"id":"t30","ar":"وَتَعَالَى عَنِ الْحُدُودِ وَالْغَايَاتِ، وَالْأَرْكَانِ وَالْأَعْضَاءِ وَالْأَدَوَاتِ، لَا تَحْوِيهِ الْجِهَاتُ السِّتُّ كَسَائِرِ الْمُبْتَدَعَاتِ.","en":"He is exalted beyond having limits, ends, components, limbs, or instruments. The six directions do not contain Him as they do all created things.","note":""},{"id":"t31","ar":"الإيمان بالإسراء والمعراج","en":"Faith in the Night Journey and Ascension","note":""},{"id":"t32","ar":"وَالْمِعْرَاجُ حَقٌّ، وَقَدْ أُسْرِيَ بِالنَّبِيِّ ﷺ، وَعُرِجَ بِشَخْصِهِ فِي الْيَقَظَةِ إِلَى السَّمَاءِ، ثُمَّ إِلَى حَيْثُ شَاءَ اللهُ مِنَ الْعُلَا، وَأَكْرَمَهُ اللهُ بِمَا شَاءَ، وَأَوْحَى إِلَيْهِ مَا أَوْحَى، (مَا كَذَبَ الْفُؤَادُ مَا رَأَى) فَصَلَّى اللهُ عَلَيْهِ وَسَلَّمَ فِي الْآخِرَةِ وَالْأُولَى.","en":"The Mi'raj (Ascension) is true. The Prophet ﷺ was taken by night and ascended in his bodily form, while awake, to the heavens, and then to whatever heights Allah willed for him. Allah ennobled him with what He willed and revealed to him what He revealed. 'The heart did not lie in what it saw.' (Qur'an 53:11). So may Allah's peace and blessings be upon him in this life and the next.","note":""},{"id":"t33","ar":"الإيمان بالحوض والشفاعة والميثاق","en":"Faith in the Basin, Intercession, and Covenant","note":""},{"id":"t34","ar":"وَالْحَوْضُ الَّذِي أَكْرَمَهُ اللهُ تَعَالَى بِهِ غِيَاثًا لِأُمَّتِهِ حَقٌّ.","en":"The Basin (al-Hawd), with which Allah has honored him as a relief for his community, is true.","note":""},{"id":"t35","ar":"وَالشَّفَاعَةُ الَّتِي ادَّخَرَهَا لَهُمْ حَقٌّ، كَمَا رُوِيَ فِي الْأَخْبَارِ.","en":"The Intercession (al-Shafa'ah), which he has stored up for them, is true, as is related in the reports.","note":""},{"id":"t36","ar":"وَالْمِيثَاقُ الَّذِي أَخَذَهُ اللهُ تَعَالَى مِنْ آدَمَ وَذُرِّيَّتِهِ حَقٌّ.","en":"The Covenant (al-Mithaq) which Allah took from Adam and his descendants is true.","note":""},{"id":"t37","ar":"الإيمان بالقضاء والقدر","en":"Faith in Divine Decree","note":""},{"id":"t38","ar":"وَقَدْ عَلِمَ اللهُ تَعَالَى فِيمَا لَمْ يَزَلْ عَدَدَ مَنْ يَدْخُلُ الْجَنَّةَ، وَعَدَدَ مَنْ يَدْخُلُ النَّارَ جُمْلَةً وَاحِدَةً، فَلَا يُزَادُ فِي ذَلِكَ الْعَدَدِ وَلَا يُنْقَصُ مِنْهُ، وَكَذَلِكَ أَفْعَالُهُمْ فِيمَا عَلِمَ مِنْهُمْ أَنْ يَفْعَلُوهُ، وَكُلٌّ مُيَسَّرٌ لِمَا خُلِقَ لَهُ.","en":"Allah has known, from eternity, the number of those who will enter Paradise and the number of those who will enter Hellfire, all at once. This number will neither be increased nor decreased. The same applies to their actions, which He knew they would perform. Everyone is facilitated towards that for which they were created.","note":""},{"id":"t39","ar":"وَالْأَعْمَالُ بِالْخَوَاتِيمِ، وَالسَّعِيدُ مَنْ سَعِدَ بِقَضَاءِ اللهِ، وَالشَّقِيُّ مَنْ شَقِيَ بِقَضَاءِ اللهِ.","en":"Actions are judged by their final deeds. The fortunate is he who is fortunate by Allah's decree, and the wretched is he who is wretched by Allah's decree.","note":""},{"id":"t40","ar":"وَأَصْلُ الْقَدَرِ سِرُّ اللهِ تَعَالَى فِي خَلْقِهِ، لَمْ يَطَّلِعْ عَلَى ذَلِكَ مَلَكٌ مُقَرَّبٌ وَلَا نَبِيٌّ مُرْسَلٌ، وَالتَّعَمُّقُ وَالنَّظَرُ فِي ذَلِكَ ذَرِيعَةُ الْخِذْلَانِ، وَسُلَّمُ الْحِرْمَانِ، وَدَرَجَةُ الطُّغْيَانِ، فَالْحَذَرَ كُلَّ الْحَذَرِ مِنْ ذَلِكَ نَظَرًا وَفِكْرًا وَوَسْوَسَةً، فَإِنَّ اللهَ تَعَالَى طَوَى عِلْمَ الْقَدَرِ عَنْ أَنَامِهِ، وَنَهَاهُمْ عَنْ مَرَامِهِ، كَمَا قَالَ اللهُ تَعَالَى فِي كِتَابِهِ: (لَا يُسْأَلُ عَمَّا يَفْعَلُ وَهُمْ يُسْأَلُونَ) فَمَنْ سَأَلَ: لِمَ فَعَلَ؟ فَقَدْ رَدَّ حُكْمَ الْكِتَابِ، وَمَنْ رَدَّ حُكْمَ الْكِتَابِ كَانَ مِنَ الْكَافِرِينَ.","en":"The exact nature of the divine decree (al-Qadar) is a secret of Allah in His creation, which no angel brought near nor any prophet sent has been given access to. Delving into it and reflecting upon it is a means of failure, a ladder to deprivation, and a step towards transgression. So beware, all beware, of that, whether in thought, reflection, or insinuation. For Allah has concealed the knowledge of the decree from His creatures and has forbidden them from seeking it, as He says in His Book: 'He is not asked about what He does, but they will be asked.' (Qur'an 21:23). So whoever asks, 'Why did He do that?' has rejected a judgment of the Book, and whoever rejects a judgment of the Book is among the disbelievers.","note":""},{"id":"t41","ar":"فَهَذَا جُمْلَةُ مَا يَحْتَاجُ إِلَيْهِ مَنْ هُوَ مُنَوَّرٌ قَلْبُهُ مِنْ أَوْلِيَاءِ اللهِ تَعَالَى، وَهِيَ دَرَجَةُ الرَّاسِخِينَ فِي الْعِلْمِ؛ لِأَنَّ الْعِلْمَ عِلْمَانِ: عِلْمٌ فِي الْخَلْقِ مَوْجُودٌ، وَعِلْمٌ فِي الْخَلْقِ مَفْقُودٌ، فَإِنْكَارُ الْعِلْمِ الْمَوْجُودِ كُفْرٌ، وَادِّعَاءُ الْعِلْمِ الْمَفْقُودِ كُفْرٌ، وَلَا يَثْبُتُ الْإِيمَانُ إِلَّا بِقَبُولِ الْعِلْمِ الْمَوْجُودِ وَتَرْكِ طَلَبِ الْعِلْمِ الْمَفْقُودِ.","en":"This is the sum of what is needed by one whose heart is illuminated from the Friends of Allah, and it is the level of those firmly rooted in knowledge. For knowledge is of two types: knowledge which is accessible to creation, and knowledge which is inaccessible to creation. To deny the accessible knowledge is disbelief, and to claim the inaccessible knowledge is disbelief. Faith is not firm except by accepting the accessible knowledge and abandoning the search for the inaccessible knowledge.","note":""},{"id":"t42","ar":"وَنُؤْمِنُ بِاللَّوْحِ وَالْقَلَمِ، وَبِجَمِيعِ مَا فِيهِ قَدْ رُقِمَ، فَلَوِ اجْتَمَعَ الْخَلْقُ كُلُّهُمْ عَلَى شَيْءٍ كَتَبَهُ اللهُ تَعَالَى فِيهِ أَنَّهُ كَائِنٌ لِيَجْعَلُوهُ غَيْرَ كَائِنٍ لَمْ يَقْدِرُوا عَلَيْهِ، وَلَوِ اجْتَمَعُوا كُلُّهُمْ عَلَى شَيْءٍ لَمْ يَكْتُبْهُ اللهُ تَعَالَى فِيهِ لِيَجْعَلُوهُ كَائِنًا لَمْ يَقْدِرُوا عَلَيْهِ، جَفَّ الْقَلَمُ بِمَا هُوَ كَائِنٌ إِلَى يَوْمِ الْقِيَامَةِ، وَمَا أَخْطَأَ الْعَبْدَ لَمْ يَكُنْ لِيُصِيبَهُ، وَمَا أَصَابَهُ لَمْ يَكُنْ لِيُخْطِئَهُ.","en":"We believe in the Preserved Tablet (al-Lawh) and the Pen (al-Qalam) and in everything that has been inscribed upon it. If all of creation were to gather together to make something exist which Allah had written on it would not exist, they would not be able to do so. And if they were all to gather together to make something not exist which Allah had written on it would exist, they would not be able to do so. The Pen has dried, having written all that will be until the Day of Judgment. What has missed a servant was never going to befall him, and what has befallen him was never going to miss him.","note":""},{"id":"t43","ar":"وَعَلَى الْعَبْدِ أَنْ يَعْلَمَ أَنَّ اللهَ قَدْ سَبَقَ عِلْمُهُ فِي كُلِّ كَائِنٍ مِنْ خَلْقِهِ، فَقَدَّرَ ذَلِكَ تَقْدِيرًا مُحْكَمًا مُبْرَمًا، لَيْسَ فِيهِ نَاقِضٌ وَلَا مُعَقِّبٌ، وَلَا مُزِيلٌ وَلَا مُغَيِّرٌ، وَلَا نَاقِصٌ وَلَا زَائِدٌ مِنْ خَلْقِهِ فِي سَمَاوَاتِهِ وَأَرْضِهِ، وَذَلِكَ مِنْ عَقْدِ الْإِيمَانِ وَأُصُولِ الْمَعْرِفَةِ، وَالِاعْتِرَافِ بِتَوْحِيدِ اللهِ تَعَالَى وَرُبُوبِيَّتِهِ، كَمَا قَالَ تَعَالَى فِي كِتَابِهِ: (وَخَلَقَ كُلَّ شَيْءٍ فَقَدَّرَهُ تَقْدِيرًا)، وَقَالَ تَعَالَى: (وَكَانَ أَمْرُ اللهِ قَدَرًا مَقْدُورًا) فَوَيْلٌ لِمَنْ صَارَ للهِ تَعَالَى فِي الْقَدَرِ خَصِيمًا، وَأَحْضَرَ لِلنَّظَرِ فِيهِ قَلْبًا سَقِيمًا، لَقَدِ الْتَمَسَ بِوَهْمِهِ فِي مَحْضِ الْغَيْبِ سِرًّا كَتِيمًا، وَعَادَ بِمَا قَالَ فِيهِ أَفَّاكًا أَثِيمًا.","en":"The servant must know that Allah's knowledge has preceded everything that exists in His creation. He has determined it with a firm and binding decree which none can contradict, defer, remove, change, decrease, or increase in any way in His creation, in His heavens and His earth. This is a fundamental aspect of faith, a principle of knowledge, and an admission of Allah's oneness and Lordship, as He says in His Book: 'He created everything and determined it with a precise determination.' (Qur'an 25:2) And He said: 'And the command of Allah is a decree determined.' (Qur'an 33:38). So woe to him who becomes an antagonist to Allah concerning the decree, and who brings a sick heart to reflect on it. In his vain imagination, he has sought to uncover a hidden secret in the unseen, and he has returned with what he said about it as a sinful liar.","note":""},{"id":"t44","ar":"الإيمان بالعرش والكرسي","en":"Faith in the Throne and the Footstool","note":""},{"id":"t45","ar":"وَالْعَرْشُ وَالْكُرْسِيُّ حَقٌّ، وَهُوَ مُسْتَغْنٍ عَنِ الْعَرْشِ وَمَا دُونَهُ، مُحِيطٌ بِكُلِّ شَيْءٍ وَفَوْقَهُ، وَقَدْ أَعْجَزَ عَنِ الْإِحَاطَةِ خَلْقَهُ.","en":"The Throne (al-'Arsh) and the Footstool (al-Kursi) are true. He is independent of the Throne and what is beneath it. He encompasses all things and is above them, and He has made His creation incapable of encompassing Him.","note":""},{"id":"t46","ar":"الإيمان بالملائكة والنبيين والكتب","en":"Faith in the Angels, Prophets, and Books","note":""},{"id":"t47","ar":"وَنَقُولُ إِنَّ اللهَ اتَّخَذَ إِبْرَاهِيمَ خَلِيلًا، وَكَلَّمَ اللهُ مُوسَى تَكْلِيمًا، إِيمَانًا وَتَصْدِيقًا وَتَسْلِيمًا.","en":"We say that Allah took Abraham as an intimate friend and that He spoke to Moses directly—believing, affirming, and submitting.","note":""},{"id":"t48","ar":"وَنُؤْمِنُ بِالْمَلَائِكَةِ وَالنَّبِيِّينَ وَالْكُتُبِ الْمُنَزَّلَةِ عَلَى الْمُرْسَلِينَ، وَنَشْهَدُ أَنَّهُمْ كَانُوا عَلَى الْحَقِّ الْمُبِينِ.","en":"We believe in the angels, the prophets, and the books revealed to the messengers, and we bear witness that they were all on the clear truth.","note":""},{"id":"t49","ar":"تعريف الإيمان","en":"The Definition of Faith","note":""},{"id":"t50","ar":"وَنُسَمِّي أَهْلَ قِبْلَتِنَا مُسْلِمِينَ مُؤْمِنِينَ، مَا دَامُوا بِمَا جَاءَ بِهِ النَّبِيُّ ﷺ مُعْتَرِفِينَ، وَلَهُ بِكُلِّ مَا قَالَهُ وَأَخْبَرَ مُصَدِّقِينَ.","en":"We call the people of our Qiblah 'Muslims' and 'believers' as long as they acknowledge what the Prophet ﷺ brought, and accept as true everything that he said and told us.","note":""},{"id":"t51","ar":"وَلَا نَخُوضُ فِي اللهِ، وَلَا نُمَارِي فِي دِينِ اللهِ، وَلَا نُجَادِلُ فِي الْقُرْآنِ، وَنَشْهَدُ أَنَّهُ كَلَامُ رَبِّ الْعَالَمِينَ، نَزَلَ بِهِ الرُّوحُ الْأَمِينُ، فَعَلَّمَهُ سَيِّدَ الْمُرْسَلِينَ، مُحَمَّدًا ﷺ، وَهُوَ كَلَامُ اللهِ تَعَالَى لَا يُسَاوِيهِ شَيْءٌ مِنْ كَلَامِ الْمَخْلُوقِينَ، وَلَا نَقُولُ بِخَلْقِهِ، وَلَا نُخَالِفُ جَمَاعَةَ الْمُسْلِمِينَ.","en":"We do not delve into futile discourse about Allah, nor do we dispute about the religion of Allah. We do not argue about the Qur'an and we bear witness that it is the speech of the Lord of the Worlds, which the Trustworthy Spirit brought down and taught to the Master of the Messengers, Muhammad ﷺ. It is the speech of Allah Almighty; no speech of creation is equal to it. We do not say it is created, and we do not oppose the Muslim community.","note":""},{"id":"t52","ar":"وَلَا نُكَفِّرُ أَحَدًا مِنْ أَهْلِ الْقِبْلَةِ بِذَنْبٍ مَا لَمْ يَسْتَحِلَّهُ، وَلَا نَقُولُ: لَا يَضُرُّ مَعَ الْإِيمَانِ ذَنْبٌ لِمَنْ عَمِلَهُ، نَرْجُو لِلْمُحْسِنِينَ مِنَ الْمُؤْمِنِينَ أَنْ يَعْفُوَ عَنْهُمْ، وَيُدْخِلَهُمُ الْجَنَّةَ بِرَحْمَتِهِ، وَلَا نَأْمَنُ عَلَيْهِمْ، وَلَا نَشْهَدُ لَهُمْ بِالْجَنَّةِ، وَنَسْتَغْفِرُ لِمُسِيئِهِمْ، وَنَخَافُ عَلَيْهِمْ وَلَا نُقَنِّطُهُمْ.","en":"We do not declare anyone from the people of the Qiblah a disbeliever for any sin, as long as he does not consider it lawful. Nor do we say that sin does not harm the faith of the one who commits it. We hope that Allah will pardon the righteous among the believers and admit them into Paradise through His mercy, but we cannot be certain of this, nor can we testify that they will be in Paradise. We ask forgiveness for the sinful among them, and we fear for them, but we do not cause them to despair.","note":""},{"id":"t53","ar":"وَالْأَمْنُ وَالْإِيَاسُ يَنْقُلَانِ عَنْ مِلَّةِ الْإِسْلَامِ، وَسَبِيلُ الْحَقِّ بَيْنَهُمَا لِأَهْلِ الْقِبْلَةِ.","en":"Certainty (of salvation) and despair (of mercy) both remove one from the fold of Islam. The path of truth for the people of the Qiblah lies between the two.","note":""},{"id":"t54","ar":"وَلَا يَخْرُجُ الْعَبْدُ مِنَ الْإِيمَانِ إِلَّا بِجُحُودِ مَا أَدْخَلَهُ فِيهِ.","en":"A servant does not leave faith except by repudiating what brought him into it.","note":""},{"id":"t55","ar":"وَالْإِيمَانُ: هُوَ الْإِقْرَارُ بِاللِّسَانِ، وَالتَّصْدِيقُ بِالْجِنَانِ.","en":"Faith is: affirmation with the tongue and acceptance in the heart.","note":""},{"id":"t56","ar":"وَجَمِيعُ مَا صَحَّ عَنْ رَسُولِ اللهِ ﷺ مِنَ الشَّرْعِ وَالْبَيَانِ كُلُّهُ حَقٌّ.","en":"And everything that is authentically narrated from the Messenger of Allah ﷺ concerning the Sacred Law and its explanation is true.","note":""},{"id":"t57","ar":"وَالْإِيمَانُ وَاحِدٌ، وَأَهْلُهُ فِي أَصْلِهِ سَوَاءٌ، وَالتَّفَاضُلُ بَيْنَهُمْ بِالْخَشْيَةِ وَالتُّقَى، وَمُخَالَفَةِ الْهَوَى، وَمُلَازَمَةِ الْأَوْلَى.","en":"Faith is one, and its people, in its essence, are equal. The preference among them is based on fear of Allah, piety, opposition to whims, and adherence to what is best.","note":""},{"id":"t58","ar":"وَالْمُؤْمِنُونَ كُلُّهُمْ أَوْلِيَاءُ الرَّحْمَنِ، وَأَكْرَمُهُمْ عِنْدَ اللهِ أَطْوَعُهُمْ وَأَتْبَعُهُمْ لِلْقُرْآنِ.","en":"All the believers are Friends (Awliya') of the Most Merciful. The noblest of them in the sight of Allah are those who are most obedient and who most closely follow the Qur'an.","note":""},{"id":"t59","ar":"وَالْإِيمَانُ: هُوَ الْإِيمَانُ بِاللهِ، وَمَلَائِكَتِهِ، وَكُتُبِهِ، وَرُسُلِهِ، وَالْيَوْمِ الْآخِرِ، وَالْقَدَرِ خَيْرِهِ وَشَرِّهِ، وَحُلْوِهِ وَمَرِّهِ مِنَ اللهِ تَعَالَى.","en":"Faith consists of belief in Allah, His Angels, His Books, His Messengers, the Last Day, and in the Divine Decree, both its good and its evil, its sweet and its bitter, being from Allah Almighty.","note":""},{"id":"t60","ar":"وَنَحْنُ مُؤْمِنُونَ بِذَلِكَ كُلِّهِ، لَا نُفَرِّقُ بَيْنَ أَحَدٍ مِنْ رُسُلِهِ، وَنُصَدِّقُهُمْ كُلَّهُمْ عَلَى مَا جَاءُوا بِهِ.","en":"We are believers in all of that. We do not differentiate between any of His Messengers. We believe in all of them and what they brought.","note":""},{"id":"t61","ar":"أهل الكبائر","en":"Major Sinners","note":""},{"id":"t62","ar":"وَأَهْلُ الْكَبَائِرِ مِنْ أُمَّةِ مُحَمَّدٍ ﷺ فِي النَّارِ لَا يُخَلَّدُونَ، إِذَا مَاتُوا وَهُمْ مُوَحِّدُونَ، وَإِنْ لَمْ يَكُونُوا تَائِبِينَ، بَعْدَ أَنْ لَقُوا اللهَ عَارِفِينَ مُؤْمِنِينَ.","en":"Those who have committed major sins from the nation of Muhammad ﷺ will not remain eternally in the Fire, provided they die as monotheists, even if they were not repentant, as long as they met Allah knowing Him and believing in Him.","note":""},{"id":"t63","ar":"وَهُمْ فِي مَشِيئَتِهِ وَحُكْمِهِ: إِنْ شَاءَ غَفَرَ لَهُمْ وَعَفَا عَنْهُمْ بِفَضْلِهِ، كَمَا ذَكَرَ عَزَّ وَجَلَّ فِي كِتَابِهِ: (وَيَغْفِرُ مَا دُونَ ذَلِكَ لِمَنْ يَشَاءُ).","en":"They are subject to His will and His judgment: if He wills, He forgives them and pardons them out of His grace, as He mentioned in His Book: '...and He forgives what is less than that for whom He wills.' (Qur'an 4:48).","note":""},{"id":"t64","ar":"وَإِنْ شَاءَ عَذَّبَهُمْ فِي النَّارِ بِعَدْلِهِ، ثُمَّ يُخْرِجُهُمْ مِنْهَا بِرَحْمَتِهِ، وَشَفَاعَةِ الشَّافِعِينَ مِنْ أَهْلِ طَاعَتِهِ، ثُمَّ يَبْعَثُهُمْ إِلَى جَنَّتِهِ، وَذَلِكَ بِأَنَّ اللهَ تَعَالَى تَوَلَّى أَهْلَ مَعْرِفَتِهِ، وَلَمْ يَجْعَلْهُمْ فِي الدَّارَيْنِ كَأَهْلِ نُكْرَتِهِ؛ الَّذِينَ خَابُوا مِنْ هِدَايَتِهِ، وَلَمْ يَنَالُوا مِنْ وَلَايَتِهِ، اللَّهُمَّ يَا وَلِيَّ الْإِسْلَامِ وَأَهْلِهِ ثَبِّتْنَا عَلَى الْإِسْلَامِ حَتَّى نَلْقَاكَ بِهُ.","en":"And if He wills, He punishes them in the Fire out of His justice, then brings them out of it through His mercy and the intercession of the intercessors among the people of His obedience, and then sends them to His Paradise. This is because Allah Almighty is the Protector of those who know Him, and He does not treat them in the two abodes like those who deny Him, who have failed to receive His guidance and have not obtained His protection. O Allah, Protector of Islam and its people, make us firm upon Islam until we meet You with it.","note":""},{"id":"t65","ar":"وَنَرَى الصَّلَاةَ خَلْفَ كُلِّ بَرٍّ وَفَاجِرٍ مِنْ أَهْلِ الْقِبْلَةِ، وَنُصَلِّي عَلَى مَنْ مَاتَ مِنْهُمْ.","en":"We hold that prayer can be performed behind any of the people of the Qiblah, whether righteous or sinful, and we offer the funeral prayer for any of them who die.","note":""},{"id":"t66","ar":"وَلَا نُنْزِلُ أَحَدًا مِنْهُمْ جَنَّةً وَلَا نَارًا، وَلَا نَشْهَدُ عَلَيْهِمْ بِكُفْرٍ وَلَا بِشِرْكٍ وَلَا بِنِفَاقٍ، مَا لَمْ يَظْهَرْ مِنْهُمْ شَيْءٌ مِنْ ذَلِكَ، وَنَذَرُ سَرَائِرَهُمْ إِلَى اللهِ تَعَالَى.","en":"We do not consign any of them to Paradise or Hellfire, nor do we testify against them with disbelief, polytheism, or hypocrisy, as long as nothing of that is apparent from them. We leave their secret affairs to Allah Almighty.","note":""},{"id":"t67","ar":"وَلَا نَرَى السَّيْفَ عَلَى أَحَدٍ مِنْ أُمَّةِ مُحَمَّدٍ ﷺ إِلَّا مَنْ وَجَبَ عَلَيْهِ السَّيْفُ.","en":"We do not believe in raising the sword against anyone from the nation of Muhammad ﷺ unless the sword is legally obligated against him.","note":""},{"id":"t68","ar":"الأئمة والجماعة","en":"Rulers and the Community","note":""},{"id":"t69","ar":"وَلَا نَرَى الْخُرُوجَ عَلَى أَئِمَّتِنَا وَوُلَاةِ أُمُورِنَا وَإِنْ جَارُوا، وَلَا نَدْعُو عَلَيْهِمْ وَلَا نَنْزِعُ يَدًا مِنْ طَاعَتِهِمْ، وَنَرَى طَاعَتَهُمْ مِنْ طَاعَةِ اللهِ عَزَّ وَجَلَّ فَرِيضَةً، مَا لَمْ يَأْمُرُوا بِمَعْصِيَةٍ، وَنَدْعُو لَهُمْ بِالصَّلَاحِ وَالْمُعَافَاةِ.","en":"We do not see rebellion against our leaders and rulers, even if they are tyrannical. We do not pray against them, nor do we withdraw from obeying them. We see their obedience as an obligation from the obedience of Allah, the Exalted, as long as they do not command a sin. We pray for their righteousness and well-being.","note":""},{"id":"t70","ar":"وَنَتَّبِعُ السُّنَّةَ وَالْجَمَاعَةَ، وَنَجْتَنِبُ الشُّذُوذَ وَالْخِلَافَ وَالْفُرْقَةَ.","en":"We follow the Sunnah and the Community (al-Jama'ah), and we avoid deviancy, discord, and division.","note":""},{"id":"t71","ar":"وَنُحِبُّ أَهْلَ الْعَدْلِ وَالْأَمَانَةِ، وَنُبْغِضُ أَهْلَ الْجَوْرِ وَالْخِيَانَةِ.","en":"We love the people of justice and honesty, and we detest the people of tyranny and treachery.","note":""},{"id":"t72","ar":"وَنَقُولُ: اللهُ أَعْلَمُ فِيمَا اشْتَبَهَ عَلَيْنَا عِلْمُهُ.","en":"We say, 'Allah knows best,' regarding matters of which our knowledge is unclear.","note":""},{"id":"t73","ar":"وَنَرَى الْمَسْحَ عَلَى الْخُفَّيْنِ فِي السَّفَرِ وَالْحَضَرِ، كَمَا جَاءَ فِي الْأَثَرِ.","en":"We believe in wiping over leather socks, whether on a journey or at home, as has come in the narrations.","note":""},{"id":"t74","ar":"الحج والجهاد","en":"Hajj and Jihad","note":""},{"id":"t75","ar":"وَالْحَجُّ وَالْجِهَادُ مَاضِيَانِ مَعَ أُولِي الْأَمْرِ مِنَ الْمُسْلِمِينَ، بَرِّهِمْ وَفَاجِرِهِمْ إِلَى قِيَامِ السَّاعَةِ، لَا يُبْطِلُهُمَا شَيْءٌ وَلَا يَنْقُضُهُمَا.","en":"The Hajj and Jihad will continue under the leadership of
