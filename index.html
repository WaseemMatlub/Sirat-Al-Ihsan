wrong direction during prayer?","a":"They turn toward the correct direction and continue their prayer."}]},{"title":"Wajibat and sunnahs of prayer","cards":[{"id":"n395","q":"Does exposing part of an ‘awrah limb invalidate the prayer?","a":"Exposing one-quarter of an ‘awrah limb invalidates the prayer."},{"id":"n396","q":"What are the 18 Wajibaat of Prayer?","a":"There\nare eighteen wājib acts:\n\nReciting the Fātiḥah.\n\nAdding a Sūrah or three verses (in two non-specified cycles\n\tof Farḍ, all cycles of Witr, and Nafl).\n\nReciting in the first two cycles.\n\nPlacing Fātiḥah before the Sūrah.\n\nPlacing the nose on the ground during prostration.\n\nThe second prostration in every cycle.\n\nComposure (iṭmi’nān) in pillars.\n\nThe first sitting.\n\nReciting Tashahhud in the first sitting (according to\n\tthe ṣaḥīḥ opinion).\n\nReciting Tashahhud in the final sitting.\n\nStanding to the third cycle without delay after Tashahhud.\n\nThe specific word \"Salām\" (excluding \"‘alaykum\").\n\nQunūt in Witr.\n\nEid Takbīrs.\n\nThe opening Takbīr for every prayer.\n\nThe bowing Takbīr in the second cycle of Eid.\n\nAudible recitation (Jahr) by the Imam: Fajr, the first\n\ttwo cycles of ‘Isha (even if qaḍā’), Friday, Eid,\n\tTaraweeh, and Witr in Ramadan.\n\nSilent recitation (Isrār): Zuhr, ‘Asr, the last\n\tcycles of ‘Isha, and daytime Nafl. (An individual has the\n\tchoice to recite audibly or silently)."},{"id":"n397","q":"In which prayers is it wājib to add a Sūrah or three verses?","a":"In the first two cycles of Farḍ, all cycles of Witr, and all cycles of Nafl."},{"id":"n398","q":"Is iṭmi’nān (composure) in the pillars of prayer wājib?","a":"Yes."},{"id":"n399","q":"Which two sittings require the recitation of Tashahhud?","a":"Both the first sitting and the final sitting."},{"id":"n400","q":"What is the ruling on the word \"Salām\" used to end the prayer?","a":"The specific word \"Salām\" is wājib (excluding the word \"‘alaykum\")."},{"id":"n401","q":"In which prayers is audible recitation (Jahr) by the Imam wājib?","a":"Fajr, the first two cycles of ‘Isha, Friday, Eid, Taraweeh, and Witr in Ramadan."},{"id":"n402","q":"What is the ruling for recitation in Zuhr, ‘Asr, the last cycles of ‘Isha, and daytime Nafl?","a":"It must be silent (Isrār)."},{"id":"n403","q":"What is the rule for an individual (praying alone) regarding audible or silent recitation?","a":"The individual has the choice to recite audibly or silently."},{"id":"n404","q":"If a Sūrah is omitted in the first two cycles of ‘Isha, what should be done?","a":"It should be recited in the final two cycles."},{"id":"n405","q":"If the Fātiḥah is omitted in the first two cycles of ‘Isha, is it repeated in the final two?","a":"No."},{"id":"n406","q":"What are the 51 Sunnah acts in prayer?","a":"There\nare fifty-one Sunnah acts in prayer:\n\nRaising hands for the opening Takbīr level with the\n\tears (men/female slaves).\n\nLevel with the shoulders for free women.\n\nSpreading the fingers while raising hands.\n\nSynchronizing the follower’s opening Takbīr with\n\tthe Imam’s.\n\nPlacing the right hand over the left below the navel\n\tfor men. (Method: Palm of the right hand on the back of the left,\n\tgrasping the wrist with the thumb and pinky).\n\nPlacing hands on the chest for women without grasping.\n\nThe Opening Invocation (Thanā’).\n\nSeeking refuge (Ta‘awwudh) before recitation.\n\nThe Basmalah at the start of every cycle.\n\nSaying \"Āmīn\" after Fātiḥah.\n\nPraising Allah (Taḥmīd) after rising.\n\nReciting these silently.\n\nStanding straight at the opening Takbīr without\n\tbowing the head.\n\nThe Imam reciting Takbīr and Taḥmīd audibly.\n\nSpreading feet during standing by the width of four\n\tfingers.\n\nSelecting Sūrahs: Long chapters (Ṭiwāl\n\tal-Mufaṣṣal) for Fajr/Zuhr; medium (Awsaṭ) for\n\t‘Asr/‘Isha; short (Qiṣār) for Maghrib (for residents;\n\ttravelers may choose any).\n\nProlonging the first cycle specifically in Fajr.\n\nThe Takbīr for bowing.\n\nGlorifying Allah (Tasbīḥ) three\n\ttimes while bowing.\n\nGrasping the knees with the hands while bowing.\n\nSpreading fingers while bowing (women do not).\n\nKeeping legs straight while bowing.\n\nKeeping the back flat while bowing.\n\nKeeping the head level with the buttocks while bowing.\n\nRising from bowing.\n\nStanding with composure after rising.\n\nPlacement sequence for prostration: Knees, then hands,\n\tthen face.\n\nReversing the sequence when rising.\n\nTakbīr for prostration.\n\nTakbīr when rising.\n\nProstrating between the palms.\n\nTasbīḥ three times while prostrating.\n\nDistancing for men: Belly from thighs, elbows from\n\tsides, forearms from the ground.\n\nCompactness for women: Lowering herself and pressing\n\tthe belly to the thighs.\n\nThe brief pause after prostration (Qawmah).\n\nSitting between two prostrations.\n\nHand placement between prostrations similar to\n\tTashahhud.\n\nSitting posture: Spreading the left foot flat and\n\tholding the right foot upright.\n\nThe Tawarruk posture for women.\n\nPointing the index finger during the testimony\n\t(Tashahhud): raising it upon negation, lowering it upon\n\taffirmation.\n\nReciting Fātiḥah in cycles beyond the first two.\n\nInvoking blessings upon the Prophet (peace be upon him)\n\tin the final sitting.\n\nSupplicating with language resembling the\n\tQur’an/Sunnah, not human speech.\n\nTurning the head right then left for the two Salāms.\n\nIntentions of the Imam: Intending the men, the\n\tRecording Angels, and the righteous Jinn (according to the most\n\tauthentic opinion).\n\nIntentions of the Follower: Intending the Imam, the\n\tRecording Angels, and righteous Jinn.\n\nIntentions of the Individual: Intending only the\n\tangels.\n\nLowering the voice of the second Salām relative to\n\tthe first.\n\nSynchronizing Salām with the Imam’s Salām.\n\nBeginning the Salām on the right side.\n\nWait for the Imam before the late-comer (Masbūq)\n\tcompletes their missed cycles."},{"id":"n407","q":"How should men raise their hands for the opening Takbīr?","a":"Level with the ears."},{"id":"n408","q":"How should free women raise their hands for the opening Takbīr?","a":"Level with the shoulders."},{"id":"n409","q":"Where should men place their hands while standing in prayer?","a":"Over the left, below the navel (right palm on the back of the left, grasping with thumb and pinky)."},{"id":"n410","q":"How should women place their hands while standing?","a":"On the chest, without grasping."},{"id":"n411","q":"What should be recited before the recitation of the Fātiḥah?","a":"The opening invocation (Thanā’), seeking refuge (Ta‘awwudh), and the Basmalah."},{"id":"n412","q":"What is the recommended length of Sūrahs for Fajr and Zuhr?","a":"Long chapters (Ṭiwāl al-Mufaṣṣal)."},{"id":"n413","q":"What is the recommended length of Sūrahs for ‘Asr and ‘Isha?","a":"Medium chapters (Awsaṭ)."},{"id":"n414","q":"What is the recommended length of Sūrahs for Maghrib?","a":"Short chapters (Qiṣār)."},{"id":"n415","q":"How many times should one say Tasbīḥ while bowing or prostrating?","a":"Three times."},{"id":"n416","q":"What is the physical difference between men and women when bowing?","a":"Men spread their fingers; women do not."},{"id":"n417","q":"What is the sequence for placing limbs on the ground for prostration?","a":"Knees, then hands, then face."},{"id":"n418","q":"How should a man position his body during prostration?","a":"He should keep his belly away from his thighs, elbows away from his sides, and forearms off the ground."},{"id":"n419","q":"How should a woman position her body during prostration?","a":"She should be compact, lowering herself and pressing the belly to the thighs."},{"id":"n420","q":"What is the Tawarruk posture and who performs it?","a":"It is a specific sitting posture performed by women."},{"id":"n421","q":"What is the method for pointing the index finger during the Tashahhud?","a":"Raise it upon negation (Lā ilāha) and lower it upon affirmation (illallāh)."},{"id":"n422","q":"Who should the Imam include in his intention when saying the Salām?","a":"The men, the Recording Angels, and the righteous Jinn."},{"id":"n423","q":"Who should the Follower include in his intention when saying the Salām?","a":"The Imam, the Recording Angels, and the righteous Jinn."},{"id":"n424","q":"Who should the Individual praying alone include in his intention when saying the Salām?","a":"Only the angels."},{"id":"n425","q":"What is the recommended volume of the two Salāms?","a":"The second Salām should be lower in voice than the first."},{"id":"n426","q":"In what direction should the Salām begin?","a":"On the right side."},{"id":"n427","q":"What is the etiquette for hands during the opening Takbīr?","a":"To extend them out of the sleeves."},{"id":"n428","q":"Where should one focus their sight while standing?","a":"At the place of prostration."},{"id":"n429","q":"Where should one focus their sight while bowing?","a":"At the back of the feet."},{"id":"n430","q":"Where should one focus their sight while prostrating?","a":"At the tip of the nose."},{"id":"n431","q":"Where should one focus their sight while sitting?","a":"At the lap."},{"id":"n432","q":"Where should one focus their sight while performing Salām?","a":"At the shoulders."},{"id":"n433","q":"What is the etiquette regarding coughing during prayer?","a":"It should be suppressed as much as possible."},{"id":"n434","q":"What should one do when yawning during prayer?","a":"Cover the mouth."},{"id":"n435","q":"When should the congregation rise for prayer?","a":"When the caller says \"Ḥayya ‘ala-l-falāḥ.\""},{"id":"n436","q":"When should the Imam begin the prayer?","a":"As soon as the caller says \"Qad qāmati-ṣ-ṣalāh.\""},{"id":"n437","q":"Is leading the prayer more or less virtuous than performing the Adhan?","a":"It is more virtuous."},{"id":"n438","q":"Is congregational prayer mandatory or Sunnah for free men?","a":"It is Sunnah, unless they have a valid excuse."},{"id":"n439","q":"What are the six conditions for the validity of an Imam leading men?","a":"Islam, puberty, sanity, male gender, ability to recite correctly, and freedom from chronic excuses or defects."}]},{"title":"Imamah and congregation","cards":[{"id":"n440","q":"What are some examples of \"excuses or defects\" that disqualify someone from being an Imam?","a":"Chronic nosebleeds, severe stuttering, lisps, or the loss of a requirement (such as ritual purity or covering the ‘awrah)."},{"id":"n441","q":"What are the 14 conditions for the follower (Muqtadi)?","a":"There\nare fourteen conditions for the follower (Muqtadi):\n\nThe follower must intend to follow the Imam, coinciding with\n\ttheir own opening Takbīr.\n\nA man must intend to lead for his prayer to be valid if he is\n\tleading women.\n\nThe Imam’s heels must be positioned ahead of the follower’s\n\theels.\n\nThe Imam's state must not be inferior to the follower’s.\n\nThe Imam must not be praying a Farḍ (obligatory)\n\tprayer different from the follower's Farḍ.\n\nA resident cannot follow a traveler in a four-cycle prayer\n\tafter the time has expired.\n\nThe Imam cannot be a Masbūq (someone who joined late\n\tand missed cycles).\n\nThere must be no row of women between the Imam and the\n\tfollower.\n\nThere must be no river between them that requires a boat to\n\tcross.\n\nThere must be no road between them used by vehicles or carts.\n\nThere must be no wall that obscures knowledge of the Imam's\n\tmovements (if one can still hear or see the Imam, the following is\n\tvalid).\n\n(Condition 12 is covered by the allowance in condition 11).\n\nThe Imam cannot be mounted on an animal while the follower is\n\ton foot, or mounted on a different animal.\n\nThe Imam cannot be on a ship that is not connected to the\n\tfollower's ship. Note: The follower must not be aware of any\n\tritual invalidator in the Imam, such as bleeding or vomiting, for\n\twhich the Imam has not renewed their purity."},{"id":"n442","q":"What must the follower intend at the start of their prayer?","a":"The intention to follow the Imam, coinciding with their own opening Takbīr."},{"id":"n443","q":"When leading women, what must a man intend?","a":"He must intend to lead for his prayer to be valid."},{"id":"n444","q":"Where must the Imam’s heels be positioned relative to the follower’s?","a":"The Imam’s heels must be ahead of the follower’s heels."},{"id":"n445","q":"Can an Imam pray a different Farḍ prayer than the follower?","a":"No, the Imam must not be praying a Farḍ prayer different from the follower's."},{"id":"n446","q":"What is the rule for a resident following a traveler in a four-cycle prayer after the time has expired?","a":"A resident cannot follow a traveler in this scenario."},{"id":"n447","q":"What are the physical barriers that invalidate following an Imam?","a":"A row of women between them, a river requiring a boat, a road used by vehicles/carts, or a wall that obscures knowledge of the Imam's movements."},{"id":"n448","q":"Is following an Imam valid if a wall is present but the Imam’s movements are still known?","a":"Yes, if the follower can still hear or see the Imam."},{"id":"n449","q":"What is the rule regarding the Imam and follower being mounted?","a":"The Imam cannot be mounted on an animal while the follower is on foot, or mounted on a different animal."},{"id":"n450","q":"What is the rule regarding being on ships?","a":"The Imam cannot be on a ship that is not connected to the follower's ship."},{"id":"n451","q":"What must the follower be unaware of regarding the Imam?","a":"Any ritual invalidator (such as bleeding or vomiting) for which the Imam has not renewed their purity."},{"id":"n452","q":"Is it valid for a person with Wuḍū’ to follow an Imam who performed Tayammum?","a":"Yes."},{"id":"n453","q":"Can a person standing in prayer follow an Imam who is seated?","a":"Yes."},{"id":"n454","q":"Is it valid for someone praying Nafl (supererogatory) to follow an Imam who is praying Farḍ?","a":"Yes."},{"id":"n455","q":"What must the congregation do if they discover the Imam’s prayer was invalid?","a":"They must repeat their prayer."},{"id":"n456","q":"What is the preferred action for the Imam if he discovers his prayer was invalid after leading others?","a":"It is preferred that he informs the congregation so they may repeat their prayers."},{"id":"n457","q":"When is attending the congregrational prayer excused?","a":"Attendance\nat the congregational prayer is excused by eighteen situations:\n\nRain.\n\nExtreme cold.\n\nFear (of harm to self or property).\n\nDarkness.\n\nImprisonment.\n\nBlindness.\n\nHemiplegia.\n\nAmputation of a hand and a foot.\n\nIllness.\n\nInability to stand (due to disability).\n\nMud.\n\nChronic ailment.\n\nOld age.\n\nAttending a study session in a congregation that would be\n\tmissed if attending prayer.\n\nThe presence of food one deeply craves.\n\nThe intent to travel.\n\nCaring for a patient.\n\nIntense wind at night (not during the day).\n\nNote: If one is prevented from attending the congregation due\nto any of these valid excuses, they still receive the reward of the\ncongregation."},{"id":"n458","q":"How many situations provide a valid excuse for missing congregational prayer?","a":"Eighteen."},{"id":"n459","q":"Are physical disabilities like blindness, hemiplegia, or amputation valid excuses?","a":"Yes."},{"id":"n460","q":"Does the weather play a role in valid excuses?","a":"Yes, rain, extreme cold, and intense wind at night (but not during the day) are valid excuses."},{"id":"n461","q":"What is the ruling regarding the reward of the congregation for one who misses it due to a valid excuse?","a":"They still receive the reward of the congregation."},{"id":"n462","q":"Can attending a study session be a valid excuse for missing congregational prayer?","a":"Yes, if it is in a congregation that would be missed by attending prayer."},{"id":"n463","q":"Is the presence of food a valid excuse?","a":"Yes, the presence of food one deeply craves."},{"id":"n464","q":"Does fear count as a valid excuse?","a":"Yes, fear of harm to oneself or property."},{"id":"n465","q":"In the absence of an official authority or host, what is the order of priority for becoming the Imam?","a":"The most knowledgeable, then the best reader of the Qur'an, then the most pious, then the eldest, then the best in character, then the best in appearance, then the noblest in lineage, then the best in voice, and finally the one with the cleanest clothes."},{"id":"n466","q":"What should be done if multiple candidates for Imam are equal in status?","a":"Lots are drawn, or the choice is left to the congregation."},{"id":"n467","q":"What should be done if the potential followers disagree on who should lead?","a":"The choice of the majority is taken."},{"id":"n468","q":"What is the ruling if the congregation appoints someone as Imam who is not the most deserving?","a":"They have acted wrongly."},{"id":"n469","q":"Who are some examples of people it is considered makrūh (disliked) to have as an Imam?","a":"A slave, a blind person, an ignorant Bedouin, a child of adultery, an ignorant person, an openly sinful person (fāsiq), or an innovator in religion."},{"id":"n470","q":"Is it disliked for an Imam to unnecessarily prolong the prayer?","a":"Yes."},{"id":"n471","q":"What is the ruling on a congregation consisting only of naked people?","a":"It is disliked."},{"id":"n472","q":"How should a female Imam stand when leading a congregation of women?","a":"She stands in the middle of the row (with her heels slightly ahead of the others)."},{"id":"n473","q":"Where should a single follower stand in relation to the Imam?","a":"To the right of the Imam."},{"id":"n474","q":"Where should a second follower stand if there is more than one?","a":"They stand behind the Imam."},{"id":"n475","q":"What is the required order for rows in a congregation?","a":"Men, then boys, then hermaphrodites (Khunthā), then women."},{"id":"n476","q":"What should a follower do if the Imam finishes prayer before the follower finishes the Tashahhud?","a":"The follower should complete it."},{"id":"n477","q":"What should a follower do if the Imam rises from bowing or prostration before the follower completes three Tasbīḥs?","a":"The follower must follow the Imam."},{"id":"n478","q":"Should a follower follow the Imam if the Imam adds an extra prostration or stands after the final sitting by mistake?","a":"No, the follower does not follow him in this."},{"id":"n479","q":"If the Imam commits an error and \"secures\" it with a prostration, what should the follower do?","a":"The follower performs the Salām alone."},{"id":"n480","q":"If the Imam mistakenly stands up before the final sitting, what should the follower do?","a":"The follower waits for him."},{"id":"n481","q":"What is the consequence if a follower performs Salām before the Imam \"secures\" a mistake with a prostration?","a":"The follower's obligatory prayer becomes invalid."},{"id":"n482","q":"Is it permissible for a follower to perform Salām after the Imam finishes the Tashahhud but before the Imam says Salām?","a":"It is disliked (makrūh)."},{"id":"n483","q":"Is it permissible to recite prescribed invocations (Awrād) between the obligatory (Farḍ) and Sunnah prayers?","a":"Yes, according to Shams al-A'immah al-Halwani, there is no harm in doing so."},{"id":"n484","q":"What are the recommended physical movements for the Imam after the Salām?","a":"Move to his left to perform the Sunnah and turn to face the congregation."},{"id":"n485","q":"How many times should the Imam ask for Allah's forgiveness after the Salām?","a":"Three times."},{"id":"n486","q":"What specific Qur'anic recitations are recommended after the Salām?","a":"Āyat al-Kursī and the Mu‘awwidhat (Suras 113 and 114)."},{"id":"n487","q":"How many times should Tasbīḥ, Taḥmīd, and Takbīr be recited after prayer?","a":"33 times each."},{"id":"n488","q":"What is the recommended dhikr to recite after the Tasbīḥ, Taḥmīd, and Takbīr?","a":"\"Lā ilāha illā-llāhu waḥdahū lā sharīka lah, lahu-l-mulku wa lahu-l-ḥamdu wa huwa ‘alā kulli shay’in qadīr.\""}]},{"title":"What invalidates prayer","cards":[{"id":"n489","q":"What is the recommended manner for supplicating after the prayer?","a":"The Imam should raise his hands, supplicate for himself and the Muslims, and then wipe his face."},{"id":"n490","q":"What are the things that invalidate prayer?","a":"Speaking: Even if by mistake or accident.\n\nSpeaking: Even if by mistake or accident.\n\nSupplicating with language similar to human speech.\n\nPerforming Salām with the intention of greeting someone, even if by mistake.\n\nReturning a greeting verbally or by shaking hands.\n\nExcessive movement (‘Amal Kathīr).\n\nTurning the chest away from the Qiblah.\n\n[Item number 8 was missing from your source list]\n\nEating anything from outside the mouth, even a small amount.\n\nEating particles between the teeth if they are the size of a chickpea.\n\nDrinking.\n\nClearing the throat without a valid excuse.\n\nUffing (expressing annoyance).\n\nMoaning.\n\nGroaning.\n\nCrying out loud due to pain or tragedy.\n\nCrying out loud due to pain or tragedy.\n\nSaying \"Yarḥamukallāh\" to someone who sneezes.\n\nAnswering an inquiry regarding something with \"Lā ilāha illallāh.\"\n\nResponding to bad news with Istirjā‘ (Inna lillāhi...).\n\nSaying \"Alḥamdulillāh\" upon hearing news.\n\nExpressing surprise with \"Lā ilāha illallāh\" or \"Subḥānallāh.\"\n\nExpressing surprise with \"Lā ilāha illallāh\" or \"Subḥānallāh.\"\n\nSaying anything intended as an answer (e.g., reciting a verse as a response).\n\nSeeing water (for one who is performing Tayammum).\n\nCompletion of the time period for wiping over leather socks (Khuff).\n\nRemoving the socks.\n\nLearning a verse (for an illiterate person while in prayer).\n\nFinding a covering (for one who was praying while naked).\n\nBecoming able to bow and prostrate (for one who was praying by gesture).\n\nRemembering a missed prayer (for one who is obligated to follow the sequence of prayers).\n\nAppointing a deputy who is not qualified to be an Imam.\n\nSunrise during the Dawn (Fajr) prayer.\n\nNoontime (Zawāl) during the Eid prayer.\n\nThe arrival of the ‘Asr time during Friday prayer.\n\nThe falling off of a splint (Jabīrah) after the wound has healed.\n\nThe cessation of the excuse for a person with a chronic condition (Ma‘dhūr).\n\nExperiencing ritual impurity (Ḥadath) intentionally.\n\nExperiencing ritual impurity (Ḥadath) caused by another.\n\nFainting.\n\nInsanity.\n\nMajor impurity (Janābah) due to sight.\n\nMajor impurity (Janābah) due to a dream.\n\nStanding parallel to a woman in a general shared prayer in the same space without a barrier, if the Imam intended to lead her.\n\nExposure of the ‘awrah (intimate parts) for one who lost purity, even if forced (e.g., a woman exposing her arm to perform ablution).\n\nReciting while going to or returning from ablution.\n\nRemaining for the duration of a pillar (Rukn) after having lost purity, while awake.\n\nPassing water nearby for someone else.\n\nLeaving the mosque thinking one has lost purity.\n\nCrossing the rows (or one's Sutrah) outside the mosque while thinking one lost purity.\n\nLeaving the prayer thinking one is not in a state of purity.\n\nThinking the duration for wiping over socks has expired.\n\nThinking one has a missed prayer or impurity.\n\n[Item number 54 was missing from your source list]\n\nCorrecting someone other than one's own Imam.\n\nSaying Takbīr with the intention of transitioning to a different prayer.\n\nExtending the Hamzah in the opening Takbīr.\n\nReciting from a Mushaf (Qur'an) what one does not have memorized.\n\nPerforming a pillar while ‘awrah is exposed.\n\nPerforming a pillar while bearing forbidden impurity.\n\nPreceding the Imam by a pillar without the Imam catching up.\n\nFollowing the Imam in the Prostration of Forgetfulness (Sajdat al-Sahw) for a Masbūq (late follower).\n\nFailing to repeat the final sitting after remembering a missed prostration.\n\nFailing to repeat a pillar performed while asleep.\n\nLoud laughter (Qahqahah) by the Imam of a Masbūq.\n\nIntentional loss of purity after the final sitting.\n\nPerforming Salām after two cycles in a prayer other than a two-cycle one, thinking one is a traveler, or it is Friday, or Tarawih (when it is actually ‘Isha).\n\nBeing new to Islam and thinking the obligatory prayer consists of only two cycles."},{"id":"n491","q":"Does speaking by mistake or accident invalidate the prayer?","a":"Yes."},{"id":"n492","q":"Does supplicating with language similar to human speech invalidate the prayer?","a":"Yes."},{"id":"n493","q":"What happens if one performs Salām with the intention of greeting someone, even by mistake?","a":"The prayer is invalidated."},{"id":"n494","q":"Does returning a greeting verbally or shaking hands invalidate the prayer?","a":"Yes."},{"id":"n495","q":"What is \"excessive movement\" (‘Amal Kathīr) in the context of invalidating prayer?","a":"It is an act that causes a bystander to conclude that the person is not in prayer."},{"id":"n496","q":"Does turning the chest away from the Qiblah invalidate the prayer?","a":"Yes."},{"id":"n497","q":"Does eating a small amount of food from outside the mouth invalidate the prayer?","a":"Yes."},{"id":"n498","q":"What is the rule regarding eating food particles found between the teeth?","a":"It invalidates the prayer if the particle is the size of a chickpea."},{"id":"n499","q":"Does drinking invalidate the prayer?","a":"Yes."},{"id":"n500","q":"Is clearing the throat an invalidator?","a":"It invalidates the prayer unless there is a valid excuse."},{"id":"n501","q":"Do \"uffing,\" moaning, or groaning invalidate the prayer?","a":"Yes."},{"id":"n502","q":"Does crying out loud due to pain or tragedy invalidate the prayer?","a":"Yes."},{"id":"n503","q":"Does crying due to remembering Paradise or Hell invalidate the prayer?","a":"No."},{"id":"n504","q":"Does saying \"Yarḥamukallāh\" to someone who sneezes invalidate the prayer?","a":"Yes."},{"id":"n505","q":"Does responding to an inquiry with \"Lā ilāha illallāh\" invalidate the prayer?","a":"Yes."},{"id":"n506","q":"Does responding to bad news with Istirjā‘ (Inna lillāhi...) invalidate the prayer?","a":"Yes."},{"id":"n507","q":"Does saying \"Alḥamdulillāh\" or \"Subḥānallāh\" to express news or surprise invalidate the prayer?","a":"Yes."},{"id":"n508","q":"Does reciting a verse with the intent to provide an answer invalidate the prayer?","a":"Yes."},{"id":"n509","q":"What happens to the prayer of someone using Tayammum if they see water?","a":"Their prayer is invalidated."},{"id":"n510","q":"Does the completion of the time period for wiping over leather socks (Khuff) or removing them invalidate the prayer?","a":"Yes."},{"id":"n511","q":"Does an illiterate person learning a verse during prayer invalidate their prayer?","a":"Yes."},{"id":"n512","q":"Does finding a covering during prayer invalidate the prayer of someone who was praying while naked?","a":"Yes."},{"id":"n513","q":"Does a person praying by gesture invalidating their prayer if they become able to bow and prostrate?","a":"Yes."},{"id":"n514","q":"Does remembering a missed prayer invalidate the current prayer for one who is obligated to follow the sequence?","a":"Yes."},{"id":"n515","q":"What happens if a person appoints a deputy who is not qualified to be an Imam?","a":"The prayer is invalidated."},{"id":"n516","q":"Does sunrise during Fajr or Zawāl during Eid prayer invalidate the prayer?","a":"Yes."},{"id":"n517","q":"Does the arrival of ‘Asr time during Friday prayer invalidate it?","a":"Yes."},{"id":"n518","q":"What happens if a splint (Jabīrah) falls off after the wound has healed during prayer?","a":"The prayer is invalidated."},{"id":"n519","q":"Does the cessation of the excuse for a person with a chronic condition (Ma‘dhūr) invalidate the prayer?","a":"Yes."},{"id":"n520","q":"Does experiencing ritual impurity (Ḥadath), whether intentionally or caused by another, invalidate the prayer?","a":"Yes."},{"id":"n521","q":"Does fainting invalidate the prayer?","a":"Yes."},{"id":"n522","q":"Do insanity or experiencing Janābah (major impurity) through sight or a dream invalidate prayer?","a":"Yes."},{"id":"n523","q":"In what specific scenario does standing parallel to a woman invalidate a man's prayer?","a":"If they are in a shared space without a barrier and the Imam intended to lead her."},{"id":"n524","q":"Does exposing the ‘awrah while performing ablution invalidate the prayer?","a":"Yes, for one who has already lost ritual purity."},{"id":"n525","q":"Does reciting while going to or returning from ablution invalidate the prayer?","a":"Yes."},{"id":"n526","q":"Does remaining in a pillar (Rukn) for the duration of its performance while awake and in a state of impurity invalidate the prayer?","a":"Yes."},{"id":"n527","q":"What is the effect of leaving the mosque or crossing rows while thinking one has lost purity?","a":"It invalidates the prayer."},{"id":"n528","q":"Does thinking the time for wiping over socks has expired invalidate the prayer?","a":"Yes."},{"id":"n529","q":"Does correcting someone other than one’s own Imam invalidate the prayer?","a":"Yes."},{"id":"n530","q":"Does extending the Hamzah in the opening Takbīr invalidate the prayer?","a":"Yes."},{"id":"n531","q":"Does reading from a Mushaf what one has not memorized invalidate the prayer?","a":"Yes."},{"id":"n532","q":"What happens if a follower precedes the Imam by a pillar and the Imam does not catch up?","a":"The prayer is invalidated."},{"id":"n533","q":"Does a Masbūq (late follower) invalidate his prayer by following the Imam in the Prostration of Forgetfulness?","a":"Yes."},{"id":"n534","q":"Does loud laughter (Qahqahah) by the Imam of a Masbūq invalidate the prayer?","a":"Yes."},{"id":"n535","q":"Does intentional loss of purity after the final sitting invalidate the prayer?","a":"Yes."},{"id":"n536","q":"If a person performs Salām after two cycles of a four-cycle prayer, thinking they are a traveler, what happens?","a":"The prayer is invalidated."},{"id":"n537","q":"Does a new Muslim’s assumption that an obligatory prayer is only two cycles invalidate their prayer?","a":"Yes."},{"id":"n538","q":"Does looking at something written and understanding it invalidate the prayer?","a":"No."},{"id":"n539","q":"What is the rule on swallowing food particles between the teeth?","a":"It does not invalidate the prayer if they are smaller than a chickpea and no excessive movement is used."},{"id":"n540","q":"If someone walks in front of a person praying, is the prayer invalidated?","a":"No, the prayer is valid, though the person passing in front is sinful."}]},{"title":"What is disliked in prayer","cards":[{"id":"n541","q":"Does looking at the private parts of a divorced wife with desire invalidate the prayer?","a":"No, in the preferred opinion, even though this act might technically establish a return to the marriage."},{"id":"n542","q":"What are the things disliked (Makrūh) for the one praying?","a":"There are seventy-seven things that are disliked (Makrūh) for the\none praying:\n\n1–2. Intentionally\nomitting a Wājib (obligatory act) or a Sunnah.\n\n3. Fidgeting with\none's clothing or body.\n\n4. Turning over\npebbles (except once for prostration).\n\n5–6. Cracking\none's knuckles or interlocking fingers.\n\n7. Resting hands on\nthe hips (Takhaṣṣur).\n\n8. Turning the neck\n(looking around).\n\n9. Sitting like a\ndog (Iq‘ā’—resting buttocks on the ground with knees raised).\n\n10. Spreading the\nforearms on the ground while prostrating.\n\n11. Rolling up one's\nsleeves.\n\n12. Praying in\ntrousers alone when one is able to wear a shirt/robe.\n\n13. Returning a\ngreeting with a gesture.\n\n14. Sitting\ncross-legged without a valid excuse.\n\n15. Tying/bundling\nthe hair.\n\n16. I‘tijār\n(tying a headscarf in a way that leaves the middle of the head\nexposed).\n\n17–18. Tucking up\none's clothes or letting them hang loosely (Sadl).\n\n19. Wrapping oneself\nin a garment so that one's hands remain inside.\n\n20. Placing a\ngarment under the right armpit and throwing both ends over the left\nshoulder.\n\n21. Reciting while\nin a position other than standing.\n\n22. Prolonging the\nfirst cycle in voluntary (Nafl) prayers.\n\n23. Prolonging the\nsecond cycle beyond the first in any prayer.\n\n24. Repeating the\nsame Sūrah in a single cycle of an obligatory prayer.\n\n25. Reciting a Sūrah\nthat appears after the one already recited (out of order).\n\n26. Separating two\nrecited Sūrahs with another Sūrah between them in two cycles.\n\n27. Smelling\nperfume.\n\n28. Fanning oneself\nwith a garment or fan once or twice.\n\n30–31. Turning the\nfingers of the hands or toes away from the Qiblah during prostration\nor otherwise.\n\n32. Failing to place\nhands on the knees during bowing (Rukū‘).\n\n33. Yawning.\n\n34–35. Closing\none's eyes or raising them toward the sky.\n\n36. Stretching\n(Tamattī).\n\n37. Engaging in\nminor movement.\n\n38–39. Catching\nand killing a louse.\n\n40–41. Covering\nthe nose and mouth.\n\n42. Placing\nsomething in the mouth that prevents proper recitation.\n\n43–44. Prostrating\non the excess folds of a turban or on a picture.\n\n45. Limiting\nprostration to the forehead without the nose (without excuse).\n\n46–51. Praying in\nthe following locations: on a road, in a bathhouse, in a restroom, in\na graveyard, on someone else's land without their permission, or near\nfilth.\n\n52. Praying while\nsuppressing the urge to urinate, defecate, or pass gas.\n\n54. Praying with\nnon-liquid filth (unless one fears missing the prayer time or\ncongregation; otherwise, it is recommended to stop and clean it).\n\n55–59. Praying in\nwork clothes, with an uncovered head (unless for humility and\nsupplication), in the presence of food one desires, or while\ndistracted by anything that impairs focus (Khushū‘).\n\n60. Counting the\nverses while reciting.\n\n61. Counting Tasbīḥ\nwith the hand.\n\n62–64. An Imam\nstanding alone in the prayer niche (Miḥrāb), on an elevated\nplatform, or on the ground while the congregation is elsewhere.\n\n65. Standing behind\na row that has a gap in it.\n\n66. Wearing clothing\ncontaining pictures.\n\n67–70. Having a\npicture above one's head, behind one, in front of one, or beside one\n(unless it is small, headless, or of an inanimate object).\n\n71–73. Having an\noven, a coal brazier, or sleeping people in front of one.\n\n74. Wiping dust from\nthe forehead during prayer if it causes no harm.\n\n75–76.\nSpecifically choosing a Sūrah to recite such that one never recites\nanything else (unless it is easier or done as a blessing by following\nthe Prophet's practice).\n\n77. Failing to place\na Sutrah (barrier) in a place where one expects people to pass in\nfront of them."},{"id":"n543","q":"What is the ruling on intentionally omitting a Wājib (obligatory) act or a Sunnah in prayer?","a":"It is Makrūh (disliked)."},{"id":"n544","q":"Is fidgeting with clothing or one's body permitted in prayer?","a":"No, it is Makrūh."},{"id":"n545","q":"Can one turn over pebbles while praying?","a":"It is Makrūh, except for doing it once to clear the place for prostration."},{"id":"n546","q":"Is it permissible to crack knuckles or interlock fingers during prayer?","a":"No, both are Makrūh."},{"id":"n547","q":"What is Takhaṣṣur and what is its ruling in prayer?","a":"Takhaṣṣur is resting the hands on the hips; it is Makrūh."},{"id":"n548","q":"Is turning the neck or looking around disliked in prayer?","a":"Yes."},{"id":"n549","q":"What is Iq‘ā’ (sitting like a dog)?","a":"Resting the buttocks on the ground while the knees are raised."},{"id":"n550","q":"What is the ruling on spreading the forearms on the ground while prostrating?","a":"It is Makrūh."},{"id":"n551","q":"Is rolling up sleeves while praying Makrūh?","a":"Yes."},{"id":"n552","q":"Is it disliked to pray in only trousers if one has the ability to wear a shirt or robe?","a":"Yes."},{"id":"n553","q":"What is the ruling on returning a greeting with a gesture during prayer?","a":"It is Makrūh."},{"id":"n554","q":"Is sitting cross-legged during prayer permitted?","a":"It is Makrūh unless there is a valid excuse."},{"id":"n555","q":"What is the ruling on tying or bundling the hair during prayer?","a":"It is Makrūh."},{"id":"n556","q":"What is I‘tijār?","a":"Tying a headscarf in a way that leaves the middle of the head exposed."},{"id":"n557","q":"Are tucking up clothes or letting them hang loosely (Sadl) disliked?","a":"Yes, both are Makrūh."},{"id":"n558","q":"Is it disliked to wrap oneself in a garment while keeping the hands inside?","a":"Yes."},{"id":"n559","q":"What is the disliked way of wrapping a garment involving the armpits and shoulders?","a":"Placing the garment under the right armpit and throwing both ends over the left shoulder."},{"id":"n560","q":"Is it disliked to recite Qur'an while in a position other than standing?","a":"Yes."},{"id":"n561","q":"What is the ruling on intentionally making the first cycle longer than the second in Nafl prayers?","a":"It is Makrūh."},{"id":"n562","q":"Is it disliked to make the second cycle longer than the first in any prayer?","a":"Yes."},{"id":"n563","q":"What is the rule regarding repeating the same Sūrah in one cycle of an obligatory prayer?","a":"It is Makrūh."},{"id":"n564","q":"Is it disliked to recite a Sūrah that appears earlier in the Qur'an after one that appears later (out of order)?","a":"Yes."},{"id":"n565","q":"Is it Makrūh to separate two recited Sūrahs with another Sūrah between them in two cycles?","a":"Yes."},{"id":"n566","q":"Is smelling perfume during prayer disliked?","a":"Yes."},{"id":"n567","q":"Does fanning oneself with a garment or fan once or twice constitute a Makrūh act?","a":"Yes."},{"id":"n568","q":"Is it Makrūh to turn fingers or toes away from the Qiblah during prostration?","a":"Yes."},{"id":"n569","q":"Is it disliked to fail to place hands on the knees during Rukū‘?","a":"Yes."},{"id":"n570","q":"Is yawning disliked in prayer?","a":"Yes."},{"id":"n571","q":"Is it Makrūh to close one's eyes or raise them toward the sky during prayer?","a":"Yes."},{"id":"n572","q":"Is stretching (Tamattī) in prayer disliked?","a":"Yes."},{"id":"n573","q":"Is engaging in minor movement Makrūh?","a":"Yes."},{"id":"n574","q":"What is the ruling on catching and killing a louse while praying?","a":"It is Makrūh."},{"id":"n575","q":"Is covering the nose and mouth during prayer disliked?","a":"Yes."},{"id":"n576","q":"Does placing something in the mouth that hinders proper recitation constitute a Makrūh act?","a":"Yes."},{"id":"n577","q":"Is it disliked to prostrate on the excess folds of a turban or on a picture?","a":"Yes."},{"id":"n578","q":"Is it Makrūh to limit prostration to the forehead without the nose, without a valid excuse?","a":"Yes."},{"id":"n579","q":"What are some of the disliked locations for prayer?","a":"A road, a bathhouse, a restroom, a graveyard, someone else's land without permission, or near filth."},{"id":"n580","q":"Is it Makrūh to pray while suppressing the urge to urinate, defecate, or pass gas?","a":"Yes."},{"id":"n581","q":"What is the ruling on praying while wearing non-liquid filth?","a":"It is Makrūh, unless one fears missing the prayer time or congregation; if not, it is recommended to stop and clean it."},{"id":"n582","q":"Is it disliked to pray in work clothes or with an uncovered head?","a":"Yes, it is Makrūh (unless an uncovered head is for humility and supplication)."},{"id":"n583","q":"What is the ruling on praying when distracted by food one desires or anything that impairs Khushū‘?","a":"It is Makrūh."},{"id":"n584","q":"Is counting verses during recitation or counting Tasbīḥ with the hand disliked?","a":"Yes, both are Makrūh."},{"id":"n585","q":"Is it disliked for an Imam to stand alone in the Miḥrāb, on an elevated platform, or isolated from the congregation?","a":"Yes."},{"id":"n586","q":"Is it Makrūh to stand behind a row that has a gap in it?","a":"Yes."},{"id":"n587","q":"What is the ruling on wearing clothes with pictures, or having pictures in one's immediate surroundings?","a":"It is Makrūh (unless the picture is small, headless, or of an inanimate object)."},{"id":"n588","q":"Is it disliked to have an oven, a coal brazier, or sleeping people in front of one while praying?","a":"Yes."},{"id":"n589","q":"Is it Makrūh to wipe dust from the forehead during prayer if it causes no harm?","a":"Yes."},{"id":"n590","q":"What is the ruling on specifically choosing only one Sūrah to recite and never changing it?","a":"It is Makrūh (unless it is easier or done as a blessing by following the Prophet's practice)."},{"id":"n591","q":"Is it Makrūh to fail to place a Sutrah (barrier) where people are expected to pass by?","a":"Yes."},{"id":"n592","q":"What are the recommended dimensions for a Sutrah?","a":"At least one cubit high and at least the thickness of a finger."},{"id":"n593","q":"Where should one position themselves in relation to the Sutrah?","a":"It is Sunnah to stand close to it and slightly to one side, not directly in front."},{"id":"n594","q":"What can one do if they cannot find an object to serve as a Sutrah?","a":"One may draw a line on the ground, either lengthwise or in an arc like a crescent."},{"id":"n595","q":"What is the preferred stance regarding repelling someone passing in front of one's prayer?","a":"It is preferred to refrain from repelling the person."},{"id":"n596","q":"What methods are permitted for repelling a passerby?","a":"Gesturing or reciting Tasbīḥ (though combining both is disliked)."},{"id":"n597","q":"How may a man repel a passerby using his voice?","a":"By raising his voice in recitation."},{"id":"n598","q":"How does a woman repel a passerby?","a":"By gesturing or by clapping the back of her right fingers against her left palm."},{"id":"n599","q":"Why should a woman not raise her voice to repel a passerby?","a":"Because it may be a source of distraction (Fitnah)."},{"id":"n600","q":"What is the ruling on physically fighting a person passing in front of the prayer?","a":"It is not permitted; reports suggesting otherwise are considered abrogated or specific to certain contexts."},{"id":"n601","q":"Is it disliked to tie a belt or sash around the waist during prayer?","a":"No."},{"id":"n602","q":"Is it disliked to wear a sword or similar item during prayer?","a":"No, provided it does not require excessive movement."},{"id":"n603","q":"What is the preferred view regarding having hands inside the openings of clothing/sleeves?","a":"It is not disliked."},{"id":"n604","q":"Is it disliked to face a Mushaf, a hanging sword, a lamp, a candle, or the back of a seated person who is talking?","a":"No."},{"id":"n605","q":"What is the ruling on prostrating on a rug that contains images?","a":"It is not disliked, provided one does not prostrate upon the images themselves."},{"id":"n606","q":"Is it permissible to kill a snake or scorpion if one fears harm?","a":"Yes, even if it requires several blows."},{"id":"n607","q":"Is shifting away from the Qiblah considered a Makrūh act?","a":"No, according to the most apparent opinion."},{"id":"n608","q":"Is it disliked to shake one's garment to prevent it from sticking during Rukū‘?","a":"No."},{"id":"n609","q":"When is it permissible to wipe dust from the forehead?","a":"After the prayer, or during the prayer if it is harmful or distracting."},{"id":"n610","q":"Is it disliked to look with the corners of the eyes without turning the face?","a":"No."},{"id":"n611","q":"Is it permissible to pray on carpets or felt mats?","a":"Yes, though it is better to pray on the ground or on what the earth grows."},{"id":"n612","q":"Is it disliked to repeat a Sūrah in two cycles of Nafl prayer?","a":"No."},{"id":"n613","q":"When is it obligatory to interrupt one's prayer?","a":"To answer the distress call of someone in peril (such as someone drowning or caught in a fire)."},{"id":"n614","q":"Is it obligatory to interrupt prayer to answer the call of one's parents?","a":"No."},{"id":"n615","q":"In what situations is it permissible to interrupt one's prayer?","a":"To prevent the theft of an item worth at least one Dirham, to save sheep from a wolf, or to prevent a blind person from falling into a well."},{"id":"n616","q":"What is the ruling for a midwife regarding the interruption of prayer?","a":"She must delay or interrupt the prayer if she fears for the life of a child; if there is no such fear, she may delay the prayer to focus on the child."},{"id":"n617","q":"Is a traveler permitted to delay prayer if they fear highway robbers?","a":"Yes."},{"id":"n618","q":"What is the prescribed response to someone who intentionally neglects prayer or the Ramadan fast due to laziness?","a":"They are to be punished severely (until blood is drawn) and imprisoned until they perform the act."},{"id":"n619","q":"Under what conditions would one be executed for neglecting prayer or fasting?","a":"Only if they deny the obligation of these acts or treat them with contempt."}]},{"title":"Witr and voluntary prayers","cards":[{"id":"n620","q":"What is the ruling on the Witr prayer?","a":"It is Wājib (obligatory)."},{"id":"n621","q":"How many cycles (Rak‘āt) are in the Witr prayer?","a":"Three cycles with one Salām at the end."},{"id":"n622","q":"Is there a sitting after the first two cycles of Witr?","a":"Yes, and one performs only the Tashahhud."},{"id":"n623","q":"Does one recite the opening supplication (Istiftāḥ) when standing for the third cycle of Witr?","a":"No."},{"id":"n624","q":"What is the procedure for the Qunūt in the third cycle of Witr?","a":"After finishing the Sūrah, one raises their hands to the ears, says Takbīr, and performs the Qunūt while standing before bowing."},{"id":"n625","q":"Is Qunūt performed in prayers other than Witr?","a":"No."},{"id":"n626","q":"What is the literal meaning of Qunūt?","a":"Supplication."},{"id":"n627","q":"Are followers expected to follow the Imam during the Qunūt?","a":"Yes."},{"id":"n628","q":"According to Abu Yusuf, what should followers do when the Imam begins the additional supplication after the Qunūt?","a":"Follow him and recite it with him."},{"id":"n629","q":"According to Muhammad, what should followers do when the Imam begins the additional supplication after the Qunūt?","a":"They should not recite with him, but should say \"Amin.\""},{"id":"n630","q":"What does one say for Qunut?","a":"Allāhumma innā nasta‘īnuka wa nastahdīka wa nastaghfiruka wa natūbu ilayka wa nu’minu bika wa natawakkalu ‘alayk, wa nuthnī ‘alayka-l-khayra kullahu nashkuruka wa lā nakfuruka wa nakhla‘u wa natruku man yafjuruk. Allāhumma iyyāka na‘budu wa laka nuṣallī wa nasjudu wa ilayka nas‘ā wa naḥfidu narjū raḥmataka wa nakhshā ‘adhābak, inna ‘adhābaka-l-jadda bi-l-kuffāri mulḥiq. Wa ṣallallāhu ‘alan-nabiyyi wa ālihī wa sallam.\""},{"id":"n631","q":"What’s the supplication after Qunut?","a":"\"Allāhumma-hdinā bi-faḍlika fīman hadayt, wa ‘āfinā fīman ‘āfayt, wa tawallanā fīman tawallayt, wa bārik lanā fīmā a‘ṭayt, wa qinā sharra mā qaḍayt, innaka taqḍī wa lā yuqḍā ‘alayk, innahū lā yadhillu man wālayt wa lā ya‘izzu man ‘ādayt, tabārakta rabbanā wa ta‘ālayt, wa ṣallallāhu ‘alā Muḥammadin wa ālihī wa ṣaḥbihī wa sallam.\""},{"id":"n632","q":"What can one say if they do not know the Qunūt?","a":"One may say \"Allāhumma-ghfir lī\" (3 times), \"Rabbanā ātinā...\" (the Rabbanā verse), or \"Yā Rabb, Yā Rabb, Yā Rabb.\""},{"id":"n633","q":"What should a follower do if their Imam performs Qunūt in Fajr prayer?","a":"Stand silently with him and let the hands hang at the sides (according to the most apparent opinion)."},{"id":"n634","q":"What is the rule if one forgets the Qunūt in Witr and remembers it during or after bowing?","a":"One does not perform it."},{"id":"n635","q":"What is the consequence of performing Qunūt after rising from bowing?","a":"One does not return to bowing, but performs Sujūd al-Sahw because the Qunūt was moved from its place."},{"id":"n636","q":"If the Imam bows before the follower finishes or begins Qunūt, what should the follower do?","a":"Follow the Imam if they fear missing the bowing."},{"id":"n637","q":"What should a follower do if the Imam omits the Qunūt?","a":"Perform it if they can catch up with the Imam in bowing; otherwise, follow the Imam."},{"id":"n638","q":"If one catches the Imam in the bowing of the third cycle of Witr, is the Qunūt made up?","a":"No, it is considered caught."},{"id":"n639","q":"When is Witr performed in congregation?","a":"Only during Ramadan."},{"id":"n640","q":"Is it better to pray Witr in congregation during Ramadan or alone at the end of the night?","a":"According to Qadi Khan, it is better in congregation during Ramadan, though others hold the contrary view."},{"id":"n641","q":"What are the emphasized (Mu’akkadah) Sunnah prayers mentioned?","a":"Two before Fajr, two after Zuhr, two after Maghrib, two after ‘Ishā’, four before Zuhr, and those associated with Jumu‘ah (before and after)."},{"id":"n642","q":"How should the Sunnah prayer after Jumu‘ah be performed?","a":"With one Salām."},{"id":"n643","q":"How many cycles are recommended (Mandūb) before ‘Aṣr?","a":"Four cycles."},{"id":"n644","q":"How many cycles are recommended (Mandūb) before ‘Ishā’?","a":"Four cycles."},{"id":"n645","q":"How many cycles are recommended (Mandūb) after ‘Ishā’?","a":"Four cycles."},{"id":"n646","q":"How many cycles are recommended (Mandūb) after Maghrib?","a":"Six cycles."},{"id":"n647","q":"In a four-cycle emphasized voluntary prayer, what is recited in the first sitting?","a":"One limits oneself to Tashahhud."},{"id":"n648","q":"Is the opening supplication recited in the subsequent cycles of an emphasized voluntary prayer?","a":"No (unlike recommended prayers)."},{"id":"n649","q":"Is it valid to pray a voluntary prayer of more than two cycles without sitting until the very end?","a":"Yes, it is valid; the sitting at the end is the obligation."},{"id":"n650","q":"Is it disliked to exceed four cycles with one Salām during the day?","a":"Yes."},{"id":"n651","q":"Is it disliked to exceed eight cycles with one Salām at night?","a":"Yes."},{"id":"n652","q":"According to which view is the fatwa based regarding units of prayer at night?","a":"According to the two students (Abu Yusuf and Muhammad), it is preferred to pray in units of two at night."},{"id":"n653","q":"Which is superior: night prayer or day prayer?","a":"Night prayer."},{"id":"n654","q":"Which is more beloved: longer standing or frequent prostration?","a":"Longer standing."},{"id":"n655","q":"What is the ruling on Taḥiyyat al-Masjid (greeting the mosque)?","a":"It is Sunnah to perform two cycles before sitting."},{"id":"n656","q":"Does an obligatory prayer replace the need for Taḥiyyat al-Masjid?","a":"Yes, as does any other prayer performed upon entering, even without the specific intention of Taḥiyyat."},{"id":"n657","q":"When is it recommended to perform two cycles of prayer after Wudū’?","a":"Before the limbs dry."},{"id":"n658","q":"How many cycles are recommended for Duḥā (forenoon) prayer?","a":"Four cycles or more."},{"id":"n659","q":"What are some other recommended voluntary prayers mentioned?","a":"Night prayer (Tahajjud), the Prayer of Seeking Guidance (Istikhārah), and the Prayer of Need (Ḥājah)."},{"id":"n660","q":"Which nights is it recommended to observe?","a":"The last ten nights of Ramadan, the two nights of Eid, the first ten nights of Dhu al-Hijjah, and the middle night (15th) of Sha'ban."},{"id":"n661","q":"What is the ruling on gathering in mosques in congregation specifically to observe these nights?","a":"It is disliked (Makrūh)."},{"id":"n662","q":"Is it permissible to perform voluntary prayers while seated even if one is able to stand?","a":"Yes, though one receives only half the reward, unless there is a valid excuse."},{"id":"n663","q":"What is the preferred method for sitting during a voluntary prayer?","a":"To sit as one would for Tashahhud."},{"id":"n664","q":"Can one finish a voluntary prayer seated if they started it while standing?","a":"Yes, according to the most sound opinion, and it is not disliked."},{"id":"n665","q":"Where is it permissible to perform voluntary prayer while riding?","a":"Outside the city."},{"id":"n666","q":"How does one perform prayer while riding?","a":"By gesturing (Īmā') towards whatever direction the animal faces."},{"id":"n667","q":"What happens if one dismounts during the prayer?","a":"One continues the prayer (built upon the previous part)."},{"id":"n668","q":"What happens if one mounts an animal during the prayer?","a":"One does not continue the prayer, even for regular Sunnah prayers."},{"id":"n669","q":"What is the view regarding the Sunnah of Fajr while riding?","a":"It is reported from Abu Hanifah that one should dismount because it is highly emphasized."},{"id":"n670","q":"Is it disliked to lean on something while praying a voluntary prayer if one is tired?","a":"No."},{"id":"n671","q":"Is it disliked to lean on something while praying a voluntary prayer without an excuse?","a":"Yes, according to the most apparent opinion, as it shows a lack of etiquette."},{"id":"n672","q":"In Islamic jurisprudence, does the presence of impurity on a riding animal (such as on the saddle or stirrups) invalidate a voluntary prayer performed while riding?","a":"No, it does not invalidate the prayer according to the most sound opinion."},{"id":"n673","q":"What is the ruling on performing prayer while walking?","a":"It is invalid by unanimous agreement (Ijmā‘)."},{"id":"n674","q":"Is it valid to perform Farḍ (obligatory) prayers while on a riding animal?","a":"No, it is not valid to perform Farḍ prayers on a riding animal."},{"id":"n675","q":"Is it valid to perform Wājib prayers (such as Witr or fulfilled vows) while on a riding animal?","a":"No, it is not valid to perform Wājib prayers on a riding animal."},{"id":"n676","q":"Is it valid to perform Janāzah (funeral) prayer while on a riding animal?","a":"No, it is not valid."},{"id":"n677","q":"Can one perform Sujūd al-Tilāwah (prostration of recitation) while on a riding animal if the verse was recited on the ground?","a":"No, it is generally not valid."},{"id":"n678","q":"Under what specific conditions might one be permitted to perform Farḍ, Wājib, or Janāzah prayers while on a riding animal?","a":"Only out of necessity, such as fear of a thief, fear of a wild beast, extreme muddy conditions, an unmanageable animal, or physical inability to mount or dismount."},{"id":"n679","q":"What is the ruling on performing prayer inside a litter (Maḥmal) while it is on an animal?","a":"It is treated the same as praying on the animal itself, whether it is moving or standing still."},{"id":"n680","q":"Under what condition is it valid to perform an obligatory prayer while standing in a litter (Maḥmal) on an animal?","a":"If a piece of wood is placed under the litter so that it rests on the ground, it is treated like the ground."},{"id":"n681","q":"Is it valid to perform an obligatory prayer while seated on a moving ship without an excuse according to Abu Hanifah?","a":"Yes, it is valid to perform it while seated, provided one performs the bowing and prostration."}]},{"title":"Prayer of the sick and the traveller","cards":[{"id":"n682","q":"What is the view of Abu Yusuf and Muhammad regarding performing an obligatory prayer while seated on a moving ship without an excuse?","a":"They argued it is not valid, and this is considered the most apparent opinion."},{"id":"n683","q":"What are considered valid excuses for performing a prayer while seated on a ship?","a":"Valid excuses include dizziness (seasickness) or the inability to leave the ship."},{"id":"n684","q":"What is the ruling on performing prayer on a ship using only gestures (Īmā')?","a":"It is invalid by unanimous agreement (Ijmā‘)."},{"id":"n685","q":"How is a ship docked in the middle of the sea treated if it is moving violently due to the wind?","a":"It is treated like a moving ship, according to the soundest opinion."},{"id":"n686","q":"How is a ship docked in the middle of the sea treated if it is not moving violently?","a":"It is treated like a stationary ship, according to the soundest opinion."},{"id":"n687","q":"Is it valid to perform a prayer while seated on a ship tied to the shore?","a":"No, it is invalid by unanimous agreement."},{"id":"n688","q":"In what case is a prayer performed while standing on a ship considered valid if the ship is not tied to the shore?","a":"The prayer is valid if some part of the ship touches the ground; if it does not touch the ground, it is generally not valid unless it is impossible to leave the ship."},{"id":"n689","q":"If a person begins a prayer on a ship facing the Qiblah, what must they do if the ship turns during the prayer?","a":"They must adjust their orientation until they finish the prayer facing the Qiblah."},{"id":"n690","q":"What is the ruling on the Tarawih prayer for men and women?","a":"It is a Sunnah."},{"id":"n691","q":"What is the status of performing Tarawih in congregation?","a":"It is a communal Sunnah (Sunnah Kifayah)."},{"id":"n692","q":"When is the proper time to perform Tarawih?","a":"After the ‘Ishā’ prayer."},{"id":"n693","q":"Can the Witr prayer be performed before or after Tarawih?","a":"Yes, it is valid to do either."},{"id":"n694","q":"Is it recommended to delay Tarawih?","a":"Yes, it is recommended to delay it to the first third or half of the night."},{"id":"n695","q":"Is it disliked to delay Tarawih beyond the first half of the night?","a":"No, according to the soundest opinion, it is not disliked."},{"id":"n696","q":"How many cycles (Rak‘āt) and Salāms are in Tarawih?","a":"Twenty cycles with ten Salāms."},{"id":"n697","q":"Is there a recommended duration for sitting after every four cycles of Tarawih?","a":"Yes, it is recommended to sit for a duration equal to the time spent praying those four cycles."},{"id":"n698","q":"Does the recommendation to sit after four cycles also apply before Witr?","a":"Yes, it also applies between the fifth Tarawih unit and the Witr."},{"id":"n699","q":"What is the Sunnah regarding the recitation of the Qur'an during Tarawih?","a":"To complete the entire Qur'an once during the month of Ramadan."},{"id":"n700","q":"What should an Imam do if the congregation finds a full Qur'an completion difficult?","a":"They should recite as much as will not cause the congregation to flee."},{"id":"n701","q":"Is it permissible to omit blessings upon the Prophet (ﷺ) in Tarawih if the congregation finds it burdensome?","a":"No, one must not omit sending blessings upon the Prophet (ﷺ) in every Tashahhud."},{"id":"n702","q":"Is it permissible to omit the Thana’ (opening praise) or the Tasbīḥ of bowing and prostrating in Tarawih?","a":"No, these must not be omitted."},{"id":"n703","q":"Is it permissible to omit the supplication in Tarawih if it burdens the congregation?","a":"Yes, one should omit the supplication if it burdens the congregation."},{"id":"n704","q":"Can Tarawih be made up if missed?","a":"No, Tarawih cannot be made up if missed, whether praying alone or in congregation."},{"id":"n705","q":"Is it valid to perform obligatory and voluntary prayers inside or on top of the Ka‘bah?","a":"Yes, it is valid."},{"id":"n706","q":"Is a Sutrah required for prayer inside or on top of the Ka‘bah?","a":"No, it is valid even without a Sutrah."},{"id":"n707","q":"Why is it considered disliked to pray inside or on top of the Ka‘bah?","a":"It is disliked due to the lack of proper etiquette in being elevated above it."},{"id":"n708","q":"In a scenario where people are praying inside or on top of the Ka‘bah, what is the ruling regarding the direction one faces in relation to the Imam?","a":"It is valid to turn one's back to a direction other than the Imam's face; however, it is not valid to turn one's back toward the Imam's face."},{"id":"n709","q":"Is it valid to follow an Imam who is inside the Ka‘bah while you are outside?","a":"Yes, provided the door is open."},{"id":"n710","q":"If people form a circle around the Ka‘bah while the Imam is outside, is it valid for those in the circle to follow him?","a":"It is valid, except for those who are closer to the Ka‘bah in the same direction as the Imam."},{"id":"n711","q":"What is the minimum distance required for the Ṣalāt al-Musāfir (traveler's prayer) rulings to take effect?","a":"Three days' travel at a moderate pace, including breaks, based on the shortest days of the year."},{"id":"n712","q":"How is a \"moderate\" pace defined for determining the distance of a journey?","a":"By the pace of camels and walking on land, the equivalent pace in mountainous terrain, and the pace of a ship with a steady wind."},{"id":"n713","q":"When does a traveler begin shortening their four-cycle obligatory prayers?","a":"Once they pass the houses of their town and the surrounding outskirts (Fanā’)."},{"id":"n714","q":"What are the \"outskirts\" (Fanā’) of a town defined as?","a":"Areas prepared for the town's interests, such as livestock pens or burial grounds."},{"id":"n715","q":"Is it necessary to pass the outskirts if they are separated from the town by a farm or a distance of about a \"ghalwah\"?","a":"No, passing them is not required in that case."},{"id":"n716","q":"What are the three conditions required to establish the intention of travel for shortening prayers?","a":"Independence (not being a subordinate), puberty, and an intended travel distance of at least three days."},{"id":"n717","q":"Does a subordinate, such as a soldier with an emir or a woman with her husband, shorten their prayers based on their own intention?","a":"No, they do not shorten if they did not personally intend the travel, provided they are subordinate to the primary person's intention."},{"id":"n718","q":"Whose intention is considered for shortening prayers when a subordinate is traveling with a primary person?","a":"The intention of the primary person is considered, provided the subordinate knows that intention (according to the soundest opinion)."},{"id":"n719","q":"What is the legal status (hukm) of shortening prayers for a traveler?","a":"It is a firm command (‘Azīmah)."},{"id":"n720","q":"What is the ruling if a traveler performs all four cycles of a prayer and sits for the first Tashahhud?","a":"The prayer is valid, but it is considered disliked (makrūh)."},{"id":"n721","q":"If a traveler performs four cycles without sitting for the first Tashahhud, is the prayer valid?","a":"No, it is invalid, unless they intended to become a resident upon rising for the third cycle."},{"id":"n722","q":"How long does a traveler continue to shorten their prayers?","a":"Until they reach their home town or intend to stay in a city or village for at least half a month."},{"id":"n723","q":"Does a traveler stop shortening their prayers if they intend to stay in a city for less than half a month?","a":"No, they continue to shorten, even if they remain for years."},{"id":"n724","q":"In which locations is an intention to reside invalid?","a":"In two different towns without specifying one; in a wilderness area (except for tent dwellers); in enemy territory (for our army); or in our territory while under siege by rebels."},{"id":"n725","q":"What is the ruling if a traveler follows a resident Imam during the correct time?","a":"The traveler must complete the prayer (four cycles)."},{"id":"n726","q":"What is the ruling if a resident follows a traveler Imam?","a":"It is valid to do so."},{"id":"n727","q":"What is the recommended etiquette for a traveler-Imam before beginning the prayer?","a":"It is recommended to say: \"Complete your prayer, for I am a traveler.\""},{"id":"n728","q":"Does a resident who is completing their prayer after a traveler-Imam finishes recite the Qur’an?","a":"No, they do not recite while completing their prayer (according to the soundest opinion)."},{"id":"n729","q":"How are missed prayers made up when someone had missed them during a journey or while at home?","a":"Missed prayers from a journey are made up as two cycles, and those from residence are made up as four cycles."},{"id":"n730","q":"In determining whether to make up a missed prayer as two or four cycles, what is the deciding factor?","a":"The status (traveler or resident) of the person at the end of the prayer time."},{"id":"n731","q":"How is a Waṭan Aṣlī (permanent home) invalidated?","a":"Only by moving to a new permanent home."},{"id":"n732","q":"How is a Waṭan Iqāmah (residence home) invalidated?","a":"By moving to a new residence, by traveling, or by returning to one's permanent home."},{"id":"n733","q":"What defines a Waṭan Aṣlī (permanent home)?","a":"A place where one was born, married, or has intended to live indefinitely."},{"id":"n734","q":"What defines a Waṭan Iqāmah (residence home)?","a":"A place where one intends to stay for half a month or more."},{"id":"n735","q":"What is a Sukanā (settlement home)?","a":"A place where one intends to stay for less than half a month (which is not considered a Waṭan by researchers)."},{"id":"n736","q":"What should a sick person do if standing is impossible or difficult?","a":"They should pray seated, bowing and prostrating; if bowing and prostrating are also impossible, they should gesture (Īmā')."},{"id":"n737","q":"What criteria determines if a sick person is permitted to pray seated instead of standing?","a":"If standing is impossible or causes severe pain, fear of worsening, or delayed recovery."},{"id":"n738","q":"What is the preferred way to gesture (Īmā') if bowing and prostrating are impossible?","a":"One should pray seated, making the gesture for prostration lower than the gesture for bowing."},{"id":"n739","q":"Is it permissible to raise an object to one's face to prostrate upon while praying with gestures?","a":"It is not required, but if one does so and lowers their head onto it, the prayer is valid; otherwise, it is not."},{"id":"n740","q":"If a sick person cannot sit, what is the preferred position for prayer?","a":"Gesturing while lying on one's back (which is better) or on one's side, with a pillow under the head to direct the face toward the Qiblah."},{"id":"n741","q":"What is the recommended position for the knees if a sick person is lying down for prayer?","a":"It is recommended to bend the knees if possible so they do not stretch out directly toward the Qiblah."},{"id":"n742","q":"What should be done if a sick person is unable to pray even by gesturing?","a":"The prayer is delayed as long as one retains consciousness and understanding."},{"id":"n743","q":"Under what condition is the obligation to make up missed prayers dropped for a sick person?","a":"If one is unable to gesture for a duration exceeding five prayers."},{"id":"n744","q":"How should one pray if they are able to stand but are unable to bow or prostrate?","a":"One should pray seated by gesturing (Īmā')."},{"id":"n745","q":"What should one do if sickness occurs during a prayer?","a":"One finishes the prayer as they are able, even by gesturing (according to the popular view)."},{"id":"n746","q":"If one starts a prayer while seated (with full bowing/prostration) and then becomes unable to do so, what should they do?","a":"One continues the prayer as they are able."},{"id":"n747","q":"If one starts a prayer by gesturing and then becomes able to stand and bow/prostrate, what should they do?","a":"One does not continue the prayer; they must restart it with the appropriate posture."},{"id":"n748","q":"How many missed prayers are required to be made up if a person becomes insane or unconscious?","a":"Only up to five prayers."},{"id":"n749","q":"Is a sick person required to leave a testament (Waṣiyyah) for missed prayers or fasts if they die while still unable to pray via gesture or before recovering?","a":"No, they are not required to leave a testament for them."}]},{"title":"Missed prayers and prostrations","cards":[{"id":"n750","q":"In what cases must a sick person leave a testament (Waṣiyyah) for missed prayers and fasts?","a":"When they missed them but were in a condition where they could have performed them (or made them up) but remained as a liability."},{"id":"n751","q":"What is the required rate of payment for each missed prayer and fast (including Witr) when performing Isqāṭ (expiation)?","a":"Half a Ṣā‘ of wheat (or its monetary value) per prayer or per day of fasting."},{"id":"n752","q":"From what portion of the deceased's estate is the Isqāṭ payment made?","a":"From one-third of the estate."},{"id":"n753","q":"If a deceased person did not leave a testament (Waṣiyyah) for their missed prayers or fasts, can the guardian perform the Isqāṭ on their behalf?","a":"Yes, a guardian may perform it voluntarily, and it is considered valid."},{"id":"n754","q":"Can a living person perform the physical acts of prayer or fasting on behalf of the deceased?","a":"No, one cannot physically pray or fast on behalf of the deceased."},{"id":"n755","q":"What is the \"legal trick\" (Ḥīlah) used if the deceased's estate is insufficient to cover the total amount of Isqāṭ?","a":"The guardian gives the amount to a poor person, the poor person gifts it back to the guardian, and the guardian gives it back to the poor person, repeating this cycle until the entire obligation is cleared."},{"id":"n756","q":"Is maintaining the sequence (Tartīb) mandatory between missed prayers (Fawā’it) and the current prayer?","a":"Yes, it is mandatory."},{"id":"n757","q":"Is maintaining the sequence mandatory among the missed prayers themselves?","a":"Yes, it is mandatory."},{"id":"n758","q":"What are the three exemptions to the requirement of maintaining order (Tartīb) in prayers?","a":"Shortage of the preferred time for the current prayer, forgetfulness, and if the number of missed prayers exceeds six (excluding Witr)."},{"id":"n759","q":"What is the ruling if one performs an obligatory prayer while remembering that they have a missed prayer?","a":"The prayer is invalid (conditionally)."},{"id":"n760","q":"What happens to the requirement of sequence if one finishes five subsequent prayers before remembering a missed one?","a":"The sequence is reset/waived."},{"id":"n761","q":"How can one simplify the process if they have a large number of missed prayers?","a":"One can simplify by intending, for example, the \"first\" or \"last\" Zuhr prayer that was missed."},{"id":"n762","q":"Are converts to Islam in enemy territory excused for missing prayers due to ignorance of religious laws?","a":"Yes, they are excused."},{"id":"n763","q":"If you have started an obligatory prayer alone and the congregation begins, what should you do?","a":"Break your prayer and join the congregation (unless you have already prostrated in a non-four-cycle prayer)."},{"id":"n764","q":"If you have already prostrated in a four-cycle prayer and the congregation begins, what is the procedure to join them?","a":"Complete a second cycle, perform the Salām (making the two cycles a voluntary prayer), and then join the congregational Farḍ."},{"id":"n765","q":"If you are performing the Sunnah of Jumu‘ah or Zuhr and the call to prayer for the Farḍ is heard, what should you do?","a":"Finish two cycles and then join the Farḍ."},{"id":"n766","q":"When joining an Imam who is already bowing, what is the condition for catching that cycle?","a":"You must join and reach the bowing position before the Imam rises; if the Imam rises before you reach the bowing position, you do not catch the cycle."},{"id":"n767","q":"Is it permitted to leave a mosque after the call to prayer has been made?","a":"It is disliked, unless it is to attend another congregation."},{"id":"n768","q":"What is the ruling on performing the same obligatory prayer twice in one session?","a":"It is not performed."},{"id":"n769","q":"What is the requirement for Sujūd al-Sahw (prostration of forgetfulness) when a Wājib act is omitted forgetfully?","a":"Two prostrations with a Tashahhud and Salām."},{"id":"n770","q":"Is Sujūd al-Sahw required if multiple Wājib acts are forgotten in a single prayer?","a":"Yes, two prostrations are sufficient even if multiple Wājib acts are omitted."},{"id":"n771","q":"What is the ruling if a Wājib act is omitted intentionally?","a":"It is a sin, and the prayer must be repeated to compensate for the deficiency."},{"id":"n772","q":"What are the three specific cases where Sujūd al-Sahw is performed despite an intentional omission?","a":"Omitting the first sitting, delaying a prostration from the first cycle to the end of the prayer, or intentional deep contemplation that distracts from a pillar (Rukn)."},{"id":"n773","q":"When is it Sunnah to perform the prostrations of forgetfulness?","a":"After the Salām."},{"id":"n774","q":"How many Salāms are sufficient when performing Sujūd al-Sahw?","a":"One Salām to the right is sufficient."},{"id":"n775","q":"What is the ruling on performing Sujūd al-Sahw before the Salām?","a":"It is slightly disliked (Makrūh Tanzīhī)."},{"id":"n776","q":"When is the obligation to perform Sujūd al-Sahw dropped?","a":"If the sun rises after the Salām (in Fajr), if the sun turns red (in ‘Aṣr), or if an action occurs that would invalidate the ability to \"build\" upon the prayer (Binā’) after the Salām."},{"id":"n777","q":"Does a follower (Ma’mūm) perform Sujūd al-Sahw if they commit a forgetful error?","a":"No, they follow the Imam's forgetfulness but do not perform it for their own errors."},{"id":"n778","q":"What does a latecomer (Masbūq) do regarding Sujūd al-Sahw if the Imam makes a mistake?","a":"They prostrate with the Imam, then stand to complete their missed cycles."},{"id":"n779","q":"Does a latecomer (Masbūq) perform Sujūd al-Sahw if they commit a forgetful error while completing their own missed cycles?","a":"Yes, they perform the prostration."},{"id":"n780","q":"Does a \"follower who joined late\" (Lāḥiq) perform Sujūd al-Sahw for their own mistakes?","a":"No, they do not."},{"id":"n781","q":"Is Sujūd al-Sahw performed by the Imam in Jumu‘ah or the two Eid prayers?","a":"No, the Imam does not perform it in these prayers."},{"id":"n782","q":"What is the ruling if one forgets the first sitting?","a":"One returns unless one has fully stood up (soundest view). A follower must return even if they stood up."},{"id":"n783","q":"What determines if one must perform Sujūd al-Sahw if they started to stand up and forgot the first sitting?","a":"If one was closer to standing, they must prostrate; if closer to sitting, they do not."},{"id":"n784","q":"What is the rule if one forgets the final sitting?","a":"One returns as long as one has not prostrated."},{"id":"n785","q":"What happens to the Farḍ prayer if one forgets the final sitting and prostrates?","a":"It becomes a voluntary prayer; one adds a sixth cycle (in ‘Aṣr) or a fourth (in Fajr) and does not need Sujūd al-Sahw (soundest view)."},{"id":"n786","q":"What should one do if they mistakenly think they completed a four-cycle prayer, say Salām, and then realize they only prayed two?","a":"One completes the remaining cycles and performs Sujūd al-Sahw."},{"id":"n787","q":"When does doubt regarding the number of cycles invalidate a prayer?","a":"If it occurs before completion and it is the first time such doubt has occurred or it is not a habitual occurrence for the person."},{"id":"n788","q":"Is doubt considered after the Salām?","a":"No, it is disregarded unless one is certain of an omission."},{"id":"n789","q":"If doubt is frequent, how should a person proceed?","a":"One acts upon their strongest assumption (Ghalib al-Zann)."},{"id":"n790","q":"What should a person with frequent doubt do if they have no strong assumption?","a":"One assumes the lesser number and sits after every cycle they think might be the last."},{"id":"n791","q":"What is the ruling on the Sujūd al-Tilāwah (prostration of recitation)?","a":"It is a Wājib act."},{"id":"n792","q":"How many verses require Sujūd al-Tilāwah in the Qur'an?","a":"There are 14 verses (specifically the first of the two in Sūrah al-Ḥajj)."},{"id":"n793","q":"Who is obligated to perform Sujūd al-Tilāwah upon hearing the verse?","a":"Anyone who hears it, even if they did not intend to listen, except for menstruating/post-partum women and the Imam/follower (who perform it after the prayer if heard from someone outside)."},{"id":"n794","q":"What is the procedure for performing Sujūd al-Tilāwah?","a":"One prostration between two Takbīrs (which are Sunnah), without raising hands, Tashahhud, or Salām."},{"id":"n795","q":"If one performs a bowing or prostration during prayer with the intention of this recitation, does it suffice?","a":"Yes, it suffices."},{"id":"n796","q":"What constitutes a \"change of assembly\" (Majlis) that ends the obligation to prostrate?","a":"Moving away, crossing a threshold, or swimming in a large body of water."},{"id":"n797","q":"Does moving to a corner of a room, walking two steps, sitting, standing, or eating a morsel count as a \"change of assembly\"?","a":"No, it does not."},{"id":"n798","q":"Is it disliked to read a Sūrah and omit the recitation verse?","a":"Yes, it is disliked."},{"id":"n799","q":"Is it recommended to prostrate while standing?","a":"Yes, it is recommended to prostrate while standing and to keep the recitation quiet if the listeners are unprepared."},{"id":"n800","q":"What is the ruling on Sujūd al-Shukr (prostration of gratitude) according to Abu Hanifah?","a":"It is considered Makrūh (disliked)."},{"id":"n801","q":"What is the ruling on Sujūd al-Shukr according to Abu Yusuf and Muhammad?","a":"They considered it a virtuous act (Qurbah) for which one is rewarded."},{"id":"n802","q":"How is Sujūd al-Shukr performed?","a":"Its performance is identical to the Prostration of Recitation (Sujūd al-Tilāwah)."},{"id":"n803","q":"According to Imam al-Nasafi in al-Kāfī, what is the benefit of reciting all the verses of prostration in one sitting and prostrating for each?","a":"Allah will suffice the person against whatever worries them."},{"id":"n804","q":"What is the legal status of Ṣalāt al-Jumu‘ah?","a":"It is an individual duty (Farḍ ‘Ayn)."},{"id":"n805","q":"What are the seven conditions for Jumu‘ah to be obligatory upon a person?","a":"Being male, free, resident (or in a resident's jurisdiction), healthy, safe from oppressors, and having functional sight and legs."},{"id":"n806","q":"What are the six conditions for the validity of Jumu‘ah?","a":"1. A city or outskirts; 2. An authority or deputy; 3. During the time of Zuhr; 4. A Khutbah before the prayer; 5. General permission; 6. A congregation of at least three men (other than the Imam)."}]},{"title":"Jumu'ah","cards":[{"id":"n807","q":"When does the time for Jumu‘ah begin and end?","a":"It must occur within the time of Zuhr; it is invalid before the time starts and void after it expires."},{"id":"n808","q":"What are the requirements for the Khutbah to be valid?","a":"It must occur before the prayer, be performed with the intention for it, occur during the time, and be attended by at least one person who satisfies the conditions for the validity of Jumu‘ah."},{"id":"n809","q":"If the congregation leaves the Jumu‘ah prayer after the prostration, what does the Imam do?","a":"The Imam completes the prayer alone."},{"id":"n810","q":"If the congregation leaves the Jumu‘ah prayer before the prostration, what is the status of the prayer?","a":"The prayer is void."},{"id":"n811","q":"Do women and children count toward the minimum of three men required for a valid congregation?","a":"No, they do not."},{"id":"n812","q":"How is a city (Miṣr) defined for the purpose of Jumu‘ah?","a":"It is a place that has a Mufti, an authority (Amīr), and a Qadi who executes rulings and penalties, and whose buildings are as dense as those in Mina."},{"id":"n813","q":"Does the Amīr or Qadi need to be a separate person
